explain":"权重共享对应平移不变性:同样的物体出现在不同位置，应该被同一个卷积核识别。局部连接对应局部性。"},{"id":230,"chapter":"卷积神经网络","type":"single","stem":"填充(padding)的作用是( )","options":[{"key":"A","text":"减小输出尺寸"},{"key":"B","text":"增加输出尺寸，常用于使输出与输入具有相同的高和宽"},{"key":"C","text":"增加参数量"},{"key":"D","text":"减少通道数"}],"answer":["B"],"answerText":"B","explain":"填充在输入边缘补零，增加输出的高度和宽度。常用于使输出与输入具有相同的高和宽。"},{"id":231,"chapter":"卷积神经网络","type":"single","stem":"步幅(stride)的作用是( )","options":[{"key":"A","text":"增加输出尺寸"},{"key":"B","text":"减小输出尺寸，控制下采样倍率"},{"key":"C","text":"增加参数量"},{"key":"D","text":"减少通道数"}],"answer":["B"],"answerText":"B","explain":"步幅是卷积核移动的步长，控制下采样倍率。步幅为 2，输出尺寸减半。"},{"id":232,"chapter":"卷积神经网络","type":"single","stem":"汇聚层的主要作用是( )","options":[{"key":"A","text":"增加参数量"},{"key":"B","text":"减轻卷积层对位置的过度敏感"},{"key":"C","text":"增加空间尺寸"},{"key":"D","text":"增加通道数"}],"answer":["B"],"answerText":"B","explain":"汇聚层的主要作用是减轻卷积层对位置的过度敏感。最大汇聚取窗口内最大值，平均汇聚取窗口内平均值。"},{"id":233,"chapter":"卷积神经网络","type":"single","stem":"汇聚层的输出通道数与输入通道数的关系是( )","options":[{"key":"A","text":"输出通道数大于输入通道数"},{"key":"B","text":"输出通道数小于输入通道数"},{"key":"C","text":"输出通道数等于输入通道数"},{"key":"D","text":"没有关系"}],"answer":["C"],"answerText":"C","explain":"汇聚层的输出通道数等于输入通道数。它不改变通道数，只改变空间尺寸。"},{"id":234,"chapter":"卷积神经网络","type":"single","stem":"最大汇聚层输出的是( )","options":[{"key":"A","text":"窗口内的最大值"},{"key":"B","text":"窗口内的平均值"},{"key":"C","text":"窗口内的最小值"},{"key":"D","text":"窗口内的和"}],"answer":["A"],"answerText":"A","explain":"最大汇聚层输出窗口内的最大值。平均汇聚层输出窗口内的平均值。"},{"id":235,"chapter":"卷积神经网络","type":"single","stem":"卷积核的参数是( )","options":[{"key":"A","text":"人工设计的"},{"key":"B","text":"从数据中学习的"},{"key":"C","text":"固定不变的"},{"key":"D","text":"随机生成的"}],"answer":["B"],"answerText":"B","explain":"卷积核的参数是从数据中学习的。人工设计的边缘检测卷积核只是用来解释卷积的直觉，不是实际使用的。"},{"id":236,"chapter":"卷积神经网络","type":"multi","stem":"关于填充和步幅，下列说法正确的是( )","options":[{"key":"A","text":"填充可以增加输出的高度和宽度"},{"key":"B","text":"步幅可以减小输出的高和宽"},{"key":"C","text":"填充和步幅可用于有效调整数据的维度"},{"key":"D","text":"填充 2、卷积核 5×5，可以让输出和输入一样大"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"填充增加输出尺寸，步幅减小输出尺寸。填充和步幅可用于调整数据维度。填充 2、卷积核 5×5，可以让输出和输入一样大。"},{"id":237,"chapter":"卷积神经网络","type":"multi","stem":"关于多输入多输出通道，下列说法正确的是( )","options":[{"key":"A","text":"多输入多输出通道可以扩展卷积层的模型"},{"key":"B","text":"1×1 卷积层相当于全连接层"},{"key":"C","text":"1×1 卷积层通常用于调整通道数量"},{"key":"D","text":"每个输出通道是一个不同的卷积核"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"多输入多输出通道可以扩展卷积层的模型。1×1 卷积层相当于在每个像素上做全连接，用于调整通道数量。每个输出通道是一个不同的卷积核。"},{"id":238,"chapter":"卷积神经网络","type":"multi","stem":"关于汇聚层，下列说法正确的是( )","options":[{"key":"A","text":"最大汇聚层输出窗口内的最大值"},{"key":"B","text":"平均汇聚层输出窗口内的平均值"},{"key":"C","text":"汇聚层减轻卷积层对位置的过度敏感"},{"key":"D","text":"汇聚层的输出通道数与输入通道数相同"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"最大汇聚输出窗口内最大值，平均汇聚输出窗口内平均值。汇聚层减轻卷积层对位置的过度敏感。汇聚层的输出通道数与输入通道数相同。"},{"id":239,"chapter":"卷积神经网络","type":"multi","stem":"关于卷积核，下列说法正确的是( )","options":[{"key":"A","text":"可以设计卷积核来检测图像的边缘"},{"key":"B","text":"可以从数据中学习卷积核的参数"},{"key":"C","text":"学习卷积核时，无论用严格卷积或互相关，输出不会受太大影响"},{"key":"D","text":"卷积核参数是人工设计的"}],"answer":["A","B","C"],"answerText":"ABC","explain":"可以设计卷积核来检测边缘，但实际训练中卷积核参数是从数据中学习的。学习卷积核时，严格卷积和互相关的输出不会受太大影响。D 错误，卷积核参数是学出来的。"},{"id":240,"chapter":"卷积神经网络","type":"multi","stem":"关于感受野，下列说法正确的是( )","options":[{"key":"A","text":"浅层感受野小，深层感受野大"},{"key":"B","text":"堆叠卷积层可以扩大感受野"},{"key":"C","text":"两个 3×3 卷积层堆叠，感受野是 5×5"},{"key":"D","text":"步幅和汇聚层也可以扩大感受野"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"浅层感受野小，深层感受野大。堆叠卷积层可以扩大感受野。两个 3×3 堆叠感受野是 5×5。步幅和汇聚层也可以扩大感受野。"},{"id":241,"chapter":"卷积神经网络","type":"multi","stem":"关于卷积网络的参数量，下列说法正确的是( )","options":[{"key":"A","text":"卷积层参数量远小于全连接层"},{"key":"B","text":"参数少是权重共享和局部连接的结果"},{"key":"C","text":"参数少是目的"},{"key":"D","text":"如果图像没有平移不变性，卷积的优势就不存在"}],"answer":["A","B","D"],"answerText":"ABD","explain":"卷积层参数量远小于全连接层，参数少是权重共享和局部连接的结果，不是目的。如果图像没有平移不变性，卷积的优势就不存在。C 错误，参数少是结果，不是目的。"},{"id":242,"chapter":"卷积神经网络","type":"multi","stem":"关于 CNN 和 MLP 的对比，下列说法正确的是( )","options":[{"key":"A","text":"CNN 参数少，MLP 参数多"},{"key":"B","text":"CNN 利用空间结构，MLP 丢失空间结构"},{"key":"C","text":"CNN 有平移不变性，MLP 没有"},{"key":"D","text":"CNN 适合图像，MLP 适合表格数据"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"CNN 参数少，利用空间结构，有平移不变性，适合图像。MLP 参数多，丢失空间结构，没有平移不变性，适合表格数据。"},{"id":243,"chapter":"卷积神经网络","type":"multi","stem":"关于 1×1 卷积，下列说法正确的是( )","options":[{"key":"A","text":"不改变空间尺寸"},{"key":"B","text":"改变通道数"},{"key":"C","text":"在每个像素上做全连接"},{"key":"D","text":"所有位置共享权重"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"1×1 卷积不改变空间尺寸，改变通道数。它在每个像素上做全连接，所有位置共享权重。"},{"id":244,"chapter":"卷积神经网络","type":"multi","stem":"关于卷积层的输出尺寸计算，下列说法正确的是( )","options":[{"key":"A","text":"输出尺寸 = 输入尺寸 - 卷积核尺寸 + 1(无填充、步幅 1)"},{"key":"B","text":"填充可以增加输出尺寸"},{"key":"C","text":"步幅可以减小输出尺寸"},{"key":"D","text":"输出尺寸 = (输入尺寸 + 2×填充 - 卷积核尺寸) / 步幅 + 1"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"无填充、步幅 1 时，输出尺寸 = 输入尺寸 - 卷积核尺寸 + 1。填充增加输出尺寸，步幅减小输出尺寸。通用公式:输出尺寸 = (输入尺寸 + 2×填充 - 卷积核尺寸) / 步幅 + 1。"},{"id":245,"chapter":"卷积神经网络","type":"multi","stem":"关于 CNN 的计算量，下列说法正确的是( )","options":[{"key":"A","text":"卷积层计算量远大于参数量"},{"key":"B","text":"卷积是计算密集型操作"},{"key":"C","text":"GPU 适合并行计算卷积"},{"key":"D","text":"卷积核在不同位置的运算是独立的"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"卷积层计算量远大于参数量，是计算密集型操作。GPU 适合并行计算卷积，因为卷积核在不同位置的运算是独立的。"},{"id":246,"chapter":"卷积神经网络","type":"multi","stem":"关于 CNN 和全连接层的参数对比，下列说法正确的是( )","options":[{"key":"A","text":"输入 224×224×3，输出 1000 类，全连接层参数量约 1.5 亿"},{"key":"B","text":"同样输入输出，卷积层参数量约 2.8 万"},{"key":"C","text":"参数少是归纳偏置的结果"},{"key":"D","text":"参数少是目的"}],"answer":["A","B","C"],"answerText":"ABC","explain":"输入 224×224×3，输出 1000 类，全连接层参数量约 1.5 亿，卷积层参数量约 2.8 万。参数少是归纳偏置的结果，不是目的。D 错误。"},{"id":247,"chapter":"卷积神经网络","type":"judge","stem":"卷积层的权重共享对应平移不变性。","options":[],"answer":"正确","answerText":"正确","explain":"权重共享对应平移不变性:同样的物体出现在不同位置，应该被同一个卷积核识别。局部连接对应局部性。"},{"id":248,"chapter":"卷积神经网络","type":"judge","stem":"卷积层的局部连接对应局部性。","options":[],"answer":"正确","answerText":"正确","explain":"局部连接对应局部性:图像的局部区域就足以提取有用特征。权重共享对应平移不变性。"},{"id":249,"chapter":"卷积神经网络","type":"judge","stem":"填充可以增加输出的高度和宽度。","options":[],"answer":"正确","answerText":"正确","explain":"填充在输入边缘补零，增加输出的高度和宽度。常用于使输出与输入具有相同的高和宽。"},{"id":250,"chapter":"卷积神经网络","type":"judge","stem":"步幅可以减小输出的高和宽。","options":[],"answer":"正确","answerText":"正确","explain":"步幅是卷积核移动的步长，控制下采样倍率。步幅为 2，输出尺寸减半。"},{"id":251,"chapter":"卷积神经网络","type":"judge","stem":"输入 32×32，卷积核 5×5，步幅 1，无填充，输出是 28×28。","options":[],"answer":"正确","answerText":"正确","explain":"输出尺寸 = 输入尺寸 - 卷积核尺寸 + 1 = 32 - 5 + 1 = 28。所以输出是 28×28。"},{"id":252,"chapter":"卷积神经网络","type":"judge","stem":"输入 32×32，卷积核 5×5，步幅 1，填充 2，输出是 32×32。","options":[],"answer":"正确","answerText":"正确","explain":"输出尺寸 = 输入尺寸 + 2×填充 - 卷积核尺寸 + 1 = 32 + 4 - 5 + 1 = 32。所以输出是 32×32。"},{"id":253,"chapter":"卷积神经网络","type":"judge","stem":"1×1 卷积不改变空间尺寸，只改变通道数。","options":[],"answer":"正确","answerText":"正确","explain":"1×1 卷积不改变空间尺寸，只改变通道数。它在每个像素上做全连接，可以增加非线性，减少计算量。"},{"id":254,"chapter":"卷积神经网络","type":"judge","stem":"1×1 卷积和全连接层完全相同。","options":[],"answer":"错误","answerText":"错误","explain":"1×1 卷积是权重共享版的全连接层。全连接层每个位置有独立权重，1×1 卷积所有位置共享权重。所以不完全相同。"},{"id":255,"chapter":"卷积神经网络","type":"judge","stem":"汇聚层的主要作用是减轻卷积层对位置的过度敏感。","options":[],"answer":"正确","answerText":"正确","explain":"汇聚层的主要作用是减轻卷积层对位置的过度敏感。最大汇聚取窗口内最大值，平均汇聚取窗口内平均值。"},{"id":256,"chapter":"卷积神经网络","type":"judge","stem":"汇聚层的输出通道数大于输入通道数。","options":[],"answer":"错误","answerText":"错误","explain":"汇聚层的输出通道数等于输入通道数。它不改变通道数，只改变空间尺寸。"},{"id":257,"chapter":"卷积神经网络","type":"judge","stem":"最大汇聚层输出窗口内的平均值。","options":[],"answer":"错误","answerText":"错误","explain":"最大汇聚层输出窗口内的最大值。平均汇聚层输出窗口内的平均值。"},{"id":258,"chapter":"卷积神经网络","type":"judge","stem":"感受野是输出特征图上一个像素对应输入图像上的区域大小。","options":[],"answer":"正确","answerText":"正确","explain":"感受野是输出特征图上一个像素对应输入图像上的区域大小。浅层感受野小，深层感受野大。"},{"id":259,"chapter":"卷积神经网络","type":"judge","stem":"两个 3×3 卷积层堆叠的感受野是 5×5。","options":[],"answer":"正确","answerText":"正确","explain":"感受野是逐层累加的。两个 3×3 卷积层堆叠，感受野是 5×5。三个 3×3 堆叠是 7×7。公式:RF = 1 + n × (k - 1)。"},{"id":260,"chapter":"卷积神经网络","type":"judge","stem":"卷积层参数量远小于全连接层。","options":[],"answer":"正确","answerText":"正确","explain":"卷积层参数量远小于全连接层。参数少是权重共享和局部连接的结果，不是目的。"},{"id":261,"chapter":"卷积神经网络","type":"judge","stem":"如果图像没有平移不变性，卷积的优势就不存在。","options":[],"answer":"正确","answerText":"正确","explain":"卷积的优势来自平移不变性和局部性。如果图像没有平移不变性，权重共享就没有意义，卷积的优势就不存在。"},{"id":262,"chapter":"卷积神经网络","type":"judge","stem":"CNN 的位置鲁棒性来自权重共享和汇聚层。","options":[],"answer":"正确","answerText":"正确","explain":"CNN 的位置鲁棒性来自权重共享和汇聚层。权重共享让同一个卷积核在不同位置复用，汇聚层让小幅平移不改变输出。"},{"id":263,"chapter":"卷积神经网络","type":"judge","stem":"卷积层的计算量远大于参数量。","options":[],"answer":"正确","answerText":"正确","explain":"卷积层的计算量远大于参数量，是计算密集型操作。GPU 适合并行计算卷积，因为卷积核在不同位置的运算是独立的。"},{"id":264,"chapter":"卷积神经网络","type":"judge","stem":"卷积和互相关是一回事。","options":[],"answer":"错误","answerText":"错误","explain":"数学卷积需要翻转卷积核，互相关不翻转。深度学习框架中的 conv2d 实际上是互相关。因为卷积核参数是学出来的，翻转不翻转不影响模型能力。"},{"id":265,"chapter":"卷积神经网络","type":"judge","stem":"填充和步幅只是调参技巧，不影响特征图空间分辨率。","options":[],"answer":"错误","answerText":"错误","explain":"填充和步幅是控制特征图空间分辨率的两个旋钮，不是简单的调参技巧。填充增加输出尺寸，步幅减小输出尺寸。"},{"id":266,"chapter":"卷积神经网络","type":"judge","stem":"CNN 只能处理图像。","options":[],"answer":"错误","answerText":"错误","explain":"CNN 也可以处理文本、音频、时间序列。卷积的权重共享和局部连接假设适用于任何有空间或时间结构的数据。"},{"id":267,"chapter":"卷积神经网络","type":"judge","stem":"全卷积网络可以处理任意尺寸的输入。","options":[],"answer":"正确","answerText":"正确","explain":"全卷积网络用卷积层代替全连接层，可以处理任意尺寸的输入。全连接层要求固定输入维度，卷积层不要求。"},{"id":268,"chapter":"现代卷积神经网络","type":"single","stem":"AlexNet 用 ReLU 代替 sigmoid 的主要原因是( )","options":[{"key":"A","text":"ReLU 计算更简单"},{"key":"B","text":"ReLU 在正值区不饱和，梯度不会消失"},{"key":"C","text":"ReLU 输出在 0 到 1 之间"},{"key":"D","text":"ReLU 是零中心的"}],"answer":["B"],"answerText":"B","explain":"sigmoid 在饱和区梯度接近 0，深层网络训练不起来。ReLU 在正值区导数恒为 1，不饱和，梯度不会消失。"},{"id":269,"chapter":"现代卷积神经网络","type":"single","stem":"AlexNet 使用 Dropout 的主要目的是( )","options":[{"key":"A","text":"加速训练"},{"key":"B","text":"防止过拟合"},{"key":"C","text":"增加参数量"},{"key":"D","text":"减少计算量"}],"answer":["B"],"answerText":"B","explain":"AlexNet 的全连接层参数量大，容易过拟合。Dropout 随机丢弃神经元，相当于模型集成，防止过拟合。"},{"id":270,"chapter":"现代卷积神经网络","type":"single","stem":"VGG 的核心设计是( )","options":[{"key":"A","text":"残差连接"},{"key":"B","text":"重复块 + 小卷积核堆叠"},{"key":"C","text":"1×1 卷积"},{"key":"D","text":"密集连接"}],"answer":["B"],"answerText":"B","explain":"VGG 的核心设计是重复块加小卷积核堆叠。VGG 块由多个 3×3 卷积加一个 2×2 最大汇聚组成，然后重复堆叠。"},{"id":271,"chapter":"现代卷积神经网络","type":"single","stem":"VGG 用 3×3 卷积核堆叠代替 5×5 卷积核，主要原因是( )","options":[{"key":"A","text":"3×3 卷积核计算更快"},{"key":"B","text":"两个 3×3 感受野等于 5×5，但参数量更少，非线性更强"},{"key":"C","text":"3×3 卷积核参数更多"},{"key":"D","text":"5×5 卷积核不能使用"}],"answer":["B"],"answerText":"B","explain":"两个 3×3 卷积层的感受野等于一个 5×5 卷积层。但参数量:2×3×3=18 vs 5×5=25。小卷积核参数量更少，而且中间多了一层非线性激活。"},{"id":272,"chapter":"现代卷积神经网络","type":"single","stem":"VGG 的主要缺点是( )","options":[{"key":"A","text":"结构不规整"},{"key":"B","text":"参数量大，大部分在全连接层"},{"key":"C","text":"不能迁移学习"},{"key":"D","text":"无法加深"}],"answer":["B"],"answerText":"B","explain":"VGG 的参数量约 1.38 亿，大部分参数在全连接层。后续模型用全局平均汇聚代替全连接层，减少参数量。"},{"id":273,"chapter":"现代卷积神经网络","type":"single","stem":"NiN 的核心创新是( )","options":[{"key":"A","text":"用 1×1 卷积代替全连接层"},{"key":"B","text":"用残差连接代替全连接层"},{"key":"C","text":"用密集连接代替全连接层"},{"key":"D","text":"用 Inception 块代替全连接层"}],"answer":["A"],"answerText":"A","explain":"NiN 用 1×1 卷积代替全连接层，减少参数量，保留空间结构。还用全局平均汇聚代替最后的全连接层。"},{"id":274,"chapter":"现代卷积神经网络","type":"single","stem":"NiN 用全局平均汇聚代替最后的全连接层，主要好处是( )","options":[{"key":"A","text":"增加参数量"},{"key":"B","text":"参数量为 0，减少过拟合"},{"key":"C","text":"增加空间尺寸"},{"key":"D","text":"增加通道数"}],"answer":["B"],"answerText":"B","explain":"全局平均汇聚对每个通道取平均值，参数量为 0。它减少了参数量，避免了过拟合。这个设计后来被 GoogLeNet、ResNet 沿用。"},{"id":275,"chapter":"现代卷积神经网络","type":"single","stem":"GoogLeNet 的核心设计是( )","options":[{"key":"A","text":"Inception 块"},{"key":"B","text":"残差连接"},{"key":"C","text":"密集连接"},{"key":"D","text":"重复块"}],"answer":["A"],"answerText":"A","explain":"GoogLeNet 的核心设计是 Inception 块。它用并行多尺度卷积和 1×1 卷积降维，提取多尺度特征。"},{"id":276,"chapter":"现代卷积神经网络","type":"single","stem":"Inception 块中使用 1×1 卷积的主要目的是( )","options":[{"key":"A","text":"增加空间尺寸"},{"key":"B","text":"降维，减少计算量"},{"key":"C","text":"增加参数量"},{"key":"D","text":"减少通道数"}],"answer":["B"],"answerText":"B","explain":"Inception 块用 1×1 卷积降维，减少计算量。比如先用 1×1 卷积把 256 通道降到 64 通道，再做 5×5 卷积，参数量减少约 70%。"},{"id":277,"chapter":"现代卷积神经网络","type":"single","stem":"批量规范化的作用是( )","options":[{"key":"A","text":"增加参数量"},{"key":"B","text":"让每层输入分布稳定，允许更大学习率，加快收敛"},{"key":"C","text":"减少通道数"},{"key":"D","text":"增加空间尺寸"}],"answer":["B"],"answerText":"B","explain":"批量规范化让每层输入分布稳定，允许更大学习率，加快收敛，还有轻微正则化效果。"},{"id":278,"chapter":"现代卷积神经网络","type":"single","stem":"批量规范化通常插入在( )","options":[{"key":"A","text":"卷积层之前"},{"key":"B","text":"卷积层和激活函数之间"},{"key":"C","text":"激活函数之后"},{"key":"D","text":"输出层之后"}],"answer":["B"],"answerText":"B","explain":"批量规范化通常插入在卷积层和激活函数之间。它对每个 mini-batch 做归一化，让每层输入分布稳定。"},{"id":279,"chapter":"现代卷积神经网络","type":"single","stem":"批量规范化在测试时使用( )","options":[{"key":"A","text":"mini-batch 统计量"},{"key":"B","text":"全局统计量"},{"key":"C","text":"随机统计量"},{"key":"D","text":"不需要统计量"}],"answer":["B"],"answerText":"B","explain":"批量规范化训练时用 mini-batch 统计量，测试时用全局统计量。这个细节很重要，测试时用 mini-batch 统计量会导致结果不稳定。"},{"id":280,"chapter":"现代卷积神经网络","type":"single","stem":"ResNet 的核心设计是( )","options":[{"key":"A","text":"Inception 块"},{"key":"B","text":"残差连接"},{"key":"C","text":"密集连接"},{"key":"D","text":"重复块"}],"answer":["B"],"answerText":"B","explain":"ResNet 的核心设计是残差连接。残差块学习的是 F(x) = H(x) - x，而不是完整映射 H(x)。"},{"id":281,"chapter":"现代卷积神经网络","type":"single","stem":"残差块学习的是( )","options":[{"key":"A","text":"H(x)"},{"key":"B","text":"F(x) = H(x) - x"},{"key":"C","text":"F(x) = H(x) + x"},{"key":"D","text":"F(x) = H(x) · x"}],"answer":["B"],"answerText":"B","explain":"残差块学习的是 F(x) = H(x) - x，输出是 F(x) + x。如果恒等映射是最优的，F(x) 只需要学成 0。"},{"id":282,"chapter":"现代卷积神经网络","type":"single","stem":"ResNet 解决的核心问题是( )","options":[{"key":"A","text":"过拟合"},{"key":"B","text":"退化问题"},{"key":"C","text":"梯度爆炸"},{"key":"D","text":"数据不平衡"}],"answer":["B"],"answerText":"B","explain":"ResNet 解决的是退化问题:深度增加后，训练误差反而上升，这不是过拟合，而是优化困难。"},{"id":283,"chapter":"现代卷积神经网络","type":"single","stem":"ResNet 的瓶颈残差块是( )","options":[{"key":"A","text":"两个 3×3 卷积"},{"key":"B","text":"1×1 降维 → 3×3 卷积 → 1×1 升维"},{"key":"C","text":"两个 5×5 卷积"},{"key":"D","text":"一个 7×7 卷积"}],"answer":["B"],"answerText":"B","explain":"瓶颈残差块是 1×1 降维、3×3 卷积、1×1 升维。它用于更深的网络，因为 1×1 卷积可以减少计算量。"},{"id":284,"chapter":"现代卷积神经网络","type":"single","stem":"DenseNet 的核心设计是( )","options":[{"key":"A","text":"残差连接"},{"key":"B","text":"密集连接"},{"key":"C","text":"Inception 块"},{"key":"D","text":"重复块"}],"answer":["B"],"answerText":"B","explain":"DenseNet 的核心设计是密集连接。每一层连接前面所有层，用拼接 [x, F(x)] 代替相加。"},{"id":285,"chapter":"现代卷积神经网络","type":"single","stem":"DenseNet 和 ResNet 的连接方式区别是( )","options":[{"key":"A","text":"ResNet 是拼接，DenseNet 是相加"},{"key":"B","text":"ResNet 是相加，DenseNet 是拼接"},{"key":"C","text":"两者都是相加"},{"key":"D","text":"两者都是拼接"}],"answer":["B"],"answerText":"B","explain":"ResNet 是相加 F(x) + x，DenseNet 是拼接 [x, F(x)]。相加融合特征，拼接保留所有特征。"},{"id":286,"chapter":"现代卷积神经网络","type":"multi","stem":"关于 VGG，下列说法正确的是( )","options":[{"key":"A","text":"利用许多重复的神经网络块"},{"key":"B","text":"用 3×3 卷积核堆叠"},{"key":"C","text":"结构规整，容易加深"},{"key":"D","text":"参数量大，大部分在全连接层"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"VGG 利用许多重复的神经网络块，用 3×3 卷积核堆叠，结构规整，容易加深。但参数量大约 1.38 亿，大部分在全连接层。"},{"id":287,"chapter":"现代卷积神经网络","type":"multi","stem":"关于两个 3×3 卷积层堆叠代替一个 5×5 卷积层，下列说法正确的是( )","options":[{"key":"A","text":"感受野相同"},{"key":"B","text":"参数量更少"},{"key":"C","text":"非线性更强"},{"key":"D","text":"计算量更大"}],"answer":["A","B","C"],"answerText":"ABC","explain":"两个 3×3 卷积层感受野等于一个 5×5 卷积层。参数量更少(18 vs 25)，中间多了一层非线性激活。D 错误，计算量不一定更大。"},{"id":288,"chapter":"现代卷积神经网络","type":"multi","stem":"关于 NiN，下列说法正确的是( )","options":[{"key":"A","text":"用 1×1 卷积代替全连接层"},{"key":"B","text":"用全局平均汇聚代替最后的全连接层"},{"key":"C","text":"参数量少，保留空间结构"},{"key":"D","text":"效果一般，但设计思想影响后续模型"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"NiN 用 1×1 卷积代替全连接层，用全局平均汇聚代替最后的全连接层。参数量少，保留空间结构。效果一般，但设计思想影响后续模型。"},{"id":289,"chapter":"现代卷积神经网络","type":"multi","stem":"关于 GoogLeNet，下列说法正确的是( )","options":[{"key":"A","text":"使用并行连结的网络"},{"key":"B","text":"通过不同窗口大小的卷积层和最大汇聚层并行抽取信息"},{"key":"C","text":"Inception 块用 1×1 卷积降维"},{"key":"D","text":"参数量约 500 万"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"GoogLeNet 使用并行连结的网络，通过不同窗口大小的卷积层和最大汇聚层并行抽取信息。Inception 块用 1×1 卷积降维，参数量约 500 万。"},{"id":290,"chapter":"现代卷积神经网络","type":"multi","stem":"关于 Inception 块，下列说法正确的是( )","options":[{"key":"A","text":"并行分支:1×1、3×3、5×5 卷积、3×3 最大汇聚"},{"key":"B","text":"所有分支输出在通道维度拼接"},{"key":"C","text":"1×1 卷积降维减少计算量"},{"key":"D","text":"没有 1×1 卷积降维，计算量会大很多"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"Inception 块有四个并行分支:1×1、3×3、5×5 卷积、3×3 最大汇聚。所有分支输出在通道维度拼接。1×1 卷积降维减少计算量，没有它计算量会大很多。"},{"id":291,"chapter":"现代卷积神经网络","type":"multi","stem":"关于批量规范化，下列说法正确的是( )","options":[{"key":"A","text":"对每个 mini-batch 做归一化"},{"key":"B","text":"让每层输入分布稳定"},{"key":"C","text":"允许更大学习率，加快收敛"},{"key":"D","text":"有轻微正则化效果"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"批量规范化对每个 mini-batch 做归一化，让每层输入分布稳定，允许更大学习率，加快收敛，有轻微正则化效果。"},{"id":292,"chapter":"现代卷积神经网络","type":"multi","stem":"关于批量规范化的插入位置和训练/测试行为，下列说法正确的是( )","options":[{"key":"A","text":"插入在卷积层和激活函数之间"},{"key":"B","text":"训练时用 mini-batch 统计量"},{"key":"C","text":"测试时用全局统计量"},{"key":"D","text":"训练和测试行为相同"}],"answer":["A","B","C"],"answerText":"ABC","explain":"批量规范化插入在卷积层和激活函数之间。训练时用 mini-batch 统计量，测试时用全局统计量。D 错误，训练和测试行为不同。"},{"id":293,"chapter":"现代卷积神经网络","type":"multi","stem":"关于 ResNet，下列说法正确的是( )","options":[{"key":"A","text":"通过残差块构建跨层的数据通道"},{"key":"B","text":"是计算机视觉中最流行的体系架构之一"},{"key":"C","text":"解决退化问题"},{"key":"D","text":"可以训练 152 层甚至更深的网络"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"ResNet 通过残差块构建跨层的数据通道，是计算机视觉中最流行的体系架构之一。它解决退化问题，可以训练 152 层甚至更深的网络。"},{"id":294,"chapter":"现代卷积神经网络","type":"multi","stem":"关于残差块，下列说法正确的是( )","options":[{"key":"A","text":"学习 F(x) = H(x) - x"},{"key":"B","text":"输出 F(x) + x"},{"key":"C","text":"如果恒等映射最优，F(x) 学成 0"},{"key":"D","text":"跳跃连接让梯度直接传到浅层"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"残差块学习 F(x) = H(x) - x，输出 F(x) + x。如果恒等映射最优，F(x) 学成 0。跳跃连接让梯度直接传到浅层，解决梯度消失。"},{"id":295,"chapter":"现代卷积神经网络","type":"multi","stem":"关于 ResNet 的两种残差块，下列说法正确的是( )","options":[{"key":"A","text":"基本残差块:两个 3×3 卷积"},{"key":"B","text":"瓶颈残差块:1×1 降维、3×3 卷积、1×1 升维"},{"key":"C","text":"瓶颈块用于更深的网络"},{"key":"D","text":"瓶颈块减少计算量"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"基本残差块是两个 3×3 卷积，瓶颈残差块是 1×1 降维、3×3 卷积、1×1 升维。瓶颈块用于更深的网络，减少计算量。"},{"id":296,"chapter":"现代卷积神经网络","type":"multi","stem":"关于 DenseNet，下列说法正确的是( )","options":[{"key":"A","text":"计算成本很高，但效果更好"},{"key":"B","text":"每一层连接前面所有层"},{"key":"C","text":"用拼接 [x, F(x)] 代替相加"},{"key":"D","text":"参数量更少，但计算量更大"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"DenseNet 计算成本很高，但效果更好。每一层连接前面所有层，用拼接 [x, F(x)] 代替相加。参数量更少，但计算量更大。"},{"id":297,"chapter":"现代卷积神经网络","type":"multi","stem":"关于 ResNet 和 DenseNet 的区别，下列说法正确的是( )","options":[{"key":"A","text":"ResNet 是相加 F(x) + x"},{"key":"B","text":"DenseNet 是拼接 [x, F(x)]"},{"key":"C","text":"ResNet 融合特征，DenseNet 保留所有特征"},{"key":"D","text":"DenseNet 参数量更少，但计算量更大"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"ResNet 是相加 F(x) + x，DenseNet 是拼接 [x, F(x)]。ResNet 融合特征，DenseNet 保留所有特征。DenseNet 参数量更少，但计算量更大。"},{"id":298,"chapter":"现代卷积神经网络","type":"multi","stem":"关于深度网络面临的挑战，下列说法正确的是( )","options":[{"key":"A","text":"梯度消失/爆炸"},{"key":"B","text":"计算量爆炸"},{"key":"C","text":"特征复用不足"},{"key":"D","text":"训练不稳定"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"深度网络面临四个核心挑战:梯度消失/爆炸、计算量爆炸、特征复用不足、训练不稳定。这一章的模型就是围绕这四个挑战展开的。"},{"id":299,"chapter":"现代卷积神经网络","type":"multi","stem":"关于每个模型回应的挑战，下列说法正确的是( )","options":[{"key":"A","text":"AlexNet:ReLU 解决梯度消失，Dropout 解决过拟合"},{"key":"B","text":"NiN:1×1 卷积减少参数量"},{"key":"C","text":"GoogLeNet:Inception 块提高计算效率"},{"key":"D","text":"ResNet:残差连接解决退化问题"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"AlexNet 用 ReLU 解决梯度消失，用 Dropout 解决过拟合。NiN 用 1×1 卷积减少参数量。GoogLeNet 用 Inception 块提高计算效率。ResNet 用残差连接解决退化问题。"},{"id":300,"chapter":"现代卷积神经网络","type":"multi","stem":"关于批量规范化，下列说法正确的是( )","options":[{"key":"A","text":"是现代网络的标配"},{"key":"B","text":"让深层网络训练从“调参玄学”变成“工程可控”"},{"key":"C","text":"对 batch size 敏感"},{"key":"D","text":"batch size 太小时统计量不稳定"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"批量规范化是现代网络的标配，让深层网络训练从“调参玄学”变成“工程可控”。但它对 batch size 敏感，batch size 太小时统计量不稳定。"},{"id":301,"chapter":"现代卷积神经网络","type":"multi","stem":"关于 ResNet 能训练多深，下列说法正确的是( )","options":[{"key":"A","text":"ResNet 原始论文:18、34、50、101、152 层"},{"key":"B","text":"后来有人训练了 ResNet-1000"},{"key":"C","text":"残差连接解决“能不能训练深”"},{"key":"D","text":"瓶颈块解决“训练深贵不贵”"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"ResNet 原始论文包括 18、34、50、101、152 层。后来有人训练了 ResNet-1000。残差连接解决“能不能训练深”，瓶颈块解决“训练深贵不贵”。"},{"id":302,"chapter":"现代卷积神经网络","type":"multi","stem":"关于深度网络的常见误区，下列说法正确的是( )","options":[{"key":"A","text":"网络越深越好"},{"key":"B","text":"1×1 卷积没有用"},{"key":"C","text":"残差连接是跳过一些层"},{"key":"D","text":"这些模型已经过时了"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"这些都是常见误区。网络不是越深越好，1×1 卷积可以调整通道和增加非线性，残差连接学习的是残差，这些模型的设计思想仍然在现代网络中广泛使用。"},{"id":303,"chapter":"现代卷积神经网络","type":"judge","stem":"AlexNet 是第一个在大规模视觉竞赛中击败传统计算机视觉模型的大型神经网络。","options":[],"answer":"正确","answerText":"正确","explain":"AlexNet 是第一个在大规模视觉竞赛中击败传统计算机视觉模型的大型神经网络。它用 ReLU、Dropout、GPU 三个关键设计。"},{"id":304,"chapter":"现代卷积神经网络","type":"judge","stem":"AlexNet 用 sigmoid 代替 ReLU，解决了梯度消失问题。","options":[],"answer":"错误","answerText":"错误","explain":"AlexNet 用 ReLU 代替 sigmoid。sigmoid 在饱和区梯度接近 0，ReLU 在正值区导数恒为 1，不饱和。"},{"id":305,"chapter":"现代卷积神经网络","type":"judge","stem":"AlexNet 使用 Dropout 防止过拟合。","options":[],"answer":"正确","answerText":"正确","explain":"AlexNet 的全连接层参数量大，容易过拟合。Dropout 随机丢弃神经元，相当于模型集成，防止过拟合。"},{"id":306,"chapter":"现代卷积神经网络","type":"judge","stem":"VGG 利用许多重复的神经网络块。","options":[],"answer":"正确","answerText":"正确","explain":"VGG 利用许多重复的神经网络块。VGG 块由多个 3×3 卷积加一个 2×2 最大汇聚组成，然后重复堆叠。"},{"id":307,"chapter":"现代卷积神经网络","type":"judge","stem":"两个 3×3 卷积层的感受野等于一个 5×5 卷积层，但参数量更多。","options":[],"answer":"错误","answerText":"错误","explain":"两个 3×3 卷积层的感受野等于一个 5×5 卷积层。但参数量:2×3×3=18 vs 5×5=25。小卷积核参数量更少，而且非线性更强。"},{"id":308,"chapter":"现代卷积神经网络","type":"judge","stem":"VGG 的参数量大部分在全连接层。","options":[],"answer":"正确","answerText":"正确","explain":"VGG 的参数量约 1.38 亿，大部分参数在全连接层。后续模型用全局平均汇聚代替全连接层，减少参数量。"},{"id":309,"chapter":"现代卷积神经网络","type":"judge","stem":"NiN 用 1×1 卷积代替全连接层。","options":[],"answer":"正确","answerText":"正确","explain":"NiN 用 1×1 卷积代替全连接层，减少参数量，保留空间结构。还用全局平均汇聚代替最后的全连接层。"},{"id":310,"chapter":"现代卷积神经网络","type":"judge","stem":"NiN 用全局平均汇聚代替最后的全连接层，增加了参数量。","options":[],"answer":"错误","answerText":"错误","explain":"全局平均汇聚对每个通道取平均值，参数量为 0。它减少了参数量，避免了过拟合。这个设计后来被 GoogLeNet、ResNet 沿用。"},{"id":311,"chapter":"现代卷积神经网络","type":"judge","stem":"GoogLeNet 使用并行连结的网络，通过不同窗口大小的卷积层和最大汇聚层来并行抽取信息。","options":[],"answer":"正确","answerText":"正确","explain":"GoogLeNet 使用并行连结的网络，通过不同窗口大小的卷积层和最大汇聚层来并行抽取信息。Inception 块是它的核心设计。"},{"id":312,"chapter":"现代卷积神经网络","type":"judge","stem":"Inception 块中的 1×1 卷积用于增加计算量。","options":[],"answer":"错误","answerText":"错误","explain":"Inception 块中的 1×1 卷积用于降维，减少计算量。比如先用 1×1 卷积把 256 通道降到 64 通道，再做 5×5 卷积，参数量减少约 70%。"},{"id":313,"chapter":"现代卷积神经网络","type":"judge","stem":"批量规范化让每层输入分布稳定，允许更大学习率，加快收敛。","options":[],"answer":"正确","answerText":"正确","explain":"批量规范化对每个 mini-batch 做归一化，让每层输入分布稳定，允许更大学习率，加快收敛，还有轻微正则化效果。"},{"id":314,"chapter":"现代卷积神经网络","type":"judge","stem":"批量规范化插入在激活函数之后。","options":[],"answer":"错误","answerText":"错误","explain":"批量规范化通常插入在卷积层和激活函数之间，不是激活函数之后。"},{"id":315,"chapter":"现代卷积神经网络","type":"judge","stem":"批量规范化训练时用全局统计量，测试时用 mini-batch 统计量。","options":[],"answer":"错误","answerText":"错误","explain":"批量规范化训练时用 mini-batch 统计量，测试时用全局统计量。反过来说就错了。"},{"id":316,"chapter":"现代卷积神经网络","type":"judge","stem":"ResNet 通过残差块构建跨层的数据通道。","options":[],"answer":"正确","answerText":"正确","explain":"ResNet 通过残差块构建跨层的数据通道，是计算机视觉中最流行的体系架构之一。残差块学习 F(x) = H(x) - x。"},{"id":317,"chapter":"现代卷积神经网络","type":"judge","stem":"ResNet 解决的核心问题是过拟合。","options":[],"answer":"错误","answerText":"错误","explain":"ResNet 解决的是退化问题:深度增加后，训练误差反而上升，这不是过拟合，而是优化困难。过拟合是训练误差低、测试误差高。"},{"id":318,"chapter":"现代卷积神经网络","type":"judge","stem":"ResNet 是相加，DenseNet 是拼接。","options":[],"answer":"正确","answerText":"正确","explain":"ResNet 是相加 F(x) + x，DenseNet 是拼接 [x, F(x)]。相加融合特征，拼接保留所有特征。"},{"id":319,"chapter":"现代卷积神经网络","type":"judge","stem":"DenseNet 的参数量比 ResNet 更多。","options":[],"answer":"错误","answerText":"错误","explain":"DenseNet 的参数量更少，因为每层只需要输出少量新特征，前面所有层的特征被拼接复用。但计算量更大。"},{"id":320,"chapter":"现代卷积神经网络","type":"judge","stem":"深度网络面临的四个核心挑战是梯度消失/爆炸、计算量爆炸、特征复用不足、训练不稳定。","options":[],"answer":"正确","answerText":"正确","explain":"深度网络面临四个核心挑战:梯度消失/爆炸、计算量爆炸、特征复用不足、训练不稳定。这一章的模型就是围绕这四个挑战展开的。"},{"id":321,"chapter":"现代卷积神经网络","type":"judge","stem":"残差连接解决“能不能训练深”，瓶颈块解决“训练深贵不贵”。","options":[],"answer":"正确","answerText":"正确","explain":"残差连接解决“能不能训练深”，瓶颈块解决“训练深贵不贵”。ResNet 原始论文做到 152 层，后来有人做到 1000 层以上。"},{"id":322,"chapter":"现代卷积神经网络","type":"judge","stem":"1×1 卷积没有用。","options":[],"answer":"错误","answerText":"错误","explain":"1×1 卷积可以调整通道数、增加非线性、减少计算量。它在 NiN、GoogLeNet、ResNet 里都有使用。"},{"id":323,"chapter":"现代卷积神经网络","type":"fill","stem":"输入 32×32，卷积核 5×5，步幅 1，无填充，输出尺寸是____。","options":[],"answer":["28×28"],"answerText":"28×28","explain":"输出尺寸 = 输入尺寸 - 卷积核尺寸 + 1 = 32 - 5 + 1 = 28。"},{"id":324,"chapter":"现代卷积神经网络","type":"fill","stem":"输入 32×32，卷积核 5×5，步幅 1，填充 2，输出尺寸是____。","options":[],"answer":["32×32"],"answerText":"32×32","explain":"输出尺寸 = 输入尺寸 + 2×填充 - 卷积核尺寸 + 1 = 32 + 4 - 5 + 1 = 32。填充 2 让输出和输入一样大。"},{"id":325,"chapter":"现代卷积神经网络","type":"fill","stem":"输入 32×32，卷积核 5×5，步幅 2，填充 2，输出尺寸是____。","options":[],"answer":["16×16"],"answerText":"16×16","explain":"输出尺寸 = (输入尺寸 + 2×填充 - 卷积核尺寸) / 步幅 + 1 = (32 + 4 - 5) / 2 + 1 = 16。"},{"id":326,"chapter":"现代卷积神经网络","type":"fill","stem":"汇聚层的输出通道数与输入通道数____。","options":[],"answer":["相同"],"answerText":"相同","explain":"汇聚层的输出通道数等于输入通道数。它不改变通道数，只改变空间尺寸。"},{"id":327,"chapter":"现代卷积神经网络","type":"fill","stem":"最大汇聚层输出窗口内的____，平均汇聚层输出窗口内的____。","options":[],"answer":["最大值","平均值"],"answerText":"最大值；平均值","explain":"最大汇聚输出窗口内最大值，平均汇聚输出窗口内平均值。"},{"id":328,"chapter":"现代卷积神经网络","type":"fill","stem":"NiN 的核心创新是用 1×1 卷积代替____。","options":[],"answer":["全连接层"],"answerText":"全连接层","explain":"NiN 用 1×1 卷积代替全连接层，减少参数量，保留空间结构。"},{"id":329,"chapter":"现代卷积神经网络","type":"fill","stem":"NiN 用全局平均汇聚代替最后的全连接层，参数量为____。","options":[],"answer":["0"],"answerText":"0","explain":"全局平均汇聚对每个通道取平均值，参数量为 0。它减少了参数量，避免了过拟合。"},{"id":330,"chapter":"现代卷积神经网络","type":"fill","stem":"批量规范化的作用是让每层输入分布____，允许更____的学习率，加快收敛。","options":[],"answer":["稳定","大"],"answerText":"稳定；大","explain":"批量规范化让每层输入分布稳定，允许更大学习率，加快收敛，还有轻微正则化效果。"},{"id":331,"chapter":"现代卷积神经网络","type":"fill","stem":"ResNet 的核心设计是____，它解决的核心问题是退化问题。","options":[],"answer":["残差连接"],"answerText":"残差连接","explain":"ResNet 的核心设计是残差连接。它解决退化问题:深度增加后，训练误差反而上升。"},{"id":332,"chapter":"现代卷积神经网络","type":"fill","stem":"DenseNet 的核心设计是密集连接，它用____代替相加。","options":[],"answer":["拼接"],"answerText":"拼接","explain":"DenseNet 的核心设计是密集连接。每一层连接前面所有层，用拼接 [x, F(x)] 代替相加。"},{"id":333,"chapter":"现代卷积神经网络","type":"fill","stem":"网络不是越深越好，深度增加会遇到____问题，训练误差反而上升。","options":[],"answer":["退化"],"answerText":"退化","explain":"网络不是越深越好。深度增加会遇到退化问题，训练误差反而上升。ResNet 的残差连接让深度不再是瓶颈。"},{"id":334,"chapter":"循环神经网络与序列模型","type":"single","stem":"循环神经网络(RNN)主要用于处理( )","options":[{"key":"A","text":"空间信息"},{"key":"B","text":"序列信息"},{"key":"C","text":"图像信息"},{"key":"D","text":"表格信息"}],"answer":["B"],"answerText":"B","explain":"如果说卷积神经网络可以有效地处理空间信息，那么循环神经网络则可以更好地处理序列信息。RNN 通过引入状态变量存储过去的信息和当前的输入，从而确定当前的输出。"},{"id":335,"chapter":"循环神经网络与序列模型","type":"single","stem":"RNN 通过什么机制存储过去的信息?( )","options":[{"key":"A","text":"卷积核"},{"key":"B","text":"状态变量(隐状态)"},{"key":"C","text":"池化层"},{"key":"D","text":"全连接层"}],"answer":["B"],"answerText":"B","explain":"循环神经网络通过引入状态变量(隐状态)存储过去的信息和当前的输入，从而可以确定当前的输出。"},{"id":336,"chapter":"循环神经网络与序列模型","type":"single","stem":"序列模型训练时必须尊重时间顺序，原因是( )","options":[{"key":"A","text":"计算量太大"},{"key":"B","text":"不能基于未来数据进行训练"},{"key":"C","text":"数据量太小"},{"key":"D","text":"模型参数太多"}],"answer":["B"],"answerText":"B","explain":"内插法和外推法在实践难度上差别很大。对于拥有的序列数据，训练时始终要尊重其时间顺序，即最好不要基于未来的数据进行训练。"},{"id":337,"chapter":"循环神经网络与序列模型","type":"single","stem":"序列模型中，两种较流行的估计模型是( )","options":[{"key":"A","text":"自回归模型和隐变量自回归模型"},{"key":"B","text":"CNN 和 RNN"},{"key":"C","text":"SVM 和决策树"},{"key":"D","text":"GAN 和 VAE"}],"answer":["A"],"answerText":"A","explain":"序列模型的估计需要专门的统计工具，两种较流行的选择是自回归模型和隐变量自回归模型。"},{"id":338,"chapter":"循环神经网络与序列模型","type":"single","stem":"对于因果模型，通常哪种估计更容易?( )","options":[{"key":"A","text":"反向估计"},{"key":"B","text":"正向估计"},{"key":"C","text":"两者一样"},{"key":"D","text":"无法比较"}],"answer":["B"],"answerText":"B","explain":"对于时间是向前推进的因果模型，正向估计通常比反向估计更容易。"},{"id":339,"chapter":"循环神经网络与序列模型","type":"single","stem":"随着预测时间 k 增加，k 步预测的误差会( )","options":[{"key":"A","text":"保持不变"},{"key":"B","text":"快速累积，预测质量极速下降"},{"key":"C","text":"逐渐减小"},{"key":"D","text":"随机波动"}],"answer":["B"],"answerText":"B","explain":"随着对预测时间 k 值的增加，会造成误差的快速累积和预测质量的极速下降。"},{"id":340,"chapter":"循环神经网络与序列模型","type":"single","stem":"文本预处理中，构建词表的作用是( )","options":[{"key":"A","text":"把文本拆分成词元"},{"key":"B","text":"将词元字符串映射为数字索引"},{"key":"C","text":"把文本转换为词元索引"},{"key":"D","text":"增加文本长度"}],"answer":["B"],"answerText":"B","explain":"为了对文本进行预处理，通常将文本拆分为词元，构建词表将词元字符串映射为数字索引，并将文本数据转换为词元索引以供模型操作。"},{"id":341,"chapter":"循环神经网络与序列模型","type":"single","stem":"语言模型中，n 元语法的作用是( )","options":[{"key":"A","text":"增加序列长度"},{"key":"B","text":"通过截断相关性，为处理长序列提供实用模型"},{"key":"C","text":"减少词表大小"},{"key":"D","text":"增加计算量"}],"answer":["B"],"answerText":"B","explain":"n 元语法通过截断相关性，为处理长序列提供了一种实用的模型。长序列存在一个问题:它们很少出现或者从不出现。"},{"id":342,"chapter":"循环神经网络与序列模型","type":"single","stem":"评价语言模型质量的常用指标是( )","options":[{"key":"A","text":"精度"},{"key":"B","text":"召回率"},{"key":"C","text":"困惑度"},{"key":"D","text":"F1 值"}],"answer":["C"],"answerText":"C","explain":"我们可以使用困惑度来评价语言模型的质量。困惑度是交叉熵的指数，越低越好。"},{"id":343,"chapter":"循环神经网络与序列模型","type":"single","stem":"顺序划分时，需要分离梯度的原因是( )","options":[{"key":"A","text":"增加计算量"},{"key":"B","text":"减少计算量"},{"key":"C","text":"防止过拟合"},{"key":"D","text":"增加参数量"}],"answer":["B"],"answerText":"B","explain":"当使用顺序划分时，我们需要分离梯度以减少计算量。否则梯度会沿整个序列反向传播，计算量爆炸。"},{"id":344,"chapter":"循环神经网络与序列模型","type":"single","stem":"在进行任何预测之前，模型通过预热期进行自我更新，目的是( )","options":[{"key":"A","text":"增加参数量"},{"key":"B","text":"获得比初始值更好的隐状态"},{"key":"C","text":"减少计算量"},{"key":"D","text":"防止过拟合"}],"answer":["B"],"answerText":"B","explain":"在进行任何预测之前，模型通过预热期进行自我更新(例如，获得比初始值更好的隐状态)。"},{"id":345,"chapter":"循环神经网络与序列模型","type":"multi","stem":"关于循环神经网络，下列说法正确的是( )","options":[{"key":"A","text":"可以更好地处理序列信息"},{"key":"B","text":"通过引入状态变量存储过去的信息和当前的输入"},{"key":"C","text":"隐状态可以捕获直到当前时间步序列的历史信息"},{"key":"D","text":"参数数量不会随着时间步的增加而增加"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"RNN 可以更好地处理序列信息，通过隐状态存储过去的信息和当前输入。隐状态捕获历史信息，参数数量不随时间步增加。"},{"id":346,"chapter":"循环神经网络与序列模型","type":"multi","stem":"关于序列模型，下列说法正确的是( )","options":[{"key":"A","text":"训练时始终要尊重时间顺序"},{"key":"B","text":"最好不要基于未来的数据进行训练"},{"key":"C","text":"自回归模型和隐变量自回归模型是两种较流行的选择"},{"key":"D","text":"正向估计通常比反向估计更容易"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"训练时尊重时间顺序，不基于未来数据训练。自回归模型和隐变量自回归模型是两种流行选择。因果模型的正向估计通常比反向估计更容易。"},{"id":347,"chapter":"循环神经网络与序列模型","type":"multi","stem":"关于 k 步预测，下列说法正确的是( )","options":[{"key":"A","text":"在时间步 t 预测 t+k 的输出"},{"key":"B","text":"随着 k 增加，误差快速累积"},{"key":"C","text":"随着 k 增加，预测质量极速下降"},{"key":"D","text":"误差累积是线性的，不会加速"}],"answer":["A","B","C"],"answerText":"ABC","explain":"k 步预测在时间步 t 预测 t+k 的输出。随着 k 增加，误差快速累积，预测质量极速下降。D 错误，误差累积可能比线性更快。"},{"id":348,"chapter":"循环神经网络与序列模型","type":"multi","stem":"关于文本预处理，下列说法正确的是( )","options":[{"key":"A","text":"文本是序列数据的一种最常见的形式之一"},{"key":"B","text":"通常将文本拆分为词元"},{"key":"C","text":"构建词表将词元字符串映射为数字索引"},{"key":"D","text":"将文本数据转换为词元索引以供模型操作"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"文本是序列数据最常见的形式之一。预处理包括拆分词元、构建词表、映射为数字索引、转换为词元索引。"},{"id":349,"chapter":"循环神经网络与序列模型","type":"multi","stem":"关于语言模型，下列说法正确的是( )","options":[{"key":"A","text":"语言模型是自然语言处理的关键"},{"key":"B","text":"n 元语法通过截断相关性处理长序列"},{"key":"C","text":"长序列很少出现或者从不出现"},{"key":"D","text":"齐普夫定律支配着单词的分布"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"语言模型是 NLP 的关键。n 元语法截断相关性处理长序列。长序列很少出现。齐普夫定律支配单词分布。"},{"id":350,"chapter":"循环神经网络与序列模型","type":"multi","stem":"关于随机采样和顺序分区，下列说法正确的是( )","options":[{"key":"A","text":"两者都是读取长序列的主要方式"},{"key":"B","text":"顺序分区保证相邻小批量的子序列在原始序列上相邻"},{"key":"C","text":"随机采样每个 batch 的隐状态独立初始化"},{"key":"D","text":"顺序分区需要分离梯度以减少计算量"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"随机采样和顺序分区都是读取长序列的主要方式。顺序分区保证相邻子序列相邻，随机采样隐状态独立初始化，顺序分区需要分离梯度。"},{"id":351,"chapter":"循环神经网络与序列模型","type":"multi","stem":"关于通过时间反向传播(BPTT)，下列说法正确的是( )","options":[{"key":"A","text":"仅适用于反向传播在具有隐状态的序列模型"},{"key":"B","text":"截断是计算方便性和数值稳定性的需要"},{"key":"C","text":"截断包括规则截断和随机截断"},{"key":"D","text":"矩阵的高次幂可能导致梯度爆炸或消失"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"BPTT 仅适用于具有隐状态的序列模型。截断是计算方便性和数值稳定性的需要，包括规则截断和随机截断。矩阵高次幂可能导致梯度爆炸或消失。"},{"id":352,"chapter":"循环神经网络与序列模型","type":"multi","stem":"关于 BPTT 的计算效率，下列说法正确的是( )","options":[{"key":"A","text":"为了计算效率，BPTT 在计算期间会缓存中间值"},{"key":"B","text":"缓存中间值会增加显存占用"},{"key":"C","text":"缓存中间值可以避免重新计算"},{"key":"D","text":"缓存中间值不影响计算效率"}],"answer":["A","B","C"],"answerText":"ABC","explain":"BPTT 在计算期间会缓存中间值以提高计算效率，但会增加显存占用。D 错误，缓存中间值影响计算效率。"},{"id":353,"chapter":"循环神经网络与序列模型","type":"multi","stem":"关于 RNN 训练中的梯度问题，下列说法正确的是( )","options":[{"key":"A","text":"梯度消失导致早期时间步的梯度接近 0"},{"key":"B","text":"梯度爆炸导致训练发散"},{"key":"C","text":"梯度裁剪可以防止梯度爆炸"},{"key":"D","text":"梯度裁剪可以解决梯度消失"}],"answer":["A","B","C"],"answerText":"ABC","explain":"梯度消失导致早期梯度接近 0，梯度爆炸导致训练发散。梯度裁剪防止梯度爆炸，但不能解决梯度消失。D 错误。"},{"id":354,"chapter":"循环神经网络与序列模型","type":"judge","stem":"循环神经网络可以更好地处理序列信息。","options":[],"answer":"正确","answerText":"正确","explain":"如果说卷积神经网络可以有效地处理空间信息，那么循环神经网络则可以更好地处理序列信息。"},{"id":355,"chapter":"循环神经网络与序列模型","type":"judge","stem":"RNN 通过引入状态变量存储过去的信息和当前的输入。","options":[],"answer":"正确","answerText":"正确","explain":"循环神经网络通过引入状态变量存储过去的信息和当前的输入，从而可以确定当前的输出。"},{"id":356,"chapter":"循环神经网络与序列模型","type":"judge","stem":"序列模型训练时可以基于未来的数据进行训练。","options":[],"answer":"错误","answerText":"错误","explain":"训练时始终要尊重时间顺序，最好不要基于未来的数据进行训练。内插法和外推法在实践难度上差别很大。"},{"id":357,"chapter":"循环神经网络与序列模型","type":"judge","stem":"自回归模型和隐变量自回归模型是两种较流行的序列模型。","options":[],"answer":"正确","answerText":"正确","explain":"序列模型的估计需要专门的统计工具，两种较流行的选择是自回归模型和隐变量自回归模型。"},{"id":358,"chapter":"循环神经网络与序列模型","type":"judge","stem":"对于因果模型，反向估计通常比正向估计更容易。","options":[],"answer":"错误","answerText":"错误","explain":"对于时间是向前推进的因果模型，正向估计通常比反向估计更容易。"},{"id":359,"chapter":"循环神经网络与序列模型","type":"judge","stem":"随着 k 增加，k 步预测的误差会快速累积，预测质量极速下降。","options":[],"answer":"正确","answerText":"正确","explain":"随着对预测时间 k 值的增加，会造成误差的快速累积和预测质量的极速下降。"},{"id":360,"chapter":"循环神经网络与序列模型","type":"judge","stem":"文本预处理中，构建词表将词元字符串映射为数字索引。","options":[],"answer":"正确","answerText":"正确","explain":"构建词表将词元字符串映射为数字索引，并将文本数据转换为词元索引以供模型操作。"},{"id":361,"chapter":"循环神经网络与序列模型","type":"judge","stem":"n 元语法通过截断相关性，为处理长序列提供了一种实用的模型。","options":[],"answer":"正确","answerText":"正确","explain":"n 元语法通过截断相关性，为处理长序列提供了一种实用的模型。长序列存在一个问题:它们很少出现或者从不出现。"},{"id":362,"chapter":"循环神经网络与序列模型","type":"judge","stem":"顺序分区可以保证来自两个相邻小批量的子序列在原始序列上也是相邻的。","options":[],"answer":"正确","answerText":"正确","explain":"在迭代过程中，顺序分区可以保证来自两个相邻的小批量中的子序列在原始序列上也是相邻的。"},{"id":363,"chapter":"循环神经网络与序列模型","type":"judge","stem":"RNN 的隐状态可以捕获直到当前时间步序列的历史信息。","options":[],"answer":"正确","answerText":"正确","explain":"循环神经网络的隐状态可以捕获直到当前时间步序列的历史信息。"},{"id":364,"chapter":"循环神经网络与序列模型","type":"judge","stem":"RNN 模型的参数数量会随着时间步的增加而增加。","options":[],"answer":"错误","answerText":"错误","explain":"循环神经网络模型的参数数量不会随着时间步的增加而增加，因为所有时间步共享同一组权重。"},{"id":365,"chapter":"循环神经网络与序列模型","type":"judge","stem":"困惑度可以用来评价语言模型的质量。","options":[],"answer":"正确","answerText":"正确","explain":"我们可以使用困惑度来评价语言模型的质量。困惑度越低越好。"},{"id":366,"chapter":"循环神经网络与序列模型","type":"judge","stem":"梯度裁剪可以防止梯度爆炸，也能应对梯度消失。","options":[],"answer":"错误","answerText":"错误","explain":"梯度裁剪可以防止梯度爆炸，但不能应对梯度消失。"},{"id":367,"chapter":"循环神经网络与序列模型","type":"judge","stem":"顺序划分时需要分离梯度以减少计算量。","options":[],"answer":"正确","answerText":"正确","explain":"当使用顺序划分时，我们需要分离梯度以减少计算量。"},{"id":368,"chapter":"循环神经网络与序列模型","type":"judge","stem":"预热期可以让模型获得比初始值更好的隐状态。","options":[],"answer":"正确","answerText":"正确","explain":"在进行任何预测之前，模型通过预热期进行自我更新，获得比初始值更好的隐状态。"},{"id":369,"chapter":"循环神经网络与序列模型","type":"judge","stem":"BPTT 中矩阵的高次幂可能导致梯度爆炸或消失。","options":[],"answer":"正确","answerText":"正确","explain":"矩阵的高次幂可能导致神经网络特征值的发散或消失，将以梯度爆炸或梯度消失的形式表现。"},{"id":370,"chapter":"循环神经网络与序列模型","type":"judge","stem":"BPTT 在计算期间会缓存中间值以提高计算效率。","options":[],"answer":"正确","answerText":"正确","explain":"为了计算的效率，“通过时间反向传播”在计算期间会缓存中间值。"},{"id":371,"chapter":"循环神经网络与序列模型","type":"judge","stem":"RNN 的隐状态是记忆，可以完整存储所有历史信息。","options":[],"answer":"错误","answerText":"错误","explain":"隐状态是压缩表示，不是记忆。它是固定维度的向量，不能完整存储所有历史信息。"},{"id":372,"chapter":"循环神经网络与序列模型","type":"judge","stem":"RNN 的参数共享对应时间不变性。","options":[],"answer":"正确","answerText":"正确","explain":"RNN 的参数在不同时间步共享，对应时间不变性。CNN 的权重共享对应空间不变性。"},{"id":373,"chapter":"循环神经网络与序列模型","type":"judge","stem":"RNN 可以完美建模任意长度的序列。","options":[],"answer":"错误","answerText":"错误","explain":"RNN 不能完美建模任意长度序列。长序列中梯度消失/爆炸，隐状态是固定维度的信息瓶颈。"},{"id":374,"chapter":"循环神经网络与序列模型","type":"judge","stem":"字符级语言模型可以用 RNN 实现。","options":[],"answer":"正确","answerText":"正确","explain":"我们可以使用循环神经网络创建字符级语言模型，根据用户提供的文本的前缀生成后续文本。"},{"id":375,"chapter":"循环神经网络与序列模型","type":"single","stem":"GRU 中“重置门”的主要作用是( )","options":[{"key":"A","text":"控制新状态中有多少是旧状态的副本"},{"key":"B","text":"控制“可能还想记住”的过去状态的数量，有助于捕获短期依赖"},{"key":"C","text":"控制输出层的大小"},{"key":"D","text":"控制学习率"}],"answer":["B"],"answerText":"B","explain":"重置门控制“可能还想记住”的过去状态的数量，有助于捕获短期依赖。更新门控制新状态中有多少是旧状态的副本，有助于捕获长期依赖。"},{"id":376,"chapter":"循环神经网络与序列模型","type":"single","stem":"GRU 中“更新门”的主要作用是( )","options":[{"key":"A","text":"控制新状态中有多少个是旧状态的副本，有助于捕获长期依赖"},{"key":"B","text":"控制重置多少历史状态"},{"key":"C","text":"控制输出维度"},{"key":"D","text":"控制梯度裁剪阈值"}],"answer":["A"],"answerText":"A","explain":"更新门控制新状态中有多少个是旧状态的副本，有助于捕获长期依赖。"},{"id":377,"chapter":"循环神经网络与序列模型","type":"single","stem":"GRU 相比 LSTM 的主要优势是( )","options":[{"key":"A","text":"参数更多，效果一定更好"},{"key":"B","text":"结构更简单，计算速度通常更快"},{"key":"C","text":"不需要门控机制"},{"key":"D","text":"只能处理短序列"}],"answer":["B"],"answerText":"B","explain":"GRU 是 LSTM 的简化变体，参数更少，计算速度通常更快，效果通常相当。"},{"id":378,"chapter":"循环神经网络与序列模型","type":"single","stem":"LSTM 中“遗忘门”的主要作用是( )","options":[{"key":"A","text":"决定当前输入有多少写入记忆元"},{"key":"B","text":"决定记忆元中哪些信息被保留、哪些被丢弃"},{"key":"C","text":"决定输出多少信息到隐状态"},{"key":"D","text":"决定学习率大小"}],"answer":["B"],"answerText":"B","explain":"LSTM 有三种门:输入门、遗忘门、输出门。遗忘门决定记忆元中哪些信息被保留、哪些被丢弃。"},{"id":379,"chapter":"循环神经网络与序列模型","type":"single","stem":"LSTM 中“记忆元”与“隐状态”的关系是( )","options":[{"key":"A","text":"两者完全相同"},{"key":"B","text":"记忆元完全属于内部信息，只有隐状态会传递到输出层"},{"key":"C","text":"隐状态完全属于内部信息，记忆元传递到输出层"},{"key":"D","text":"两者都不传递到输出层"}],"answer":["B"],"answerText":"B","explain":"LSTM 的隐藏层输出包括隐状态和记忆元。只有隐状态会传递到输出层，记忆元完全属于内部信息。"},{"id":380,"chapter":"循环神经网络与序列模型","type":"single","stem":"深度循环神经网络中，隐状态的信息传递方向是( )","options":[{"key":"A","text":"只传递到当前层的下一个时间步"},{"key":"B","text":"只传递到下一层的当前时间步"},{"key":"C","text":"同时传递到当前层的下一时间步和下一层的当前时间步"},{"key":"D","text":"不传递"}],"answer":["C"],"answerText":"C","explain":"在深度 RNN 中，隐状态同时传递到当前层的下一时间步和下一层的当前时间步。"},{"id":381,"chapter":"循环神经网络与序列模型","type":"single","stem":"编码器-解码器架构中，编码器的作用是( )","options":[{"key":"A","text":"生成输出序列"},{"key":"B","text":"将长度可变的输入序列转换为固定形状的编码状态"},{"key":"C","text":"计算损失函数"},{"key":"D","text":"执行梯度裁剪"}],"answer":["B"],"answerText":"B","explain":"编码器接收长度可变的序列作为输入，将其转换为具有固定形状的编码状态。"},{"id":382,"chapter":"循环神经网络与序列模型","type":"single","stem":"束搜索中，超参数“束宽”k 的作用是( )","options":[{"key":"A","text":"控制学习率"},{"key":"B","text":"每个时间步保留概率最高的 k 个候选序列"},{"key":"C","text":"控制词表大小"},{"key":"D","text":"控制梯度范数"}],"answer":["B"],"answerText":"B","explain":"束搜索在每个时间步保留概率最高的 k 个候选序列，k 是束宽。k=1 时退化为贪心搜索。"},{"id":383,"chapter":"循环神经网络与序列模型","type":"single","stem":"贪心搜索的主要问题是( )","options":[{"key":"A","text":"计算量太大"},{"key":"B","text":"每个时间步只选当前最优，可能错过全局最优序列"},{"key":"C","text":"无法处理变长序列"},{"key":"D","text":"需要大量显存"}],"answer":["B"],"answerText":"B","explain":"贪心搜索每个时间步选择条件概率最高的词元，但局部最优不等于全局最优。"},{"id":384,"chapter":"循环神经网络与序列模型","type":"single","stem":"强制教学的主要副作用是( )","options":[{"key":"A","text":"训练太慢"},{"key":"B","text":"训练和预测不一致，导致曝光偏差"},{"key":"C","text":"参数量太大"},{"key":"D","text":"无法处理长序列"}],"answer":["B"],"answerText":"B","explain":"强制教学训练时用真实值，预测时用预测值，导致训练和预测不一致，模型没见过带误差的输入，预测时误差会累积。"},{"id":385,"chapter":"循环神经网络与序列模型","type":"single","stem":"BLEU 评估指标测量的是( )","options":[{"key":"A","text":"翻译的语义正确性"},{"key":"B","text":"预测序列和标签序列之间的 n 元语法匹配度"},{"key":"C","text":"模型的参数量"},{"key":"D","text":"训练速度"}],"answer":["B"],"answerText":"B","explain":"BLEU 通过测量预测序列和标签序列之间的 n 元语法匹配度来评估预测，不是语义正确性。"},{"id":386,"chapter":"循环神经网络与序列模型","type":"single","stem":"LSTM 可以缓解梯度消失的主要原因是( )","options":[{"key":"A","text":"参数更多"},{"key":"B","text":"记忆元的梯度路径只乘遗忘门，不乘权重矩阵和激活函数导数"},{"key":"C","text":"使用 ReLU 激活函数"},{"key":"D","text":"不需要反向传播"}],"answer":["B"],"answerText":"B","explain":"LSTM 的记忆元更新是加法路径，梯度只乘遗忘门。遗忘门接近 1 时，梯度可以传很远。"},{"id":387,"chapter":"循环神经网络与序列模型","type":"single","stem":"GRU 和 LSTM 的关系是( )","options":[{"key":"A","text":"完全相同"},{"key":"B","text":"GRU 是 LSTM 的简化变体"},{"key":"C","text":"LSTM 是 GRU 的简化变体"},{"key":"D","text":"两者没有关系"}],"answer":["B"],"answerText":"B","explain":"GRU 由 Cho 等人在 2014 年提出，是 LSTM(1997 年)的简化变体，参数更少，速度更快。"},{"id":388,"chapter":"循环神经网络与序列模型","type":"multi","stem":"关于 GRU 的门控机制，下列说法正确的是( )","options":[{"key":"A","text":"重置门有助于捕获短期依赖"},{"key":"B","text":"更新门有助于捕获长期依赖"},{"key":"C","text":"重置门打开时，GRU 包含基本 RNN"},{"key":"D","text":"更新门打开时，GRU 可以跳过子序列"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"重置门有助于捕获短期依赖，更新门有助于捕获长期依赖。重置门打开时，GRU 包含基本 RNN;更新门打开时，GRU 可以跳过子序列。"},{"id":389,"chapter":"循环神经网络与序列模型","type":"multi","stem":"关于 LSTM 的门，下列说法正确的是( )","options":[{"key":"A","text":"LSTM 有三种门:输入门、遗忘门、输出门"},{"key":"B","text":"遗忘门决定记忆元中哪些信息被丢弃"},{"key":"C","text":"输入门决定当前输入有多少写入记忆元"},{"key":"D","text":"输出门决定隐状态输出多少"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"LSTM 有三种门:输入门、遗忘门、输出门。遗忘门决定丢弃哪些信息，输入门决定写入哪些新信息，输出门决定输出多少到隐状态。"},{"id":390,"chapter":"循环神经网络与序列模型","type":"multi","stem":"关于束搜索，下列说法正确的是( )","options":[{"key":"A","text":"束宽 k=1 时等价于贪心搜索"},{"key":"B","text":"束宽越大，计算量越大"},{"key":"C","text":"束搜索在每个时间步保留 k 个最优候选"},{"key":"D","text":"束搜索一定比贪心搜索好"}],"answer":["A","B","C"],"answerText":"ABC","explain":"束宽 k=1 时退化为贪心搜索。k 越大计算量越大，但搜索空间更大。D 错误，束搜索不保证一定比贪心搜索好，但通常能找到更好的序列。"},{"id":391,"chapter":"循环神经网络与序列模型","type":"multi","stem":"关于 BLEU 评估指标，下列说法正确的是( )","options":[{"key":"A","text":"测量预测序列和标签序列之间的 n 元语法匹配度"},{"key":"B","text":"不是准确率，是重叠度"},{"key":"C","text":"BLEU 高代表翻译完全正确"},{"key":"D","text":"BLEU 对语义等价但表面形式不同的翻译不敏感"}],"answer":["A","B","D"],"answerText":"ABD","explain":"BLEU 测量 n 元语法匹配度，不是准确率。BLEU 对语义等价但表面形式不同的翻译不敏感。C 错误，BLEU 高不代表完全正确。"},{"id":392,"chapter":"循环神经网络与序列模型","type":"multi","stem":"关于编码器-解码器和 seq2seq 的关系，下列说法正确的是( )","options":[{"key":"A","text":"编码器-解码器是架构思想"},{"key":"B","text":"seq2seq 是用 RNN 实现这个思想的具体模型"},{"key":"C","text":"Transformer 也是编码器-解码器架构"},{"key":"D","text":"两者完全相同"}],"answer":["A","B","C"],"answerText":"ABC","explain":"编码器-解码器是架构思想，seq2seq 是用 RNN 实现的具体模型。Transformer 也是编码器- 解码器架构，只是用注意力实现。D 错误。"},{"id":393,"chapter":"循环神经网络与序列模型","type":"judge","stem":"GRU 的重置门有助于捕获长期依赖关系。","options":[],"answer":"错误","answerText":"错误","explain":"重置门有助于捕获短期依赖关系，更新门有助于捕获长期依赖关系。"},{"id":394,"chapter":"循环神经网络与序列模型","type":"judge","stem":"GRU 的更新门可以控制新状态中有多少是旧状态的副本。","options":[],"answer":"正确","answerText":"正确","explain":"更新门控制新状态中有多少个是旧状态的副本。更新门接近 1 时保留旧状态，接近 0 时采用新信息。"},{"id":395,"chapter":"循环神经网络与序列模型","type":"judge","stem":"LSTM 有四种门:输入门、遗忘门、输出门和更新门。","options":[],"answer":"错误","answerText":"错误","explain":"LSTM 有三种门:输入门、遗忘门、输出门。更新门是 GRU 的概念，不是 LSTM 的。"},{"id":396,"chapter":"循环神经网络与序列模型","type":"judge","stem":"LSTM 的记忆元会直接传递到输出层。","options":[],"answer":"错误","answerText":"错误","explain":"只有隐状态会传递到输出层，记忆元完全属于内部信息，不直接传递到输出层。"},{"id":397,"chapter":"循环神经网络与序列模型","type":"judge","stem":"编码器-解码器架构中，编码器将变长输入转换为固定形状的编码状态。","options":[],"answer":"正确","answerText":"正确","explain":"编码器接收变长输入，将其转换为固定形状的编码状态。解码器将固定形状的编码状态映射为变长输出。"},{"id":398,"chapter":"循环神经网络与序列模型","type":"judge","stem":"束搜索中束宽 k 越大，计算量越小。","options":[],"answer":"错误","answerText":"错误","explain":"束宽 k 越大，每个时间步保留的候选序列越多，计算量越大。"},{"id":399,"chapter":"循环神经网络与序列模型","type":"judge","stem":"贪心搜索在每个时间步选择当前条件概率最高的词元。","options":[],"answer":"正确","answerText":"正确","explain":"贪心搜索在每个时间步选择条件概率最高的词元作为输出，但局部最优不等于全局最优。"},{"id":400,"chapter":"循环神经网络与序列模型","type":"judge","stem":"深度循环神经网络只能使用 LSTM，不能使用 GRU。","options":[],"answer":"错误","answerText":"错误","explain":"深度 RNN 可以堆叠任意类型的循环层，包括经典 RNN、GRU、LSTM 等。"},{"id":401,"chapter":"循环神经网络与序列模型","type":"judge","stem":"束宽 k=1 时，束搜索等价于贪心搜索。","options":[],"answer":"正确","answerText":"正确","explain":"束宽 k=1 时，每个时间步只保留一个最优候选，即贪心搜索。"},{"id":402,"chapter":"循环神经网络与序列模型","type":"judge","stem":"LSTM 可以缓解梯度消失问题。","options":[],"answer":"正确","answerText":"正确","explain":"LSTM 通过门控机制和记忆元，让梯度可以在时间步之间更稳定地流动，从而缓解梯度消失问题。"},{"id":403,"chapter":"循环神经网络与序列模型","type":"judge","stem":"现代循环神经网络彻底解决了长序列建模的所有问题。","options":[],"answer":"错误","answerText":"错误","explain":"GRU/LSTM 缓解了梯度消失，但没有彻底解决长序列建模问题。信息瓶颈仍然存在，后面还需要注意力机制和 Transformer。"},{"id":404,"chapter":"循环神经网络与序列模型","type":"judge","stem":"强制教学在 seq2seq 训练中用真实输出序列作为解码器输入。","options":[],"answer":"正确","answerText":"正确","explain":"强制教学训练时用真实输出序列作为解码器输入，而不是用模型的预测结果，让训练更稳定。"},{"id":405,"chapter":"循环神经网络与序列模型","type":"judge","stem":"强制教学会导致曝光偏差。","options":[],"answer":"正确","answerText":"正确","explain":"强制教学训练时用真实值，预测时用预测值，导致训练和预测不一致，模型没见过带误差的输入，预测时误差会累积，这就是曝光偏差。"},{"id":406,"chapter":"循环神经网络与序列模型","type":"judge","stem":"BLEU 测量的是翻译的语义正确性。","options":[],"answer":"错误","answerText":"错误","explain":"BLEU 测量预测序列和标签序列之间的 n 元语法匹配度，不是语义正确性。同义词替换会降低 BLEU，但语义可能完全正确。"},{"id":407,"chapter":"循环神经网络与序列模型","type":"judge","stem":"编码器-解码器注意力中，Q 来自解码器，K、V 来自编码器。","options":[],"answer":"正确","answerText":"正确","explain":"编码器-解码器注意力让解码器用自己的状态作为查询，去查编码器的输出。Q 来自解码器，K、V 来自编码器。"},{"id":408,"chapter":"循环神经网络与序列模型","type":"judge","stem":"seq2seq 的编码器通常使用双向 RNN。","options":[],"answer":"正确","answerText":"正确","explain":"seq2seq 的编码器通常使用双向 RNN，可以同时看过去和未来信息，更好地编码源语言。解码器通常使用单向 RNN，因为生成时不能看未来。"},{"id":409,"chapter":"循环神经网络与序列模型","type":"judge","stem":"贪心搜索保证找到全局最优序列。","options":[],"answer":"错误","answerText":"错误","explain":"贪心搜索每个时间步选当前最优，局部最优不等于全局最优，不能保证找到全局最优序列。"},{"id":410,"chapter":"循环神经网络与序列模型","type":"judge","stem":"穷举搜索保证找到全局最优序列，但计算量指数级。","options":[],"answer":"正确","answerText":"正确","explain":"穷举搜索尝试所有可能的序列，保证找到全局最优，但计算量指数级，实际不可行。"},{"id":411,"chapter":"循环神经网络与序列模型","type":"judge","stem":"束搜索是贪心搜索和穷举搜索的折中。","options":[],"answer":"正确","answerText":"正确","explain":"束搜索每个时间步保留 k 个候选，k=1 是贪心，k=无穷是穷举。中间是折中。"},{"id":412,"chapter":"循环神经网络与序列模型","type":"judge","stem":"LSTM 的记忆元是内部信息，不直接输出。","options":[],"answer":"正确","answerText":"正确","explain":"LSTM 的隐藏层输出包括隐状态和记忆元。只有隐状态会传递到输出层，记忆元完全属于内部信息。"},{"id":413,"chapter":"循环神经网络与序列模型","type":"judge","stem":"现代 RNN 通过门控机制彻底解决了梯度消失问题。","options":[],"answer":"错误","answerText":"错误","explain":"门控机制缓解了梯度消失，但没有彻底解决。长序列中信息瓶颈仍然存在，真正的解决需要注意力机制。"},{"id":414,"chapter":"循环神经网络与序列模型","type":"judge","stem":"深度 RNN 需要谨慎的初始化来确保收敛。","options":[],"answer":"正确","answerText":"正确","explain":"深度 RNN 需要大量调参，初始化需要谨慎，否则训练不收敛。"},{"id":415,"chapter":"循环神经网络与序列模型","type":"judge","stem":"编码器-解码器架构中，解码器可以使用编码器的最终隐状态作为初始隐状态。","options":[],"answer":"正确","answerText":"正确","explain":"编码器的最终隐状态可以作为解码器的初始隐状态，把源语言的信息传给解码器。"},{"id":416,"chapter":"循环神经网络与序列模型","type":"judge","stem":"seq2seq 的损失函数计算时需要遮蔽填充位置。","options":[],"answer":"正确","answerText":"正确","explain":"填充位置不是真实词，计算损失时应该遮蔽，避免模型学习预测填充。"},{"id":417,"chapter":"循环神经网络与序列模型","type":"judge","stem":"束搜索的束宽 k 越大，结果一定越好。","options":[],"answer":"错误","answerText":"错误","explain":"束宽 k 越大，搜索空间越大，但不保证一定找到最优序列，而且计算量越大。k 太大会过拟合验证集。"},{"id":418,"chapter":"循环神经网络与序列模型","type":"judge","stem":"GRU 和 LSTM 都是通过门控机制选择性记忆和遗忘。","options":[],"answer":"正确","answerText":"正确","explain":"GRU 用重置门和更新门，LSTM 用输入门、遗忘门、输出门，都是选择性记忆和遗忘。"},{"id":419,"chapter":"循环神经网络与序列模型","type":"judge","stem":"现代循环神经网络的主线是从序列建模到序列转换再到序列生成。","options":[],"answer":"正确","answerText":"正确","explain":"前半章改进 RNN 本身(GRU、LSTM、深度、双向)，后半章做序列转换(编码器-解码器、seq2seq)，最后用束搜索做序列生成。"},{"id":420,"chapter":"循环神经网络与序列模型","type":"fill","stem":"循环神经网络主要用于处理____信息，通过引入状态变量(隐状态) 存储过去的信息和当前的输入。","options":[],"answer":["序列"],"answerText":"序列","explain":"如果说卷积神经网络可以有效地处理空间信息，那么循环神经网络则可以更好地处理序列信息。RNN 通过引入状态变量存储过去的信息和当前的输入。"},{"id":421,"chapter":"循环神经网络与序列模型","type":"fill","stem":"齐普夫定律描述的是单词频率和排名成____。","options":[],"answer":["反比"],"answerText":"反比","explain":"齐普夫定律支配着单词的分布，单词频率和排名成反比。这个分布不仅适用于一元语法，还适用于其他 n 元语法。"},{"id":422,"chapter":"循环神经网络与序列模型","type":"fill","stem":"读取长序列的主要方式是____和顺序分区。","options":[],"answer":["随机采样"],"answerText":"随机采样","explain":"读取长序列的主要方式是随机采样和顺序分区。顺序分区可以保证相邻小批量的子序列在原始序列上相邻。"},{"id":423,"chapter":"循环神经网络与序列模型","type":"fill","stem":"RNN 的隐状态可以捕获直到当前____序列的历史信息。","options":[],"answer":["时间步"],"answerText":"时间步","explain":"循环神经网络的隐状态可以捕获直到当前时间步序列的历史信息。"},{"id":424,"chapter":"循环神经网络与序列模型","type":"fill","stem":"梯度裁剪可以防止梯度____，但不能应对梯度____。","options":[],"answer":["爆炸","消失"],"answerText":"爆炸；消失","explain":"梯度裁剪可以防止梯度爆炸，但不能应对梯度消失。梯度消失需要 LSTM、GRU 等结构改进。"},{"id":425,"chapter":"循环神经网络与序列模型","type":"fill","stem":"为了计算的效率，BPTT 在计算期间会____中间值，以提高计算效率。","options":[],"answer":["缓存"],"answerText":"缓存","explain":"为了计算的效率，BPTT 在计算期间会缓存中间值，以提高计算效率。"},{"id":426,"chapter":"循环神经网络与序列模型","type":"fill","stem":"RNN 的参数共享对应____不变性，CNN 的权重共享对应____不变性。","options":[],"answer":["时间","空间"],"answerText":"时间；空间","explain":"RNN 的参数在不同时间步共享，对应时间不变性。CNN 的权重在不同空间位置共享，对应空间不变性。"},{"id":427,"chapter":"循环神经网络与序列模型","type":"fill","stem":"LSTM 的隐藏层输出包括隐状态和记忆元，只有____会传递到输出层。","options":[],"answer":["隐状态"],"answerText":"隐状态","explain":"LSTM 的隐藏层输出包括隐状态和记忆元。只有隐状态会传递到输出层，记忆元完全属于内部信息。"},{"id":428,"chapter":"循环神经网络与序列模型","type":"fill","stem":"双向循环神经网络中，每个时间步的隐状态由当前时间步的____数据同时决定。","options":[],"answer":["前后"],"answerText":"前后","explain":"在双向 RNN 中，每个时间步的隐状态由当前时间步的前后数据同时决定。"},{"id":429,"chapter":"循环神经网络与序列模型","type":"fill","stem":"通过截断和____文本序列，可以保证所有的文本序列都具有相同的长度，以便以小批量的方式加载。","options":[],"answer":["填充"],"answerText":"填充","explain":"通过截断和填充文本序列，可以保证所有的文本序列都具有相同的长度，以便以小批量的方式加载。"},{"id":430,"chapter":"循环神经网络与序列模型","type":"fill","stem":"“编码器-解码器”架构可以将长度____的序列作为输入和输出。","options":[],"answer":["可变"],"answerText":"可变","explain":"“编码器-解码器”架构可以将长度可变的序列作为输入和输出，因此适用于机器翻译等序列转换问题。"},{"id":431,"chapter":"循环神经网络与序列模型","type":"fill","stem":"seq2seq 使用两个____来设计序列到序列学习的模型。","options":[],"answer":["循环神经网络"],"answerText":"循环神经网络","explain":"根据“编码器-解码器”架构的设计，我们可以使用两个循环神经网络来设计一个序列到序列学习的模型。"},{"id":432,"chapter":"循环神经网络与序列模型","type":"fill","stem":"穷举搜索保证找到全局最优，但计算量是____级，不可行。","options":[],"answer":["指数"],"answerText":"指数","explain":"穷举搜索尝试所有可能的序列，保证找到全局最优，但计算量指数级，实际不可行。"},{"id":433,"chapter":"循环神经网络与序列模型","type":"fill","stem":"束搜索每个时间步保留概率最高的 k 个候选序列，k 叫____。","options":[],"answer":["束宽"],"answerText":"束宽","explain":"束搜索在每个时间步保留概率最高的 k 个候选序列，k 是束宽。k=1 时退化为贪心搜索。"},{"id":434,"chapter":"循环神经网络与序列模型","type":"fill","stem":"束宽 k=1 时，束搜索等价于____;k 越大，计算量越____。","options":[],"answer":["贪心搜索","大"],"answerText":"贪心搜索；大","explain":"束宽 k=1 时退化为贪心搜索。k 越大，每个时间步保留的候选越多，计算量越大。"},{"id":435,"chapter":"循环神经网络与序列模型","type":"fill","stem":"LSTM 的记忆元是内部信息，不直接传递到____。","options":[],"answer":["输出层"],"answerText":"输出层","explain":"记忆元是内部信息，不直接传递到输出层。只有隐状态会传递到输出层。"},{"id":436,"chapter":"注意力机制与 Transformer","type":"single","stem":"注意力机制的核心思想是( )","options":[{"key":"A","text":"把所有输入一视同仁"},{"key":"B","text":"根据查询和键的相似度，对值加权聚合"},{"key":"C","text":"只保留第一个输入"},{"key":"D","text":"随机选择输入"}],"answer":["B"],"answerText":"B","explain":"注意力用查询和键算相似度，得到权重，再对值加权求和。它的核心是根据相关性分配不同的权重。"},{"id":437,"chapter":"注意力机制与 Transformer","type":"single","stem":"注意力中的 Q、K、V 分别代表( )","options":[{"key":"A","text":"查询、键、值"},{"key":"B","text":"问题、知识、验证"},{"key":"C","text":"质量、键值、向量"},{"key":"D","text":"队列、核、变量"}],"answer":["A"],"answerText":"A","explain":"Q 是查询(Query)，K 是键(Key)，V 是值(Value)。它们代表三个角色，不是三个固定输入。"},{"id":438,"chapter":"注意力机制与 Transformer","type":"single","stem":"注意力权重是( )","options":[{"key":"A","text":"固定的模型参数"},{"key":"B","text":"每次前向传播时根据 Q 和 K 动态计算的"},{"key":"C","text":"随机生成的"},{"key":"D","text":"人工设定的"}],"answer":["B"],"answerText":"B","explain":"注意力权重是每次前向传播时用查询和键算相似度，再 softmax 得到的。它是动态的，不同输入、不同查询，权重不同。"},{"id":439,"chapter":"注意力机制与 Transformer","type":"single","stem":"掩蔽 softmax 的作用是( )","options":[{"key":"A","text":"增加注意力权重"},{"key":"B","text":"忽略填充位置，不参与注意力计算"},{"key":"C","text":"减少模型参数"},{"key":"D","text":"加速训练"}],"answer":["B"],"answerText":"B","explain":"变长序列有填充，填充位置不该参与注意力。把填充位置的分数设为负无穷，softmax 后权重为 0。"},{"id":440,"chapter":"注意力机制与 Transformer","type":"single","stem":"Bahdanau 注意力解决的主要问题是( )","options":[{"key":"A","text":"梯度爆炸"},{"key":"B","text":"seq2seq 编码器把整个源序列压缩成固定向量的瓶颈"},{"key":"C","text":"过拟合"},{"key":"D","text":"数据不足"}],"answer":["B"],"answerText":"B","explain":"普通 seq2seq 的编码器把整个源序列压缩成一个固定向量，长序列信息丢失。Bahdanau 注意力让解码器每一步都直接看编码器的所有隐状态。"},{"id":441,"chapter":"注意力机制与 Transformer","type":"single","stem":"多头注意力中每个头的作用是( )","options":[{"key":"A","text":"重复计算同一个注意力"},{"key":"B","text":"在不同的子空间里算注意力，关注不同的关系"},{"key":"C","text":"增加参数量"},{"key":"D","text":"减少计算量"}],"answer":["B"],"answerText":"B","explain":"每个头有独立的线性变换，在不同的子空间里算注意力。有的头关注语法，有的关注语义，有的关注位置。"},{"id":442,"chapter":"注意力机制与 Transformer","type":"single","stem":"自注意力的 Q、K、V 来自( )","options":[{"key":"A","text":"三个不同的序列"},{"key":"B","text":"同一个序列"},{"key":"C","text":"编码器和解码器"},{"key":"D","text":"随机生成"}],"answer":["B"],"answerText":"B","explain":"自注意力的 Q、K、V 都来自同一个序列，每个位置可以看序列里所有位置，包括自己。"},{"id":443,"chapter":"注意力机制与 Transformer","type":"single","stem":"自注意力相比 RNN 的主要优势是( )","options":[{"key":"A","text":"参数更少"},{"key":"B","text":"任意两个位置直接连接，路径长度 O(1)，可以并行"},{"key":"C","text":"不需要训练"},{"key":"D","text":"只能处理短序列"}],"answer":["B"],"answerText":"B","explain":"RNN 逐步传递，路径长度 O(n)，不能并行。自注意力让任意两个位置直接连接，路径 O(1)，可以并行。"},{"id":444,"chapter":"注意力机制与 Transformer","type":"single","stem":"位置编码的作用是( )","options":[{"key":"A","text":"增加模型参数量"},{"key":"B","text":"给自注意力注入顺序信息"},{"key":"C","text":"减少计算量"},{"key":"D","text":"替代注意力"}],"answer":["B"],"answerText":"B","explain":"自注意力本身没有顺序感，打乱序列顺序输出不变。位置编码给每个位置注入顺序信息，让模型知道词序。"},{"id":445,"chapter":"注意力机制与 Transformer","type":"single","stem":"Transformer 的编码器层包含哪些组件?( )","options":[{"key":"A","text":"多头自注意力、残差连接、层归一化、前馈网络"},{"key":"B","text":"只有自注意力"},{"key":"C","text":"只有前馈网络"},{"key":"D","text":"卷积层和池化层"}],"answer":["A"],"answerText":"A","explain":"编码器层包含多头自注意力、残差连接、层归一化、前馈网络。自注意力和前馈网络是“做什么”，残差和归一化是“怎么训得稳”。"},{"id":446,"chapter":"注意力机制与 Transformer","type":"single","stem":"Transformer 解码器的自注意力为什么要掩蔽?( )","options":[{"key":"A","text":"增加计算量"},{"key":"B","text":"生成时不能看未来，保证训练和预测一致"},{"key":"C","text":"减少参数量"},{"key":"D","text":"加速训练"}],"answer":["B"],"answerText":"B","explain":"解码器逐步生成，第 t 步只能看前 t-1 个词。不掩蔽的话，训练时偷看未来，训练和预测不一致。"},{"id":447,"chapter":"注意力机制与 Transformer","type":"single","stem":"编码器-解码器注意力中，Q、K、V 分别来自( )","options":[{"key":"A","text":"Q 来自解码器，K、V 来自编码器"},{"key":"B","text":"Q 来自编码器，K、V 来自解码器"},{"key":"C","text":"都来自编码器"},{"key":"D","text":"都来自解码器"}],"answer":["A"],"answerText":"A","explain":"编码器-解码器注意力让解码器用自己的状态作为查询，去查编码器的输出。Q 来自解码器，K、V 来自编码器。"},{"id":448,"chapter":"注意力机制与 Transformer","type":"single","stem":"层归一化在 Transformer 中的作用是( )","options":[{"key":"A","text":"增加参数量"},{"key":"B","text":"稳定每层的输入分布，让训练更稳定"},{"key":"C","text":"替代注意力"},{"key":"D","text":"减少计算量"}],"answer":["B"],"answerText":"B","explain":"层归一化对每个样本的所有特征做归一化，让每层输入分布稳定，训练更稳定、收敛更快。"},{"id":449,"chapter":"注意力机制与 Transformer","type":"multi","stem":"关于查询、键、值，下列说法正确的是( )","options":[{"key":"A","text":"Q 是“我想找什么”"},{"key":"B","text":"K 是“每个位置有什么”"},{"key":"C","text":"V 是“每个位置的实际内容”"},{"key":"D","text":"Q、K、V 必须是三个不同的输入"}],"answer":["A","B","C"],"answerText":"ABC","explain":"Q、K、V 是三个角色。D 错误，它们可以来自同一个输入，通过不同的变换得到，这就是自注意力。"},{"id":450,"chapter":"注意力机制与 Transformer","type":"multi","stem":"关于注意力权重，下列说法正确的是( )","options":[{"key":"A","text":"是每次前向传播时动态计算的"},{"key":"B","text":"不同输入、不同查询，权重不同"},{"key":"C","text":"是固定的模型参数"},{"key":"D","text":"通过 softmax 归一化得到"}],"answer":["A","B","D"],"answerText":"ABD","explain":"注意力权重是动态计算的，不同输入不同，通过 softmax 归一化。C 错误，它不是固定参数。"},{"id":451,"chapter":"注意力机制与 Transformer","type":"multi","stem":"关于加性注意力，下列说法正确的是( )","options":[{"key":"A","text":"适合查询和键维度不同"},{"key":"B","text":"用一个小神经网络算相似度"},{"key":"C","text":"计算比缩放点积慢"},{"key":"D","text":"不需要参数"}],"answer":["A","B","C"],"answerText":"ABC","explain":"加性注意力适合维度不同，用一个小神经网络算相似度，计算比缩放点积慢。D 错误，它需要参数。"},{"id":452,"chapter":"注意力机制与 Transformer","type":"multi","stem":"关于掩蔽 softmax，下列说法正确的是( )","options":[{"key":"A","text":"把填充位置的分数设为负无穷"},{"key":"B","text":"softmax 后填充位置权重为 0"},{"key":"C","text":"用于变长序列批处理"},{"key":"D","text":"会增加计算量"}],"answer":["A","B","C"],"answerText":"ABC","explain":"掩蔽 softmax 把填充位置的分数设为负无穷，softmax 后权重为 0，用于变长序列批处理。D 错误，它不增加计算量。"},{"id":453,"chapter":"注意力机制与 Transformer","type":"multi","stem":"关于多头注意力，下列说法正确的是( )","options":[{"key":"A","text":"每个头有独立的线性变换"},{"key":"B","text":"每个头关注不同的子空间"},{"key":"C","text":"所有头输出拼接后过一个线性变换"},{"key":"D","text":"每个头的维度通常是 d/h"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"多头注意力每个头有独立的线性变换，关注不同子空间，输出拼接后过线性变换。每个头维度通常是 d/h，总计算量和单头差不多。"},{"id":454,"chapter":"注意力机制与 Transformer","type":"multi","stem":"关于自注意力，下列说法正确的是( )","options":[{"key":"A","text":"Q、K、V 来自同一个序列"},{"key":"B","text":"每个位置可以看所有位置"},{"key":"C","text":"任意两个位置路径长度 O(1)"},{"key":"D","text":"可以并行计算"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"自注意力的 Q、K、V 来自同一个序列，每个位置可以看所有位置，路径 O(1)，可以并行。"},{"id":455,"chapter":"注意力机制与 Transformer","type":"multi","stem":"关于 Transformer 编码器层，下列说法正确的是( )","options":[{"key":"A","text":"包含多头自注意力"},{"key":"B","text":"包含残差连接和层归一化"},{"key":"C","text":"包含前馈网络"},{"key":"D","text":"包含掩蔽自注意力"}],"answer":["A","B","C"],"answerText":"ABC","explain":"编码器层包含多头自注意力、残差连接、层归一化、前馈网络。D 错误，掩蔽自注意力在解码器里。"},{"id":456,"chapter":"注意力机制与 Transformer","type":"multi","stem":"关于 Transformer 解码器层，下列说法正确的是( )","options":[{"key":"A","text":"包含掩蔽多头自注意力"},{"key":"B","text":"包含编码器-解码器注意力"},{"key":"C","text":"包含前馈网络"},{"key":"D","text":"比编码器多一个子层"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"解码器层包含掩蔽多头自注意力、编码器-解码器注意力、前馈网络，比编码器多一个子层。"},{"id":457,"chapter":"注意力机制与 Transformer","type":"judge","stem":"注意力机制的核心是根据查询和键的相似度，对值加权聚合。","options":[],"answer":"正确","answerText":"正确","explain":"注意力用查询和键算相似度，得到权重，再对值加权求和。这是它的核心思想。"},{"id":458,"chapter":"注意力机制与 Transformer","type":"judge","stem":"注意力中的 Q、K、V 必须是三个不同的输入。","options":[],"answer":"错误","answerText":"错误","explain":"Q、K、V 是三个角色，不是三个固定输入。它们可以来自同一个输入，通过不同的变换得到，这就是自注意力。"},{"id":459,"chapter":"注意力机制与 Transformer","type":"judge","stem":"注意力权重是固定的模型参数。","options":[],"answer":"错误","answerText":"错误","explain":"注意力权重是每次前向传播时根据 Q 和 K 动态计算的，不是固定参数。"},{"id":460,"chapter":"注意力机制与 Transformer","type":"judge","stem":"掩蔽 softmax 用于忽略填充位置。","options":[],"answer":"正确","answerText":"正确","explain":"掩蔽 softmax 把填充位置的分数设为负无穷，softmax 后权重为 0，忽略填充位置。"},{"id":461,"chapter":"注意力机制与 Transformer","type":"judge","stem":"Bahdanau 注意力解决了 seq2seq 的固定向量瓶颈。","options":[],"answer":"正确","answerText":"正确","explain":"Bahdanau 注意力让解码器每一步都直接看编码器的所有隐状态，不再依赖一个固定向量。"},{"id":462,"chapter":"注意力机制与 Transformer","type":"judge","stem":"多头注意力就是把同一个注意力算多次，然后取平均。","options":[],"answer":"错误","answerText":"错误","explain":"多头注意力的每个头有独立的线性变换，在不同的子空间里算注意力，最后拼接。不是重复计算取平均。"},{"id":463,"chapter":"注意力机制与 Transformer","type":"judge","stem":"自注意力的 Q、K、V 都来自同一个序列。","options":[],"answer":"正确","answerText":"正确","explain":"自注意力的 Q、K、V 都来自同一个序列，每个位置可以看序列里所有位置，包括自己。"},{"id":464,"chapter":"注意力机制与 Transformer","type":"judge","stem":"自注意力让任意两个位置直接连接，路径长度 O(1)。","options":[],"answer":"正确","answerText":"正确","explain":"自注意力让任意两个位置直接连接，不需要逐步传递，路径长度是常数 O(1)。"},{"id":465,"chapter":"注意力机制与 Transformer","type":"judge","stem":"自注意力可以完全并行计算。","options":[],"answer":"正确","answerText":"正确","explain":"自注意力让每个位置独立计算，不依赖其他位置的结果，可以完全并行。"},{"id":466,"chapter":"注意力机制与 Transformer","type":"judge","stem":"Transformer 解码器的自注意力要掩蔽，因为生成时不能看未来。","options":[],"answer":"正确","answerText":"正确","explain":"解码器逐步生成，第 t 步只能看前 t-1 个词。不掩蔽的话，训练时偷看未来，训练和预测不一致。"},{"id":467,"chapter":"注意力机制与 Transformer","type":"judge","stem":"编码器-解码器注意力中，Q 来自编码器，K、V 来自解码器。","options":[],"answer":"错误","answerText":"错误","explain":"Q 来自解码器，K、V 来自编码器。解码器用自己的状态去查编码器的输出。反过来说就错了。"},{"id":468,"chapter":"注意力机制与 Transformer","type":"judge","stem":"层归一化在 Transformer 中用于稳定每层的输入分布。","options":[],"answer":"正确","answerText":"正确","explain":"层归一化对每个样本的所有特征做归一化，让每层输入分布稳定，训练更稳定、收敛更快。"},{"id":469,"chapter":"注意力机制与 Transformer","type":"judge","stem":"残差连接在 Transformer 中让梯度直接回流。","options":[],"answer":"正确","answerText":"正确","explain":"残差连接是子层输出加子层输入，加法路径的导数是 1，梯度可以直接回流，不会消失。"},{"id":470,"chapter":"注意力机制与 Transformer","type":"judge","stem":"Transformer 训练时解码器输入真实输出序列，这叫强制教学。","options":[],"answer":"正确","answerText":"正确","explain":"强制教学训练时用真实输出序列作为解码器输入，不用模型的预测结果，让训练更稳定、可并行。"},{"id":471,"chapter":"注意力机制与 Transformer","type":"judge","stem":"标签平滑防止模型过度自信。","options":[],"answer":"正确","answerText":"正确","explain":"标签平滑不把真实标签当成 one-hot，而是加一点噪声，防止模型把正确类别概率推到接近 1，提高泛化能力。"},{"id":472,"chapter":"注意力机制与 Transformer","type":"judge","stem":"BERT 只保留编码器，双向看上下文。","options":[],"answer":"正确","answerText":"正确","explain":"BERT 只保留编码器，自注意力不掩蔽，每个位置可以看所有位置，所以叫双向看上下文。"},{"id":473,"chapter":"注意力机制与 Transformer","type":"judge","stem":"GPT 只保留解码器，自回归生成。","options":[],"answer":"正确","answerText":"正确","explain":"GPT 只保留解码器，自注意力掩蔽，每个位置只能看前面的位置，所以叫自回归生成。"},{"id":474,"chapter":"注意力机制与 Transformer","type":"judge","stem":"T5 是编码器-解码器架构，统一成文本到文本。","options":[],"answer":"正确","answerText":"正确","explain":"T5 保留完整的编码器-解码器结构，把所有任务统一成文本到文本的形式。"},{"id":475,"chapter":"注意力机制与 Transformer","type":"judge","stem":"ViT 把图像当序列处理。","options":[],"answer":"正确","answerText":"正确","explain":"ViT 把图像切成小块，每块当成一个词，输入编码器。这就是把图像当序列处理。"},{"id":476,"chapter":"注意力机制与 Transformer","type":"judge","stem":"Transformer 的编码器和解码器必须使用相同数量的层。","options":[],"answer":"错误","answerText":"错误","explain":"编码器和解码器的层数可以不同。原始 Transformer 是 6+6，但很多模型会根据任务调整。"},{"id":477,"chapter":"注意力机制与 Transformer","type":"judge","stem":"自注意力的计算量是 O(n²·d)，长序列很贵。","options":[],"answer":"正确","answerText":"正确","explain":"每个位置都要和所有位置算注意力，n 个位置就是 n×n 个分数。计算量是 O(n²·d)，长序列很贵。"},{"id":478,"chapter":"注意力机制与 Transformer","type":"judge","stem":"注意力机制可以完全取代 RNN。","options":[],"answer":"错误","answerText":"错误","explain":"在大多数任务上能取代，但不是所有。RNN 在流式处理、资源受限等场景仍然有用。Transformer 计算量随序列长度平方增长，超长序列很贵。"},{"id":479,"chapter":"注意力机制与 Transformer","type":"judge","stem":"多头注意力的每个头维度通常是 d/h。","options":[],"answer":"正确","answerText":"正确","explain":"每个头的维度通常是 d/h，这样多头总计算量和单头差不多。如果每个头都是 d 维，计算量会变成 h 倍。"},{"id":480,"chapter":"注意力机制与 Transformer","type":"judge","stem":"注意力机制是从 RNN 的补充演变成 RNN 的替代。","options":[],"answer":"正确","answerText":"正确","explain":"Bahdanau 注意力是 RNN 加注意力，缓解瓶颈。Transformer 是纯注意力，完全取代 RNN。注意力从补充变成了替代。"},{"id":481,"chapter":"注意力机制与 Transformer","type":"judge","stem":"正弦位置编码可以外推到比训练时更长的序列。","options":[],"answer":"正确","answerText":"正确","explain":"正弦位置编码用正弦和余弦函数生成，不需要学习，可以外推到更长序列。可学习位置编码不能外推。"},{"id":482,"chapter":"注意力机制与 Transformer","type":"judge","stem":"多头注意力如果每个头的变换都一样，等价于单头。","options":[],"answer":"正确","answerText":"正确","explain":"如果每个头的变换都一样，所有头输出相同，拼接后等价于单头。多头的前提是每个头有不同的变换。"},{"id":483,"chapter":"注意力机制与 Transformer","type":"judge","stem":"Transformer 是组合创新，不是从零发明的新模型。","options":[],"answer":"正确","answerText":"正确","explain":"自注意力、残差连接、层归一化、前馈网络都是已有技术。Transformer 的创新是把它们组合起来，用自注意力取代 RNN。"},{"id":484,"chapter":"注意力机制与 Transformer","type":"judge","stem":"缩放点积注意力中，维度越高，点积的标准差越大。","options":[],"answer":"正确","answerText":"正确","explain":"点积是 d 项乘积的和，方差是 d，标准差是 √d。维度越高，标准差越大。"},{"id":485,"chapter":"注意力机制与 Transformer","type":"judge","stem":"自注意力的输出可以解释为“每个位置对所有位置信息的加权聚合”。","options":[],"answer":"正确","answerText":"正确","explain":"自注意力用每个位置的查询和所有位置的键算权重，再对所有位置的值加权求和。输出就是加权聚合的结果。"},{"id":486,"chapter":"注意力机制与 Transformer","type":"judge","stem":"位置编码加到嵌入向量上，是相加不是拼接。","options":[],"answer":"正确","answerText":"正确","explain":"位置编码加到嵌入向量上，保持维度不变，计算高效。拼接会让维度翻倍，增加计算量。"},{"id":487,"chapter":"注意力机制与 Transformer","type":"judge","stem":"编码器-解码器注意力的 Q 来自解码器，因为解码器是“提问方”。","options":[],"answer":"正确","answerText":"正确","explain":"解码器想知道当前生成到这个词时，源语言的哪些位置相关。Q 代表“我想找什么”，所以来自解码器。"},{"id":488,"chapter":"注意力机制与 Transformer","type":"judge","stem":"Transformer 的编码器层和解码器层都包含前馈网络。","options":[],"answer":"正确","answerText":"正确","explain":"编码器层和解码器层都包含前馈网络。前馈网络负责对每个位置做非线性变换。"},{"id":489,"chapter":"注意力机制与 Transformer","type":"judge","stem":"注意力权重可视化可以帮助理解模型在关注什么。","options":[],"answer":"正确","answerText":"正确","explain":"注意力权重可视化能看出模型在关注哪些位置，帮助调试和理解模型行为。"},{"id":490,"chapter":"注意力机制与 Transformer","type":"fill","stem":"注意力机制的核心思想是根据查询和键的相似度，对____加权聚合。","options":[],"answer":["值"],"answerText":"值","explain":"注意力用查询和键算相似度，得到权重，再对值加权求和。这是它的核心思想。"},{"id":491,"chapter":"注意力机制与 Transformer","type":"fill","stem":"注意力权重是每次前向传播时根据查询和____动态计算的，不是固定的模型参数。","options":[],"answer":["键"],"answerText":"键","explain":"注意力权重是动态计算的，不同输入、不同查询，权重不同。它不是固定参数。"},{"id":492,"chapter":"注意力机制与 Transformer","type":"fill","stem":"加性注意力适合查询和键维度____的情况，缩放点积注意力适合维度____的情况。","options":[],"answer":["不同","相同"],"answerText":"不同；相同","explain":"加性注意力用一个小神经网络算相似度，适合维度不同。缩放点积用点积算相似度，适合维度相同。"},{"id":493,"chapter":"注意力机制与 Transformer","type":"fill","stem":"缩放点积注意力中除以 √d 的作用是防止点积太大导致____饱和。","options":[],"answer":["softmax"],"answerText":"softmax","explain":"点积的方差随维度 d 增长，标准差是 √d。除以 √d 把标准差拉回 1，防止 softmax 饱和成 one-hot，梯度接近 0。"},{"id":494,"chapter":"注意力机制与 Transformer","type":"fill","stem":"自注意力的 Q、K、V 都来自同一个序列，每个位置可以看____位置。","options":[],"answer":["所有"],"answerText":"所有","explain":"自注意力的 Q、K、V 都来自同一个序列，每个位置可以看序列里所有位置，包括自己。"},{"id":495,"chapter":"注意力机制与 Transformer","type":"fill","stem":"自注意力让任意两个位置直接连接，路径长度是 O(1)，可以____计算。","options":[],"answer":["并行"],"answerText":"并行","explain":"自注意力让任意两个位置直接连接，路径长度 O(1)，可以并行计算。RNN 逐步传递，路径 O (n)，不能并行。"},{"id":496,"chapter":"注意力机制与 Transformer","type":"fill","stem":"位置编码的作用是给自注意力注入____信息。","options":[],"answer":["顺序"],"answerText":"顺序","explain":"自注意力本身没有顺序感，打乱序列顺序输出不变。位置编码给每个位置注入顺序信息，让模型知道词序。"},{"id":497,"chapter":"注意力机制与 Transformer","type":"fill","stem":"编码器-解码器注意力中，Q 来自____，K、V 来自____。","options":[],"answer":["解码器","编码器"],"answerText":"解码器；编码器","explain":"编码器-解码器注意力让解码器用自己的状态作为查询，去查编码器的输出。Q 来自解码器，K、V 来自编码器。"},{"id":498,"chapter":"注意力机制与 Transformer","type":"fill","stem":"Transformer 训练时解码器输入真实输出序列，这叫____。","options":[],"answer":["强制教学"],"answerText":"强制教学","explain":"强制教学训练时用真实输出序列作为解码器输入，不用模型的预测结果，让训练更稳定、可并行。"},{"id":499,"chapter":"注意力机制与 Transformer","type":"fill","stem":"学习率预热是先____后____，让训练初期更稳定。","options":[],"answer":["小","大"],"answerText":"小；大","explain":"学习率预热是先小后大，训练初期用小学习率防止发散，逐渐增大到设定值。"},{"id":500,"chapter":"注意力机制与 Transformer","type":"judge","stem":"Transformer 训练时不需要任何技巧，直接训练就能收敛。","options":[],"answer":"错误","answerText":"错误","explain":"Transformer 训练需要强制教学、掩蔽、学习率预热、标签平滑等技巧。没有这些，训练不稳定，容易发散。"},{"id":501,"chapter":"计算机视觉应用","type":"single","stem":"图像增广的主要目的是( )","options":[{"key":"A","text":"增加模型参数量"},{"key":"B","text":"在有限数据上制造多样性，减少过拟合"},{"key":"C","text":"减少训练时间"},{"key":"D","text":"提高模型深度"}],"answer":["B"],"answerText":"B","explain":"图像增广通过随机变换制造更多样的训练样本，让模型见过更多变化，减少过拟合。"},{"id":502,"chapter":"计算机视觉应用","type":"single","stem":"微调时通常冻结前面的层，原因是( )","options":[{"key":"A","text":"前面的层参数太多"},{"key":"B","text":"前面的层学到的是通用特征，对新任务也有用"},{"key":"C","text":"前面的层不重要"},{"key":"D","text":"冻结可以减少模型深度"}],"answer":["B"],"answerText":"B","explain":"前面的层学到的是边缘、纹理等通用特征，对新任务也有用。冻结可以防止过拟合、减少计算量。"},{"id":503,"chapter":"计算机视觉应用","type":"single","stem":"微调的学习率通常比从头训练( )","options":[{"key":"A","text":"更大"},{"key":"B","text":"更小"},{"key":"C","text":"相同"},{"key":"D","text":"无关"}],"answer":["B"],"answerText":"B","explain":"预训练权重已经很好，大步长会破坏它们。微调学习率通常是从头训练的 1/10 到 1/100。"},{"id":504,"chapter":"计算机视觉应用","type":"single","stem":"目标检测的输出是( )","options":[{"key":"A","text":"一个类别标签"},{"key":"B","text":"一组边界框和每个框的类别"},{"key":"C","text":"每个像素的类别"},{"key":"D","text":"一张新图像"}],"answer":["B"],"answerText":"B","explain":"目标检测输出一组边界框，每个框标注类别。分类输出一个标签，分割输出每个像素的类别。"},{"id":505,"chapter":"计算机视觉应用","type":"single","stem":"锚框的作用是( )","options":[{"key":"A","text":"人工标注真实框"},{"key":"B","text":"预先定义不同大小和比例的候选框"},{"key":"C","text":"计算损失函数"},{"key":"D","text":"替代边界框"}],"answer":["B"],"answerText":"B","explain":"锚框是预先定义的不同大小、不同比例的候选框。模型在锚框上做预测，减少候选框数量。"},{"id":506,"chapter":"计算机视觉应用","type":"single","stem":"IoU 的定义是( )","options":[{"key":"A","text":"交集面积"},{"key":"B","text":"交集面积除以并集面积"},{"key":"C","text":"并集面积除以交集面积"},{"key":"D","text":"两个框的距离"}],"answer":["B"],"answerText":"B","explain":"IoU 是交集面积除以并集面积，是归一化的重合度。完全重合 IoU=1，完全不重合 IoU=0。"},{"id":507,"chapter":"计算机视觉应用","type":"single","stem":"非极大值抑制(NMS)的作用是( )","options":[{"key":"A","text":"增加候选框数量"},{"key":"B","text":"去掉重叠的预测框，保留最优的"},{"key":"C","text":"计算 IoU"},{"key":"D","text":"生成锚框"}],"answer":["B"],"answerText":"B","explain":"NMS 按置信度排序，保留最高的框，去掉与它 IoU 超过阈值的框，重复直到处理完。"},{"id":508,"chapter":"计算机视觉应用","type":"single","stem":"多尺度目标检测中，浅层特征图通常负责检测( )","options":[{"key":"A","text":"大物体"},{"key":"B","text":"小物体"},{"key":"C","text":"所有物体"},{"key":"D","text":"背景"}],"answer":["B"],"answerText":"B","explain":"浅层感受野小，每个位置对应原图区域小，适合检测小物体。深层感受野大，适合检测大物体。"},{"id":509,"chapter":"计算机视觉应用","type":"single","stem":"SSD 的核心思想是( )","options":[{"key":"A","text":"只用一层特征图检测"},{"key":"B","text":"锚框 + 多尺度 + 分类 + 回归"},{"key":"C","text":"两阶段检测"},{"key":"D","text":"只用全连接层"}],"answer":["B"],"answerText":"B","explain":"SSD 把锚框、多尺度、分类、回归组合起来，一次前向就输出检测结果。"},{"id":510,"chapter":"计算机视觉应用","type":"single","stem":"R-CNN 的主要计算瓶颈是( )","options":[{"key":"A","text":"锚框太多"},{"key":"B","text":"每个候选框都要跑一次 CNN"},{"key":"C","text":"没有使用 GPU"},{"key":"D","text":"损失函数太复杂"}],"answer":["B"],"answerText":"B","explain":"R-CNN 对每个候选框都跑一次 CNN，候选框之间有很多重叠区域，重复计算严重。"},{"id":511,"chapter":"计算机视觉应用","type":"single","stem":"Fast R-CNN 相比 R-CNN 的主要改进是( )","options":[{"key":"A","text":"整张图跑一次 CNN，候选框在特征图上取"},{"key":"B","text":"用 RPN 生成候选框"},{"key":"C","text":"加了分割分支"},{"key":"D","text":"去掉候选框"}],"answer":["A"],"answerText":"A","explain":"Fast R-CNN 整张图跑一次 CNN，候选框在特征图上取对应区域，减少重复计算。"},{"id":512,"chapter":"计算机视觉应用","type":"single","stem":"Faster R-CNN 中的 RPN 作用是( )","options":[{"key":"A","text":"分类"},{"key":"B","text":"生成候选框"},{"key":"C","text":"分割"},{"key":"D","text":"计算损失"}],"answer":["B"],"answerText":"B","explain":"RPN 是区域提议网络，在特征图上预测每个位置有没有物体、框要怎么调整，用来生成候选框。"},{"id":513,"chapter":"计算机视觉应用","type":"single","stem":"Mask R-CNN 在 Faster R-CNN 基础上加了( )","options":[{"key":"A","text":"锚框"},{"key":"B","text":"分割分支"},{"key":"C","text":"RPN"},{"key":"D","text":"多尺度"}],"answer":["B"],"answerText":"B","explain":"Mask R-CNN 在 Faster R-CNN 基础上加了分割分支，输出边界框、类别和像素级掩码，做实例分割。"},{"id":514,"chapter":"计算机视觉应用","type":"single","stem":"语义分割的任务是( )","options":[{"key":"A","text":"给整张图一个标签"},{"key":"B","text":"给每个像素分类"},{"key":"C","text":"画边界框"},{"key":"D","text":"生成新图像"}],"answer":["B"],"answerText":"B","explain":"语义分割给每个像素分类，输出每个像素的类别标签。"},{"id":515,"chapter":"计算机视觉应用","type":"single","stem":"全卷积网络(FCN)的核心特点是( )","options":[{"key":"A","text":"没有卷积层"},{"key":"B","text":"去掉全连接层，保留空间信息"},{"key":"C","text":"只有全连接层"},{"key":"D","text":"不需要训练"}],"answer":["B"],"answerText":"B","explain":"全卷积网络去掉全连接层，全部用卷积，输出保留空间维度，每个像素一个预测。"},{"id":516,"chapter":"计算机视觉应用","type":"single","stem":"转置卷积的作用是( )","options":[{"key":"A","text":"下采样"},{"key":"B","text":"上采样，把小特征图变大"},{"key":"C","text":"分类"},{"key":"D","text":"计算损失"}],"answer":["B"],"answerText":"B","explain":"转置卷积做上采样，小特征图变成大特征图。它不是卷积的逆运算，是可学习的上采样。"},{"id":517,"chapter":"计算机视觉应用","type":"single","stem":"转置卷积和卷积的关系是( )","options":[{"key":"A","text":"转置卷积是卷积的精确逆运算"},{"key":"B","text":"转置卷积是可学习的上采样，不是逆运算"},{"key":"C","text":"两者完全相同"},{"key":"D","text":"转置卷积不能学习"}],"answer":["B"],"answerText":"B","explain":"卷积会丢失信息，转置卷积只能恢复形状，不能恢复丢失的细节。它是可学习的上采样，不是逆运算。"},{"id":518,"chapter":"计算机视觉应用","type":"single","stem":"风格迁移的损失函数包含( )","options":[{"key":"A","text":"只有内容损失"},{"key":"B","text":"只有风格损失"},{"key":"C","text":"内容损失 + 风格损失"},{"key":"D","text":"只有分类损失"}],"answer":["C"],"answerText":"C","explain":"风格迁移的损失包含内容损失和风格损失。内容损失保持内容，风格损失保持风格。"},{"id":519,"chapter":"计算机视觉应用","type":"single","stem":"风格迁移中 Gram 矩阵的作用是( )","options":[{"key":"A","text":"计算内容损失"},{"key":"B","text":"捕捉特征图之间的相关性，表示风格"},{"key":"C","text":"生成图像"},{"key":"D","text":"计算分类损失"}],"answer":["B"],"answerText":"B","explain":"Gram 矩阵是特征图的内积矩阵，捕捉不同通道之间的相关性，表示风格。风格损失用 Gram 矩阵的差异衡量。"},{"id":520,"chapter":"计算机视觉应用","type":"multi","stem":"关于图像增广，下列说法正确的是( )","options":[{"key":"A","text":"在有限数据上制造多样性"},{"key":"B","text":"可以减少过拟合"},{"key":"C","text":"增广方法必须匹配任务的语义不变性"},{"key":"D","text":"所有任务都能用所有增广方法"}],"answer":["A","B","C"],"answerText":"ABC","explain":"图像增广制造多样性、减少过拟合，但增广方法必须匹配任务的语义不变性。D 错误，数字 6 和 9 不能翻转。"},{"id":521,"chapter":"计算机视觉应用","type":"multi","stem":"关于微调，下列说法正确的是( )","options":[{"key":"A","text":"加载预训练模型"},{"key":"B","text":"替换输出层适配新任务"},{"key":"C","text":"可以冻结前面的层"},{"key":"D","text":"学习率通常比从头训练小"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"微调加载预训练模型，替换输出层，冻结前面的层，用较小的学习率训练。"},{"id":522,"chapter":"计算机视觉应用","type":"multi","stem":"关于目标检测，下列说法正确的是( )","options":[{"key":"A","text":"输出一组边界框和类别"},{"key":"B","text":"需要定位物体"},{"key":"C","text":"和分类的输出形式相同"},{"key":"D","text":"用 mAP 评估"}],"answer":["A","B","D"],"answerText":"ABD","explain":"目标检测输出边界框和类别，需要定位，用 mAP 评估。C 错误，分类输出一个标签，检测输出一组框。"},{"id":523,"chapter":"计算机视觉应用","type":"multi","stem":"关于 IoU，下列说法正确的是( )","options":[{"key":"A","text":"交集面积除以并集面积"},{"key":"B","text":"完全重合 IoU=1"},{"key":"C","text":"完全不重合 IoU=0"},{"key":"D","text":"用来衡量两个框的重合程度"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"IoU 是交集除以并集，完全重合为 1，完全不重合为 0，用来衡量重合程度。"},{"id":524,"chapter":"计算机视觉应用","type":"multi","stem":"关于非极大值抑制(NMS)，下列说法正确的是( )","options":[{"key":"A","text":"按置信度排序"},{"key":"B","text":"保留最高的框"},{"key":"C","text":"去掉与它 IoU 超过阈值的框"},{"key":"D","text":"两个真实物体重叠多时可能误删"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"NMS 按置信度排序，保留最高的，去掉重叠框。局限是两个真实物体重叠多时可能误删。"},{"id":525,"chapter":"计算机视觉应用","type":"multi","stem":"关于多尺度目标检测，下列说法正确的是( )","options":[{"key":"A","text":"用不同层的特征图检测"},{"key":"B","text":"浅层检测小物体"},{"key":"C","text":"深层检测大物体"},{"key":"D","text":"只用一层特征图"}],"answer":["A","B","C"],"answerText":"ABC","explain":"多尺度检测用不同层的特征图，浅层检测小物体，深层检测大物体。D 错误。"},{"id":526,"chapter":"计算机视觉应用","type":"multi","stem":"关于 SSD，下列说法正确的是( )","options":[{"key":"A","text":"单发多框检测"},{"key":"B","text":"一次前向输出检测结果"},{"key":"C","text":"每个特征图位置输出类别分数和边界框偏移"},{"key":"D","text":"是两阶段检测"}],"answer":["A","B","C"],"answerText":"ABC","explain":"SSD 是单发多框检测，一次前向输出结果，每个位置输出类别分数和框偏移。D 错误，SSD 是一阶段。"},{"id":527,"chapter":"计算机视觉应用","type":"multi","stem":"关于 R-CNN 系列的演进，下列说法正确的是( )","options":[{"key":"A","text":"R-CNN 每个候选框跑一次 CNN"},{"key":"B","text":"Fast R-CNN 整张图跑一次 CNN"},{"key":"C","text":"Faster R-CNN 用 RPN 生成候选框"},{"key":"D","text":"Mask R-CNN 加了分割分支"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"R-CNN 每个候选框跑一次 CNN，Fast R-CNN 整张图跑一次，Faster R-CNN 用 RPN，Mask R- CNN 加分割分支。"},{"id":528,"chapter":"计算机视觉应用","type":"multi","stem":"关于语义分割，下列说法正确的是( )","options":[{"key":"A","text":"给每个像素分类"},{"key":"B","text":"输出和输入空间尺寸对应"},{"key":"C","text":"用全卷积网络保留空间信息"},{"key":"D","text":"用转置卷积上采样"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"语义分割给每个像素分类，输出和输入空间尺寸对应，用全卷积网络保留空间信息，用转置卷积上采样。"},{"id":529,"chapter":"计算机视觉应用","type":"multi","stem":"关于全卷积网络(FCN)，下列说法正确的是( )","options":[{"key":"A","text":"去掉全连接层"},{"key":"B","text":"全部用卷积"},{"key":"C","text":"输出保留空间维度"},{"key":"D","text":"适合语义分割"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"全卷积网络去掉全连接层，全部用卷积，输出保留空间维度，适合语义分割。"},{"id":530,"chapter":"计算机视觉应用","type":"multi","stem":"关于风格迁移的训练，下列说法正确的是( )","options":[{"key":"A","text":"更新的是合成图像的像素"},{"key":"B","text":"模型参数是冻结的"},{"key":"C","text":"用预训练的 CNN 提取特征"},{"key":"D","text":"和普通模型训练完全一样"}],"answer":["A","B","C"],"answerText":"ABC","explain":"风格迁移更新的是合成图像的像素，模型参数冻结，用预训练 CNN 提取特征。D 错误，和普通模型训练不同。"},{"id":531,"chapter":"计算机视觉应用","type":"multi","stem":"关于不同视觉任务的评估指标，下列说法正确的是( )","options":[{"key":"A","text":"分类用精度"},{"key":"B","text":"检测用 mAP"},{"key":"C","text":"分割用 mIoU"},{"key":"D","text":"风格迁移靠人眼评估"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"分类用精度，检测用 mAP，分割用 mIoU，风格迁移靠人眼评估。不同任务评估方式不同。"},{"id":532,"chapter":"计算机视觉应用","type":"multi","stem":"关于图像增广的常见方法，下列说法正确的是( )","options":[{"key":"A","text":"翻转"},{"key":"B","text":"裁剪"},{"key":"C","text":"变色"},{"key":"D","text":"组合多种变换"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"图像增广常见方法有翻转、裁剪、变色、组合多种变换。"},{"id":533,"chapter":"计算机视觉应用","type":"multi","stem":"关于微调和图像增广的关系，下列说法正确的是( )","options":[{"key":"A","text":"两者都解决数据不足"},{"key":"B","text":"图像增广从数据入手"},{"key":"C","text":"微调从模型入手"},{"key":"D","text":"两者可以一起用"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"微调和图像增广都解决数据不足。图像增广从数据入手，微调从模型入手，两者可以一起用。"},{"id":534,"chapter":"计算机视觉应用","type":"multi","stem":"关于目标检测的正负样本，下列说法正确的是( )","options":[{"key":"A","text":"和真实框 IoU 高的锚框算正样本"},{"key":"B","text":"和真实框 IoU 低的锚框算负样本"},{"key":"C","text":"中间值的锚框可以忽略"},{"key":"D","text":"所有锚框都是正样本"}],"answer":["A","B","C"],"answerText":"ABC","explain":"IoU 高的锚框算正样本，低的算负样本，中间值忽略。D 错误。"},{"id":535,"chapter":"计算机视觉应用","type":"multi","stem":"关于计算机视觉的四类任务，下列说法正确的是( )","options":[{"key":"A","text":"分类输出一个标签"},{"key":"B","text":"检测输出一组框和类别"},{"key":"C","text":"分割输出每个像素的类别"},{"key":"D","text":"生成输出新图像"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"分类输出标签，检测输出框和类别，分割输出像素类别，生成输出新图像。任务形式不同，输出形式不同。"},{"id":536,"chapter":"计算机视觉应用","type":"judge","stem":"数字 6 和 9 可以用左右翻转做图像增广。","options":[],"answer":"错误","answerText":"错误","explain":"数字 6 和 9 翻转后会互换，改变标签语义。增广不能改变标签，所以不能用左右翻转。"},{"id":537,"chapter":"计算机视觉应用","type":"judge","stem":"目标检测的输出是一个类别标签。","options":[],"answer":"错误","answerText":"错误","explain":"目标检测输出一组边界框和每个框的类别，不是单个标签。分类才输出单个标签。"},{"id":538,"chapter":"计算机视觉应用","type":"judge","stem":"锚框是预先定义的不同大小和比例的候选框。","options":[],"answer":"正确","answerText":"正确","explain":"锚框是预先定义的候选框，不同大小、不同比例，用来减少候选框数量。"},{"id":539,"chapter":"计算机视觉应用","type":"judge","stem":"IoU 是交集面积除以并集面积。","options":[],"answer":"正确","answerText":"正确","explain":"IoU 是交集面积除以并集面积，是归一化的重合度。"},{"id":540,"chapter":"计算机视觉应用","type":"judge","stem":"NMS 按置信度排序，保留最高的框，去掉重叠框。","options":[],"answer":"正确","answerText":"正确","explain":"NMS 按置信度排序，保留最高的框，去掉与它 IoU 超过阈值的框，重复直到处理完。"},{"id":541,"chapter":"计算机视觉应用","type":"judge","stem":"多尺度检测中，浅层特征图检测大物体。","options":[],"answer":"错误","answerText":"错误","explain":"浅层感受野小，检测小物体。深层感受野大，检测大物体。反过来说就错了。"},{"id":542,"chapter":"计算机视觉应用","type":"judge","stem":"SSD 是一次前向就输出检测结果的单阶段检测模型。","options":[],"answer":"正确","answerText":"正确","explain":"SSD 是单发多框检测，一次前向输出检测结果，不需要两阶段。"},{"id":543,"chapter":"计算机视觉应用","type":"judge","stem":"R-CNN 对每个候选框都跑一次 CNN。","options":[],"answer":"正确","answerText":"正确","explain":"R-CNN 对每个候选框都跑一次 CNN，计算量巨大。Fast R-CNN 改进了这一点。"},{"id":544,"chapter":"计算机视觉应用","type":"judge","stem":"Fast R-CNN 整张图跑一次 CNN，候选框在特征图上取。","options":[],"answer":"正确","answerText":"正确","explain":"Fast R-CNN 整张图跑一次 CNN，候选框在特征图上取对应区域，减少重复计算。"},{"id":545,"chapter":"计算机视觉应用","type":"judge","stem":"Mask R-CNN 在 Faster R-CNN 基础上加了分割分支。","options":[],"answer":"正确","answerText":"正确","explain":"Mask R-CNN 在 Faster R-CNN 基础上加了分割分支，输出边界框、类别和像素级掩码。"},{"id":546,"chapter":"计算机视觉应用","type":"judge","stem":"语义分割是给
