整张图一个标签。","options":[],"answer":"错误","answerText":"错误","explain":"语义分割是给每个像素分类，不是给整张图一个标签。给整张图一个标签是分类。"},{"id":547,"chapter":"计算机视觉应用","type":"judge","stem":"全卷积网络去掉全连接层，保留空间信息。","options":[],"answer":"正确","answerText":"正确","explain":"全卷积网络去掉全连接层，全部用卷积，输出保留空间维度，每个像素一个预测。"},{"id":548,"chapter":"计算机视觉应用","type":"judge","stem":"转置卷积是卷积的精确逆运算。","options":[],"answer":"错误","answerText":"错误","explain":"转置卷积不是卷积的逆运算。卷积会丢失信息，转置卷积只能恢复形状，不能恢复丢失的细节。"},{"id":549,"chapter":"计算机视觉应用","type":"judge","stem":"转置卷积是可学习的上采样。","options":[],"answer":"正确","answerText":"正确","explain":"转置卷积是可学习的上采样，小特征图变大特征图。和插值上采样比，它能学到更好的上采样方式。"},{"id":550,"chapter":"计算机视觉应用","type":"judge","stem":"风格迁移的损失函数只包含内容损失。","options":[],"answer":"错误","answerText":"错误","explain":"风格迁移的损失包含内容损失和风格损失。只有内容损失会生成和内容图一样的图像，没有风格。"},{"id":551,"chapter":"计算机视觉应用","type":"judge","stem":"风格迁移中 Gram 矩阵用来捕捉风格。","options":[],"answer":"正确","answerText":"正确","explain":"Gram 矩阵是特征图的内积矩阵，捕捉通道之间的相关性，表示风格。"},{"id":552,"chapter":"计算机视觉应用","type":"judge","stem":"图像增广和微调都解决数据不足的问题。","options":[],"answer":"正确","answerText":"正确","explain":"图像增广从数据入手制造多样性，微调从模型入手复用知识，两者都解决数据不足。"},{"id":553,"chapter":"计算机视觉应用","type":"judge","stem":"语义分割用 mIoU 评估。","options":[],"answer":"正确","answerText":"正确","explain":"语义分割用 mIoU 评估，每个类别算 IoU，然后所有类别平均。"},{"id":554,"chapter":"计算机视觉应用","type":"judge","stem":"锚框和真实框的 IoU 用来定义正负样本。","options":[],"answer":"正确","answerText":"正确","explain":"IoU 高的锚框算正样本，低的算负样本，中间值忽略。这就是目标检测训练数据的构造方式。"},{"id":555,"chapter":"计算机视觉应用","type":"judge","stem":"计算机视觉的四类任务输出形式不同，评估方式也不同。","options":[],"answer":"正确","answerText":"正确","explain":"分类输出标签，检测输出框，分割输出像素标签，生成输出图像。任务形式不同，评估方式也不同。"},{"id":556,"chapter":"计算机视觉应用","type":"fill","stem":"图像增广的主要目的是在有限数据上制造多样性，减少____。","options":[],"answer":["过拟合"],"answerText":"过拟合","explain":"图像增广通过随机变换制造更多样的训练样本，让模型见过更多变化，减少过拟合。"},{"id":557,"chapter":"计算机视觉应用","type":"fill","stem":"增广方法必须匹配任务的语义不变性，不能改变标签的____。","options":[],"answer":["语义"],"answerText":"语义","explain":"增广不能改变标签的语义。数字 6 和 9 翻转后会互换，改变标签语义，所以数字识别不能用左右翻转。"},{"id":558,"chapter":"计算机视觉应用","type":"fill","stem":"微调时通常冻结前面的层，原因是前面的层学到的是____特征，对新任务也有用。","options":[],"answer":["通用"],"answerText":"通用","explain":"前面的层学到的是边缘、纹理等通用特征，对新任务也有用。冻结可以防止过拟合、减少计算量。"},{"id":559,"chapter":"计算机视觉应用","type":"fill","stem":"微调的学习率通常比从头训练____，因为预训练权重已经很好。","options":[],"answer":["小"],"answerText":"小","explain":"微调学习率通常比从头训练小，因为预训练权重已经很好，大步长会破坏它们。通常是从头训练的 1/10 到 1/100。"},{"id":560,"chapter":"计算机视觉应用","type":"fill","stem":"目标检测的输出是一组边界框和每个框的____。","options":[],"answer":["类别"],"answerText":"类别","explain":"目标检测输出一组边界框，每个框标注类别。分类输出一个标签，分割输出每个像素的类别。"},{"id":561,"chapter":"计算机视觉应用","type":"fill","stem":"非极大值抑制(NMS)按____排序，保留最高的框，去掉与它 IoU 超过阈值的框。","options":[],"answer":["置信度"],"answerText":"置信度","explain":"NMS 按置信度排序，保留置信度最高的框，去掉与它 IoU 超过阈值的框，重复直到处理完。"},{"id":562,"chapter":"计算机视觉应用","type":"fill","stem":"R-CNN 的主要计算瓶颈是每个____都要跑一次 CNN。","options":[],"answer":["候选框"],"answerText":"候选框","explain":"R-CNN 对每个候选框都跑一次 CNN，候选框之间有很多重叠区域，重复计算严重。"},{"id":563,"chapter":"计算机视觉应用","type":"fill","stem":"Fast R-CNN 相比 R-CNN 的主要改进是整张图跑一次 CNN，候选框在____上取。","options":[],"answer":["特征图"],"answerText":"特征图","explain":"Fast R-CNN 整张图跑一次 CNN，候选框在特征图上取对应区域，减少重复计算。"},{"id":564,"chapter":"计算机视觉应用","type":"fill","stem":"Faster R-CNN 中的 RPN 作用是生成候选框，实现____训练。","options":[],"answer":["端到端"],"answerText":"端到端","explain":"RPN 是区域提议网络，在特征图上预测每个位置有没有物体、框要怎么调整，用来生成候选框，实现端到端训练。"},{"id":565,"chapter":"计算机视觉应用","type":"fill","stem":"Mask R-CNN 在 Faster R-CNN 基础上加了分割分支，做____分割。","options":[],"answer":["实例"],"answerText":"实例","explain":"Mask R-CNN 在 Faster R-CNN 基础上加了分割分支，输出边界框、类别和像素级掩码，做实例分割。"},{"id":566,"chapter":"计算机视觉应用","type":"fill","stem":"转置卷积不是卷积的____运算，因为卷积会丢失信息。","options":[],"answer":["逆"],"answerText":"逆","explain":"转置卷积不是卷积的逆运算。卷积会丢失信息，转置卷积只能恢复形状，不能恢复丢失的细节。"},{"id":567,"chapter":"计算机视觉应用","type":"fill","stem":"风格迁移的损失包含内容损失和____损失。","options":[],"answer":["风格"],"answerText":"风格","explain":"风格迁移的损失包含内容损失和风格损失。内容损失保持内容，风格损失保持风格。"},{"id":568,"chapter":"计算机视觉应用","type":"fill","stem":"风格迁移中，____矩阵用来捕捉特征图之间的相关性，表示风格。","options":[],"answer":["Gram"],"answerText":"Gram","explain":"Gram 矩阵是特征图的内积矩阵，捕捉不同通道之间的相关性，表示风格。风格损失用 Gram 矩阵的差异衡量。"}];

/* ===== 基础 ===== */
const TYPE_META = {
  single:{label:'单选', cls:'b-single'},
  multi:{label:'多选', cls:'b-multi'},
  judge:{label:'判断', cls:'b-judge'},
  fill:{label:'填空', cls:'b-fill'}
};
const CHAPTERS = ['线性回归','softmax 回归','多层感知机','模型选择与泛化','层和块与参数管理','卷积神经网络','现代卷积神经网络','循环神经网络与序列模型','注意力机制与 Transformer','计算机视觉应用'];
const byId = new Map(QUESTIONS.map(q => [q.id, q]));
const CHAPTER_COUNT = {};
QUESTIONS.forEach(q => CHAPTER_COUNT[q.chapter] = (CHAPTER_COUNT[q.chapter] || 0) + 1);
const PAGE_SIZE = 25;
const K_WRONG = 'dlq_wrong_v1', K_HIST = 'dlq_hist_v1', K_SESS = 'dlq_sess_v1';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function load(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function save(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

function freshSession(){
  return {
    mode:'sequence', chapter:null, queue:QUESTIONS.map(q => q.id), index:0,
    selected:[], fillValues:[], roundResults:{}, finished:false, view:'practice',
    bankQuery:'', bankChapter:'all', bankType:'all', bankPage:1
  };
}

let wrongBook = load(K_WRONG, {});
let historyBook = load(K_HIST, {});
let app = Object.assign(freshSession(), load(K_SESS, {}) || {});
let chapterOpen = false;

(function validateSession(){
  if(!Array.isArray(app.queue) || !app.queue.length || app.queue.some(id => !byId.has(id))){
    const keep = {view:app.view, bankQuery:app.bankQuery || '', bankChapter:app.bankChapter || 'all', bankType:app.bankType || 'all', bankPage:app.bankPage || 1};
    app = Object.assign(freshSession(), keep);
  }
  if(app.index < 0 || app.index >= app.queue.length) app.index = 0;
  if(!app.roundResults || typeof app.roundResults !== 'object') app.roundResults = {};
  if(!Array.isArray(app.selected)) app.selected = [];
  if(!Array.isArray(app.fillValues)) app.fillValues = [];
  if(!['practice','wrong','bank'].includes(app.view)) app.view = 'practice';
})();

function saveSession(){
  save(K_SESS, {
    mode:app.mode, chapter:app.chapter, queue:app.queue, index:app.index,
    selected:app.selected, fillValues:app.fillValues, roundResults:app.roundResults,
    finished:app.finished, view:app.view, bankQuery:app.bankQuery, bankChapter:app.bankChapter,
    bankType:app.bankType, bankPage:app.bankPage
  });
}

let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ===== 统计 ===== */
function updateStats(){
  const attempted = Object.keys(historyBook).length;
  const mastered = Object.values(historyBook).filter(h => h && h.lastCorrect).length;
  const wrongCount = Object.keys(wrongBook).length;
  $('#statDone').textContent = attempted;
  $('#statRate').textContent = attempted ? Math.round(mastered / attempted * 100) + '%' : '—';
  $('#statWrong').textContent = wrongCount;
  const badge = $('#wrongBadge');
  badge.textContent = wrongCount;
  badge.style.display = wrongCount ? 'inline-flex' : 'none';
}

function syncTabs(){
  $$('#tabs .tab').forEach(b => b.classList.toggle('active', b.dataset.view === app.view));
}

function syncViews(){
  $$('.view').forEach(v => v.classList.toggle('hidden', v.id !== 'view-' + app.view));
}

function renderActive(){
  updateStats();
  syncViews();
  if(app.view === 'practice') renderPractice();
  else if(app.view === 'wrong') renderWrongView();
  else renderBankView();
}

/* ===== 练习主视图 ===== */
function roundLabel(){
  if(app.mode === 'random') return '随机练习';
  if(app.mode === 'chapter') return '按章节 · ' + (app.chapter || '');
  if(app.mode === 'wrong') return '错题重练';
  return '顺序练习';
}

function syncModeUI(){
  $$('#modeTabs button').forEach(b => b.classList.toggle('active', b.dataset.mode === app.mode));
  const picker = $('#chapterPicker');
  if(app.mode === 'chapter'){
    picker.classList.remove('hidden');
    if(app.chapter && !chapterOpen){
      picker.innerHTML = `<div class="chapter-current"><span>章节：<b>${esc(app.chapter)}</b></span><button id="toggleChapter">切换章节</button></div>`;
    }else{
      picker.innerHTML = CHAPTERS.map(ch =>
        `<button class="chip ${app.chapter === ch ? 'active' : ''}" data-ch="${esc(ch)}">${esc(ch)}<em>${CHAPTER_COUNT[ch] || 0}</em></button>`
      ).join('');
    }
  }else{
    picker.classList.add('hidden');
    picker.innerHTML = '';
  }
}

function renderPractice(){
  syncModeUI();
  const body = $('#practiceBody');
  const bar = $('#roundbar');

  if(app.mode === 'chapter' && !app.chapter){
    bar.classList.add('hidden');
    body.innerHTML = `<div class="chapter-hint">从上方章节列表选择一章，开始专项练习</div>`;
    return;
  }
  if(app.mode === 'wrong' && !app.queue.length){
    bar.classList.add('hidden');
    body.innerHTML = `<div class="empty"><div class="empty-ico">✓</div><h3>错题集还是空的</h3><p>答错的题会自动收进这里，方便二刷。先去做几题吧。</p><button class="btn primary" id="goPractice">去顺序练习</button></div>`;
    const b = $('#goPractice');
    if(b) b.addEventListener('click', () => startRound('sequence', null));
    return;
  }
  if(app.finished){
    bar.classList.add('hidden');
    body.innerHTML = summaryHTML();
    bindSummary();
    return;
  }
  if(!app.queue.length){
    bar.classList.add('hidden');
    body.innerHTML = `<div class="empty"><div class="empty-ico">?</div><h3>本轮没有题目</h3><p>换一个模式或章节试试。</p></div>`;
    return;
  }

  const q = byId.get(app.queue[app.index]);
  if(!q){
    app.index = 0;
    saveSession();
    renderPractice();
    return;
  }
  const rec = app.roundResults[q.id] || null;
  if(rec){
    if(q.type === 'fill') app.fillValues = Array.isArray(rec.userAnswer) ? rec.userAnswer.slice() : [];
    else app.selected = Array.isArray(rec.userAnswer) ? rec.userAnswer.slice() : [rec.userAnswer].filter(Boolean);
  }

  bar.classList.remove('hidden');
  $('#roundLabel').textContent = roundLabel();
  $('#roundProgress').textContent = (app.index + 1) + ' / ' + app.queue.length;
  $('#progressFill').style.width = ((app.index + 1) / app.queue.length * 100) + '%';

  body.innerHTML = cardHTML(q, rec);
  bindCard(q, rec);
}

function stemHTML(q, rec){
  if(q.type !== 'fill') return `<div class="stem">${esc(q.stem)}</div>`;
  const parts = q.stem.split(/_+/);
  let html = '';
  parts.forEach((part, i) => {
    html += esc(part);
    if(i < parts.length - 1) html += `<span class="blank-slot">${['①','②','③','④'][i] || (i + 1)}</span>`;
  });
  return `<div class="stem stem-fill">${html}</div>`;
}

function fillFieldsHTML(q, rec){
  if(q.type !== 'fill') return '';
  const vals = rec ? (rec.userAnswer || []) : (app.fillValues || []);
  return `<div class="fill-fields">` + q.answer.map((_, i) => {
    const v = vals[i] == null ? '' : vals[i];
    let cls = '';
    if(rec && rec.matches) cls = rec.matches[i] ? ' ok' : ' bad';
    return `<label class="fill-field${cls}">
      <span class="fill-label">空 ${i + 1}</span>
      <input class="fill-input" data-i="${i}" value="${esc(v)}" placeholder="填写答案" ${rec ? 'disabled' : ''} autocomplete="off" spellcheck="false">
    </label>`;
  }).join('') + `</div>`;
}

function optionDefs(q){
  return q.type === 'judge'
    ? [{key:'正确', text:'正确'}, {key:'错误', text:'错误'}]
    : q.options;
}

function cardHTML(q, rec){
  const meta = TYPE_META[q.type];
  const sel = Array.isArray(app.selected) ? app.selected : [];
  const submitted = !!rec;
  const opts = optionDefs(q);
  const optsHTML = opts.map(o => {
    const isCorrect = submitted && q.answer.includes(o.key);
    const isUser = submitted && (Array.isArray(rec.userAnswer) ? rec.userAnswer.includes(o.key) : rec.userAnswer === o.key);
    const isSel = !submitted && sel.includes(o.key);
    let cls = 'opt';
    if(isCorrect) cls += ' is-correct';
    else if(isUser) cls += ' is-wrong';
    else if(isSel) cls += ' is-selected';
    let mark = '';
    if(isCorrect) mark = '<span class="opt-mark">✓</span>';
    else if(isUser) mark = '<span class="opt-mark">✕</span>';
    const keyText = q.type === 'judge' ? (o.key === '正确' ? '对' : '错') : o.key;
    return `<button class="${cls}" data-key="${esc(o.key)}" ${submitted ? 'aria-disabled="true"' : ''}>
      <span class="opt-key">${keyText}</span>
      <span class="opt-txt">${esc(o.text)}</span>
      ${mark}
    </button>`;
  }).join('');

  const result = rec ? resultHTML(q, rec) : '';
  const isLast = app.index === app.queue.length - 1;
  let mainBtn;
  if(rec && rec.selfPending){
    mainBtn = `<button class="btn ok" id="selfRight">我答对了</button><button class="btn danger" id="selfWrong">我答错了</button>`;
  }else if(rec){
    mainBtn = `<button class="btn primary" id="mainBtn">${isLast ? '查看本轮成绩' : '下一题'}</button>`;
  }else{
    mainBtn = `<button class="btn primary" id="mainBtn" ${canSubmit(q) ? '' : 'disabled'}>提交答案</button>`;
  }
  const hint = rec ? '已作答，可回看解析' : (q.type === 'fill' ? '填完所有空再提交' : '选择答案后提交');

  return `<article class="qcard">
    <div class="qmeta">
      <span class="badge b-chapter">${esc(q.chapter)}</span>
      <span class="badge ${meta.cls}">${meta.label}题</span>
      <span class="qno">No.${String(q.id).padStart(3,'0')}</span>
    </div>
    ${stemHTML(q, rec)}
    ${fillFieldsHTML(q, rec)}
    <div class="options ${submitted ? 'locked' : ''}">${optsHTML}</div>
    <div id="resultSlot">${result}</div>
    <div class="actions">
      <button class="btn ghost" id="prevBtn" ${app.index === 0 ? 'disabled' : ''}>上一题</button>
      <div class="spacer"></div>
      <span class="hint">${hint}</span>
      ${mainBtn}
    </div>
  </article>`;
}

function bindCard(q, rec){
  $$('#practiceBody .opt').forEach(btn => {
    if(rec) return;
    btn.addEventListener('click', () => {
      const key = btn.dataset.key;
      if(q.type === 'multi'){
        const i = app.selected.indexOf(key);
        if(i >= 0) app.selected.splice(i, 1);
        else app.selected.push(key);
      }else{
        app.selected = app.selected[0] === key ? [] : [key];
      }
      saveSession();
      renderPractice();
    });
  });

  $$('#practiceBody .fill-input').forEach(inp => {
    if(rec) return;
    inp.addEventListener('input', () => {
      app.fillValues[Number(inp.dataset.i)] = inp.value;
      const btn = $('#mainBtn');
      if(btn) btn.disabled = !canSubmit(q);
      saveSession();
    });
  });

  const prev = $('#prevBtn');
  if(prev) prev.addEventListener('click', goPrev);

  const main = $('#mainBtn');
  if(main) main.addEventListener('click', () => {
    if(rec) goNext();
    else handleSubmit(q);
  });

  const sr = $('#selfRight');
  if(sr) sr.addEventListener('click', () => selfEvaluate(q, true));
  const sw = $('#selfWrong');
  if(sw) sw.addEventListener('click', () => selfEvaluate(q, false));
}

/* ===== 作答 ===== */
function canSubmit(q){
  if(q.type === 'fill') return app.fillValues.length >= q.answer.length && q.answer.every((_, i) => (app.fillValues[i] || '').trim() !== '');
  return (app.selected || []).length > 0;
}

function currentUserAnswer(q){
  if(q.type === 'fill') return q.answer.map((_, i) => (app.fillValues[i] || '').trim());
  if(q.type === 'judge') return app.selected[0] || '';
  return app.selected.slice().sort();
}

function answerText(q){
  if(q.type === 'fill') return q.answer.join('；');
  if(q.type === 'judge') return q.answer;
  return q.answer.join('');
}
function userTextOf(q, user){
  if(q.type === 'fill') return Array.isArray(user) ? user.join('；') : (user || '');
  if(q.type === 'judge') return user || '';
  return Array.isArray(user) ? user.join('') : (user || '');
}

function normFill(s){
  return String(s || '').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]/g, '');
}
function fillMatch(user, ans){
  const u = normFill(user), a = normFill(ans);
  if(!u) return false;
  if(u === a) return true;
  if(a.length >= 2 && (u.includes(a) || a.includes(u))) return true;
  return false;
}
function gradeFill(q, user){
  const matches = q.answer.map((ans, i) => fillMatch(user[i], ans));
  return {correct:matches.every(Boolean), matches};
}
function sameSet(a, b){
  const A = a.slice().sort(), B = b.slice().sort();
  return A.length === B.length && A.every((x, i) => x === B[i]);
}

function recordAnswer(q, user, correct, wasWrong){
  const h = historyBook[q.id] || {attempts:0, correctAttempts:0, lastCorrect:false};
  h.attempts += 1;
  if(correct) h.correctAttempts += 1;
  h.lastCorrect = !!correct;
  historyBook[q.id] = h;

  if(correct){
    if(wrongBook[q.id]){
      delete wrongBook[q.id];
      toast('已移出错题集');
    }
  }else{
    const w = wrongBook[q.id] || {count:0, last:0, lastAnswer:''};
    w.count += 1;
    w.last = Date.now();
    w.lastAnswer = userTextOf(q, user);
    wrongBook[q.id] = w;
    toast('已加入错题集');
  }
  save(K_HIST, historyBook);
  save(K_WRONG, wrongBook);
  updateStats();
}

function handleSubmit(q){
  if(!canSubmit(q)) return;
  const user = currentUserAnswer(q);
  const wasWrong = !!wrongBook[q.id];

  if(q.type === 'fill'){
    const g = gradeFill(q, user);
    const rec = {userAnswer:user, matches:g.matches, correct:g.correct ? true : null, selfPending:!g.correct, wasWrong};
    app.roundResults[q.id] = rec;
    if(g.correct) recordAnswer(q, user, true, wasWrong);
    saveSession();
    renderPractice();
    return;
  }

  const correct = q.type === 'judge' ? (user === q.answer) : sameSet(user, q.answer);
  app.roundResults[q.id] = {userAnswer:user, correct, selfPending:false, wasWrong, matches:null};
  recordAnswer(q, user, correct, wasWrong);
  saveSession();
  renderPractice();
}

function selfEvaluate(q, correct){
  const rec = app.roundResults[q.id];
  if(!rec || !rec.selfPending) return;
  rec.correct = correct;
  rec.selfPending = false;
  recordAnswer(q, rec.userAnswer, correct, rec.wasWrong);
  saveSession();
  renderPractice();
}

function loadRecordState(q){
  const rec = app.roundResults[q.id];
  if(!rec){
    app.selected = [];
    app.fillValues = [];
    return;
  }
  if(q.type === 'fill') app.fillValues = Array.isArray(rec.userAnswer) ? rec.userAnswer.slice() : [];
  else app.selected = Array.isArray(rec.userAnswer) ? rec.userAnswer.slice() : [rec.userAnswer].filter(Boolean);
}

function goNext(){
  if(app.index >= app.queue.length - 1){
    app.finished = true;
    saveSession();
    renderPractice();
    return;
  }
  app.index += 1;
  loadRecordState(byId.get(app.queue[app.index]));
  saveSession();
  renderPractice();
}
function goPrev(){
  if(app.index <= 0) return;
  app.index -= 1;
  loadRecordState(byId.get(app.queue[app.index]));
  saveSession();
  renderPractice();
}

}

/* ===== 本轮成绩 ===== */
function summaryHTML(){
  const results = Object.values(app.roundResults);
  const total = results.length;
  const correct = results.filter(r => r.correct === true).length;
  const wrong = results.filter(r => r.correct === false).length;
  const pct = total ? Math.round(correct / total * 100) : 0;
  let title = '本轮完成';
  let lead = `${roundLabel()} · 共 ${total} 题`;
  if(app.mode === 'wrong' && !Object.keys(wrongBook).length){
    title = '错题全部攻克';
    lead = '这一轮错题都答对了，错题集已清空。';
  }else if(pct >= 90){
    lead = `${roundLabel()} · ${total} 题，状态很稳。`;
  }else if(pct < 60){
    lead = `${roundLabel()} · ${total} 题，建议回看错题解析。`;
  }
  return `<div class="summary">
    <h2>${title}</h2>
    <p class="lead">${lead}</p>
    <div class="ring" style="--p:${pct}"><div class="ring-in"><b>${pct}%</b><span>正确率</span></div></div>
    <div class="sum-stats">

}

function bindSummary(){
  const again = $('#againBtn');

    if(app.mode === 'wrong' && !Object.keys(wrongBook).length){
      toast('错题集是空的，回到顺序练习');
      startRound('sequence', null);
      return;
    }
    startRound(app.mode, app.chapter);
  });
  const wr = $('#wrongRoundBtn');

    if(!Object.keys(wrongBook).length){ toast('错题集是空的'); return; }

/* ===== 开始一轮 ===== */
function startRound(mode, chapter){
  let ids;
  if(mode === 'sequence') ids = QUESTIONS.map(q => q.id);
  else if(mode === 'random') ids = shuffle(QUESTIONS.map(q => q.id));
  else if(mode === 'chapter') ids = QUESTIONS.filter(q => q.chapter === chapter).map(q => q.id);
  else if(mode === 'wrong') ids = Object.keys(wrongBook).map(Number).filter(id => byId.has(id)).sort((a, b) => a - b);
  if(!ids || !ids.length){ toast('没有可练习的题目'); return; }

  app.mode = mode;
  app.chapter = mode === 'chapter' ? chapter : null;
  chapterOpen = false;
  app.queue = ids;
  app.index = 0;
  app.selected = [];
  app.fillValues = [];
  app.roundResults = {};
  app.finished = false;
  app.view = 'practice';
  saveSession();
  syncTabs();
  renderActive();
  window.scrollTo({top:0, behavior:'smooth'});
}

function startSingle(id){
  if(!byId.has(id)) return;
  app.mode = 'wrong';
  app.chapter = null;
  app.queue = [id];
  app.index = 0;
  app.selected = [];
  app.fillValues = [];
  app.roundResults = {};
  app.finished = false;
  app.view = 'practice';
  saveSession();
  syncTabs();
  renderActive();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ===== 错题集 ===== */
const wrongOpen = new Set();

function wrongIds(){
  return Object.keys(wrongBook).map(Number).filter(id => byId.has(id)).sort((a, b) => (wrongBook[b].last || 0) - (wrongBook[a].last || 0));
}

    if(b) b.addEventListener('click', () => { app.view = 'practice'; saveSession(); syncTabs(); renderActive(); });
    return;
  }

      </div>
      <div class="wi-actions">
        <button class="mini" data-act="redo" data-id="${id}">重做这题</button>
        <button class="mini" data-act="explain" data-id="${id}">${open ? '收起解析' : '查看解析'}</button>

/* ===== 题库总览 ===== */
const bankOpen = new Set();

function filteredQuestions(){
  const query = (app.bankQuery || '').trim().toLowerCase();
  return QUESTIONS.filter(q => {
    if(app.bankChapter !== 'all' && q.chapter !== app.bankChapter) return false;
    if(app.bankType !== 'all' && q.type !== app.bankType) return false;
    if(!query) return true;
    const hay = [q.stem, q.chapter, q.explain, q.answerText, ...(q.options || []).map(o => o.text)].join(' ').toLowerCase();
    return hay.includes(query);
  });
}

function renderBankView(){
  const host = $('#view-bank');
  const chapterOpts = ['<option value="all">全部章节</option>'].concat(
    CHAPTERS.map(ch => `<option value="${esc(ch)}" ${app.bankChapter === ch ? 'selected' : ''}>${esc(ch)}（${CHAPTER_COUNT[ch] || 0}）</option>`)
  ).join('');
  const typeOpts = [
    ['all','全部题型'],['single','单选题'],['multi','多选题'],['judge','判断题'],['fill','填空题']
  ].map(([v,label]) => `<option value="${v}" ${app.bankType === v ? 'selected' : ''}>${label}</option>`).join('');

  host.innerHTML = `<div class="view-head">
      <div><h2>题库总览</h2><p>全部 568 题，按章节和题型检索；答案与解析默认折叠。</p></div>
    </div>
    <div class="bank-panel">
      <label class="search"><span>⌕</span><input id="bankSearch" type="search" placeholder="搜索题干、选项、答案、解析…" value="${esc(app.bankQuery || '')}"></label>
      <select id="bankChapter">${chapterOpts}</select>
      <select id="bankType">${typeOpts}</select>
    </div>
    <div class="bank-count" id="bankCount"></div>
    <div class="bank-list" id="bankList"></div>
    <div class="pager" id="bankPager"></div>`;

  const input = $('#bankSearch');
  if(input){
    input.addEventListener('input', () => {
      app.bankQuery = input.value;
      app.bankPage = 1;
      saveSession();
      renderBankList();
    });
  }
  $('#bankChapter').addEventListener('change', e => {
    app.bankChapter = e.target.value;
    app.bankPage = 1;
    saveSession();
    renderBankList();
  });
  $('#bankType').addEventListener('change', e => {
    app.bankType = e.target.value;
    app.bankPage = 1;
    saveSession();
    renderBankList();
  });
  renderBankList();
}

function renderBankList(){
  const all = filteredQuestions();
  const pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
  if(app.bankPage > pages) app.bankPage = pages;
  if(app.bankPage < 1) app.bankPage = 1;
  const start = (app.bankPage - 1) * PAGE_SIZE;
  const list = all.slice(start, start + PAGE_SIZE);

  const count = $('#bankCount');
  if(count) count.textContent = all.length
    ? `筛选出 ${all.length} 题${app.bankQuery ? '（关键词：' + app.bankQuery + '）' : ''}`
    : '没有匹配的题目';

  const host = $('#bankList');
  if(!host) return;
  if(!list.length){
    host.innerHTML = `<div class="empty"><div class="empty-ico">⌕</div><h3>没有找到题目</h3><p>换一个关键词，或把章节、题型调回“全部”。</p></div>`;
  }else{
    host.innerHTML = list.map(q => {
      const open = bankOpen.has(q.id);
      const opts = q.options && q.options.length
        ? q.options.map(o => `<div class="bi-opt"><b>${o.key}.</b> ${esc(o.text)}</div>`).join('')
        : `<div class="bi-opt" style="color:var(--faint)">判断题 / 填空题，无选项</div>`;
      return `<div class="bank-item">
        <div class="bi-head">
          <span class="wi-no">No.${String(q.id).padStart(3,'0')}</span>
          <span class="badge b-chapter">${esc(q.chapter)}</span>
          <span class="badge ${TYPE_META[q.type].cls}">${TYPE_META[q.type].label}题</span>
        </div>
        <p class="bi-stem">${esc(q.stem)}</p>
        <button class="bi-toggle" data-toggle="${q.id}">${open ? '收起答案与解析' : '展开答案与解析'} <span>${open ? '▴' : '▾'}</span></button>
        <div class="bi-body ${open ? '' : 'hidden'}">
          ${opts}
          <div class="bi-ans">答案：<b>${esc(answerText(q))}</b></div>
          <div class="bi-explain">${esc(q.explain)}</div>
        </div>
      </div>`;
    }).join('');
  }

  const pager = $('#bankPager');
  if(!pager) return;
  if(!all.length){ pager.innerHTML = ''; return; }
  const nums = [];
  for(let i = 1; i <= pages; i++){
    if(i === 1 || i === pages || Math.abs(i - app.bankPage) <= 2) nums.push(i);
  }
  let html = `<button data-page="${app.bankPage - 1}" ${app.bankPage === 1 ? 'disabled' : ''}>上一页</button>`;
  let last = 0;
  nums.forEach(n => {
    if(last && n - last > 1) html += `<span class="gap">…</span>`;
    html += `<button data-page="${n}" class="${n === app.bankPage ? 'active' : ''}">${n}</button>`;
    last = n;
  });
  html += `<button data-page="${app.bankPage + 1}" ${app.bankPage === pages ? 'disabled' : ''}>下一页</button>`;
  pager.innerHTML = html;
}

/* ===== 顶部交互 ===== */
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if(!b) return;
  app.view = b.dataset.view;
  saveSession();
  syncTabs();
  renderActive();
  window.scrollTo({top:0, behavior:'smooth'});
});

$('#modeTabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]');
  if(!b) return;
  const mode = b.dataset.mode;
  const answered = Object.keys(app.roundResults).length;
  if(answered && !confirm(`本轮已作答 ${answered} 题，切换模式会开始新一轮（练习记录和错题集保留）。继续？`)) return;

  if(mode === 'chapter'){
    app.mode = 'chapter';
    app.chapter = null;
    app.queue = [];
    app.index = 0;
    app.selected = [];
    app.fillValues = [];
    app.roundResults = {};
    app.finished = false;
    saveSession();
    renderActive();
    return;
  }
  if(mode === 'wrong' && !wrongIds().length){
    app.mode = 'wrong';
    app.chapter = null;
    app.queue = [];
    app.finished = false;
    app.roundResults = {};
    saveSession();
    renderActive();
    toast('错题集是空的');
    return;
  }
  startRound(mode, null);
});

$('#chapterPicker').addEventListener('click', e => {
  if(e.target.closest('#toggleChapter')){
    chapterOpen = true;
    syncModeUI();
    return;
  }
  const b = e.target.closest('.chip');
  if(!b) return;
  const answered = Object.keys(app.roundResults).length;
  if(answered && !confirm(`当前章节已作答 ${answered} 题，切换章节会开始新一轮（练习记录和错题集保留）。继续？`)) return;
  chapterOpen = false;
  startRound('chapter', b.dataset.ch);
});

$('#view-wrong').addEventListener('click', e => {
  const top = e.target.closest('[data-top]');
  if(top){
    if(top.dataset.top === 'redoAll'){
      startRound('wrong', null);
    }else if(top.dataset.top === 'clear'){
      if(confirm('确定清空错题集？练习统计不会清空。')){
        wrongBook = {};
        save(K_WRONG, wrongBook);
        wrongOpen.clear();
        updateStats();
        renderWrongView();
        toast('错题集已清空');
      }
    }
    return;
  }
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const id = Number(b.dataset.id);
  const act = b.dataset.act;
  if(act === 'redo') startSingle(id);
  else if(act === 'remove'){
    delete wrongBook[id];
    wrongOpen.delete(id);
    save(K_WRONG, wrongBook);
    updateStats();
    renderWrongView();
    toast('已移出错题集');
  }else if(act === 'explain'){
    if(wrongOpen.has(id)) wrongOpen.delete(id); else wrongOpen.add(id);
    renderWrongView();
  }
});

$('#view-bank').addEventListener('click', e => {
  const tg = e.target.closest('[data-toggle]');
  if(tg){
    const id = Number(tg.dataset.toggle);
    if(bankOpen.has(id)) bankOpen.delete(id); else bankOpen.add(id);
    renderBankList();
    return;
  }
  const pg = e.target.closest('[data-page]');
  if(pg){
    const p = Number(pg.dataset.page);
    if(p >= 1){
      app.bankPage = p;
      saveSession();
      renderBankList();
      window.scrollTo({top:0, behavior:'smooth'});
    }
  }
});

$('#resetBtn').addEventListener('click', () => {
  if(!confirm('将清空练习记录、错题集和当前进度（题库本身不受影响）。确定重置？')) return;
  localStorage.removeItem(K_WRONG);
  localStorage.removeItem(K_HIST);
  localStorage.removeItem(K_SESS);
  location.reload();
});

/* ===== 键盘 ===== */
document.addEventListener('keydown', e => {
  if(app.view !== 'practice' || app.finished) return;
  if(!app.queue.length) return;
  const q = byId.get(app.queue[app.index]);
  if(!q) return;
  const rec = app.roundResults[q.id];

  if(e.target.tagName === 'INPUT'){
    if(e.key === 'Enter' && !rec && canSubmit(q)){ e.preventDefault(); handleSubmit(q); }
    return;
  }
  if(e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return;

  if(rec){
    if(e.key === 'Enter' && !rec.selfPending){ e.preventDefault(); goNext(); }
    return;
  }
  if(e.key === 'Enter'){ if(canSubmit(q)){ e.preventDefault(); handleSubmit(q); } return; }
  if(q.type === 'judge'){
    if(e.key === '1'){ app.selected = ['正确']; saveSession(); renderPractice(); }
    if(e.key === '2'){ app.selected = ['错误']; saveSession(); renderPractice(); }
    return;
  }
  if(q.options){
    const k = e.key.toLowerCase();
    const idx = 'abcd'.indexOf(k);
    const num = Number(e.key);
    let key = null;
    if(idx >= 0) key = 'ABCD'[idx];
    else if(num >= 1 && num <= 4) key = ['A','B','C','D'][num - 1];
    if(key && q.options.some(o => o.key === key)){
      if(q.type === 'multi'){
        const i = app.selected.indexOf(key);
        if(i >= 0) app.selected.splice(i, 1); else app.selected.push(key);
      }else app.selected = [key];
      saveSession();
      renderPractice();
    }
  }
});

/* ===== 启动 ===== */
syncTabs();
renderActive();
</script>
