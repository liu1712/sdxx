<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>深度学习题库 · 逐题练习</title>
<style>
:root{
  --bg:#f3f5fa; --panel:#ffffff; --ink:#18202f; --muted:#6c7588; --faint:#98a1b3;
  --line:#e2e7f1; --line-strong:#d3daea;
  --accent:#3355c8; --accent-2:#5b78e8; --accent-soft:#edf1ff;
  --green:#13795b; --green-soft:#e9f8f1; --green-line:#bfe8d8;
  --red:#c2413b; --red-soft:#fdf1ef; --red-line:#f2cfca;
  --amber:#a5661a; --amber-soft:#fdf6e8; --amber-line:#eeddb8;
  --shadow:0 18px 44px -26px rgba(24,32,47,.32);
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--ink); -webkit-font-smoothing:antialiased;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1100px 560px at 88% -8%, #e7ecff 0%, rgba(231,236,255,0) 62%),
    radial-gradient(900px 520px at -6% 2%, #eaf7f2 0%, rgba(234,247,242,0) 58%),
    #f4f6fa;
  min-height:100vh;
}
button{font-family:inherit}
.wrap{width:100%;max-width:880px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}

/* ===== 顶部 ===== */
.site-head{background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:relative;z-index:5}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0 14px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(140deg,#3557d6,#6c87f0);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.6px;box-shadow:0 10px 22px -10px rgba(53,87,214,.8);flex:0 0 auto}
h1{font-size:20px;margin:0;letter-spacing:.3px;line-height:1.2}
.sub{font-size:12.5px;color:var(--muted);margin:4px 0 0;letter-spacing:.2px}
.head-stats{display:flex;align-items:center;gap:18px;flex:0 0 auto}
.stat{text-align:right}
.stat b{font-size:19px;font-weight:750;letter-spacing:-.2px;font-variant-numeric:tabular-nums;line-height:1.1;display:block}
.stat span{display:block;font-size:10.5px;color:var(--faint);letter-spacing:.8px;margin-top:2px}
.stat+.stat{padding-left:18px;border-left:1px solid var(--line)}
.icon-btn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;padding:7px 12px;font-size:12px;cursor:pointer;transition:.16s}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.tabs{display:flex;gap:6px;padding-bottom:10px}
.tab{border:0;background:transparent;padding:9px 16px;border-radius:11px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px;transition:.18s;line-height:1.2}
.tab:hover{background:#f3f5fa;color:var(--ink)}
.tab.active{background:var(--ink);color:#fff;box-shadow:0 8px 18px -10px rgba(24,32,47,.6)}
.badge-dot{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;line-height:1}
.tab.active .badge-dot{background:#fff;color:var(--red)}

main{padding-top:24px;padding-bottom:80px}

/* ===== 练习模式 ===== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 14px 34px -30px rgba(24,32,47,.4)}
.section-label{font-size:11px;letter-spacing:1.4px;color:var(--faint);font-weight:700;margin-bottom:10px}
.mode-tabs{display:flex;flex-wrap:wrap;gap:8px}
.mode-tabs button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.16s}
.mode-tabs button:hover{border-color:#c8d3ef;color:var(--ink)}
.mode-tabs button.active{background:var(--accent-soft);border-color:#b9c7f5;color:var(--accent)}
.chapter-picker{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px}
.chapter-current{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;font-size:12.5px;color:var(--muted)}
.chapter-current b{color:var(--ink);font-weight:600}
.chapter-current button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:11.5px;color:var(--muted);cursor:pointer}
.chapter-current button:hover{border-color:#c9d3ec;color:var(--ink)}
.chapter-hint{color:var(--faint);font-size:13px;padding:26px 4px;text-align:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-size:12.5px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:.15s}
.chip:hover{border-color:#c8d3ef;color:var(--ink);background:#fbfcff}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.chip em{font-style:normal;font-size:11px;opacity:.7}

.roundbar{margin:18px 2px 12px}
.roundinfo{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px;gap:12px}
.roundinfo b{color:var(--ink);font-weight:600}
.progress{height:5px;background:#e4e9f4;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#7b93f2);border-radius:99px;transition:width .3s}

/* ===== 题目卡 ===== */
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px 22px;box-shadow:var(--shadow)}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.badge{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:6px;letter-spacing:.2px;line-height:1.4}
.b-chapter{background:#f1f4fa;color:#5b6880}
.b-single{background:#eef2ff;color:#3454c4}
.b-multi{background:#f3edff;color:#6b45b5}
.b-judge{background:#fff5e6;color:#9a6413}
.b-fill{background:#e9f8f5;color:#167662}
.qno{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.stem{font-size:18px;line-height:1.85;color:var(--ink);font-weight:500;letter-spacing:.1px;text-wrap:pretty}
.blank-slot{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;align-items:center;justify-content:center;margin:0 3px;vertical-align:1px;line-height:1}
.fill-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:18px}
.fill-field{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#f8faff;border-radius:10px;padding:9px 11px;transition:.15s}
.fill-field:focus-within{border-color:#b9c6ec;background:#fff;box-shadow:0 0 0 3px #eef2ff}
.fill-label{font-size:10.5px;color:var(--faint);letter-spacing:.5px;white-space:nowrap}
.fill-input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:inherit;font-size:14.5px;font-weight:600;color:var(--accent);height:26px;padding:0}
.fill-input::placeholder{color:#b3bccc;font-weight:400}
.fill-input:disabled{cursor:default;opacity:1}
.fill-field.ok{border-color:var(--green-line);background:var(--green-soft)}
.fill-field.ok .fill-input{color:var(--green)}
.fill-field.bad{border-color:var(--red-line);background:var(--red-soft)}
.fill-field.bad .fill-input{color:var(--red)}

.options{display:grid;gap:10px;margin-top:22px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:15px;line-height:1.6;color:#303a4d;cursor:pointer;transition:border-color .15s,background .15s,transform .15s,box-shadow .15s}
.opt:hover{border-color:#b9c6ec;background:#fafbff}
.opt:active{transform:scale(.996)}
.opt-key{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:#f1f4fa;color:#64708a;display:grid;place-items:center;font-size:13.5px;font-weight:700}
.opt-txt{flex:1;min-width:0}
.opt-mark{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.opt.is-selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.is-selected .opt-key{background:var(--accent);color:#fff}
.opt.is-correct{border-color:var(--green-line);background:var(--green-soft);box-shadow:inset 0 0 0 1px #7fcfb2}
.opt.is-correct .opt-key{background:var(--green);color:#fff}
.opt.is-correct .opt-mark{color:var(--green)}
.opt.is-wrong{border-color:var(--red-line);background:var(--red-soft);box-shadow:inset 0 0 0 1px #e8a7a0}
.opt.is-wrong .opt-key{background:var(--red);color:#fff}
.opt.is-wrong .opt-mark{color:var(--red)}
.options.locked .opt{cursor:default}
.options.locked .opt:hover{border-color:var(--line);background:#fff}
.options.locked .opt.is-correct:hover{background:var(--green-soft);border-color:var(--green-line)}
.options.locked .opt.is-wrong:hover{background:var(--red-soft);border-color:var(--red-line)}

.actions{display:flex;align-items:center;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid #eff2f8;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:.16s;letter-spacing:.2px;line-height:1.2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px -10px rgba(51,85,200,.75)}
.btn.primary:hover:not(:disabled){background:#2b49b8}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--muted)}
.btn.ghost:hover:not(:disabled){border-color:#c9d3ec;color:var(--ink)}
.btn.ok{background:var(--green);color:#fff;box-shadow:0 8px 18px -10px rgba(19,121,91,.6)}
.btn.danger{background:#fff;border:1px solid var(--red-line);color:var(--red)}
.btn.danger:hover{background:var(--red-soft)}
.hint{font-size:12px;color:var(--faint);margin-left:auto}
.spacer{flex:1}

/* ===== 判分结果 ===== */
.result{margin-top:20px;border:1px solid;border-radius:14px;padding:18px 20px;animation:rise .22s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.result.ok{background:var(--green-soft);border-color:var(--green-line)}
.result.bad{background:var(--red-soft);border-color:var(--red-line)}
.result.manual{background:var(--amber-soft);border-color:var(--amber-line)}
.result-head{display:flex;gap:12px;align-items:flex-start}
.r-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:800;flex:0 0 auto;line-height:1}
.result.ok .r-icon{background:#d3f3e4;color:var(--green)}
.result.bad .r-icon{background:#fbe0dc;color:var(--red)}
.result.manual .r-icon{background:#f7e9c9;color:var(--amber)}
.result-head h3{margin:3px 0 2px;font-size:16px;line-height:1.4}
.result-head p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
.ans-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.ans-pill{font-size:12.5px;padding:6px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);font-variant-numeric:tabular-nums;line-height:1.5}
.ans-pill b{font-weight:700}
.ans-pill.ok{border-color:var(--green-line);color:var(--green)}
.ans-pill.bad{border-color:var(--red-line);color:var(--red)}
.explain{margin-top:14px;background:rgba(255,255,255,.68);border-radius:10px;padding:12px 14px;border-left:3px solid rgba(51,85,200,.22)}
.ex-label{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--faint);display:block;margin-bottom:5px}
.explain p{margin:0;font-size:13.8px;line-height:1.8;color:#3d475c}

/* ===== 本轮成绩 ===== */
.summary{background:#fff;border:1px solid var(--line);border-radius:20px;padding:40px 28px;text-align:center;box-shadow:var(--shadow)}
.summary h2{margin:0 0 6px;font-size:23px;letter-spacing:.2px}
.summary .lead{color:var(--muted);font-size:13px;margin:0 0 26px;line-height:1.7}
.ring{--p:0;width:148px;height:148px;border-radius:50%;margin:0 auto 26px;background:conic-gradient(var(--accent) calc(var(--p)*1%),#e7ecf7 0);padding:9px}
.ring-in{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-content:center;gap:3px}
.ring-in b{font-size:32px;line-height:1;letter-spacing:-1px}
.ring-in span{font-size:11px;color:var(--faint);letter-spacing:1px}
.sum-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto 26px}
.sum-stat{background:#f7f9fd;border:1px solid #e9edf6;border-radius:12px;padding:13px 8px}
.sum-stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.sum-stat span{font-size:11px;color:var(--muted)}
.sum-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ===== 空状态 ===== */
.empty{background:#fff;border:1px dashed #d8dfec;border-radius:18px;padding:52px 24px;text-align:center}
.empty-ico{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 16px;font-size:24px;font-weight:700}
.empty h3{margin:0 0 6px;font-size:18px}
.empty p{margin:0 auto 20px;color:var(--muted);font-size:13px;line-height:1.7;max-width:400px}
.empty .btn{display:inline-block}

/* ===== 视图头 / 错题集 ===== */
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.view-head h2{margin:0;font-size:20px}
.view-head p{margin:5px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}
.view-actions{display:flex;gap:8px;flex-wrap:wrap}
.wrong-list{display:grid;gap:12px}
.wrong-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:.16s}
.wrong-item:hover{border-color:#d3dbec}
.wi-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.wi-no{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.wi-count{margin-left:auto;font-size:11px;color:var(--red);background:var(--red-soft);border-radius:99px;padding:3px 8px}
.wi-stem{font-size:14.5px;line-height:1.7;margin:0;color:#303a4d}
.wi-ans{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}
.wi-ans b{font-weight:600}
.wi-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:5px 10px;font-size:11.5px;cursor:pointer;transition:.15s}
.mini:hover{color:var(--ink);border-color:#c9d3ec}
.mini.danger{color:var(--red);border-color:var(--red-line)}
.mini.danger:hover{background:var(--red-soft)}
.wi-explain{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;line-height:1.8;color:#465066}

/* ===== 题库总览 ===== */
.bank-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fbfcfe;transition:.15s}
.search:focus-within{border-color:#b9c6ec;background:#fff;box-shadow:0 0 0 3px #eef2ff}
.search span{color:var(--faint);font-size:14px;line-height:1}
.search input{border:0;outline:0;background:transparent;width:100%;font:inherit;font-size:13.5px;color:var(--ink)}
.search input::placeholder{color:var(--faint)}
select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;font:inherit;font-size:12.5px;color:var(--muted);outline:none;cursor:pointer}
select:focus{border-color:#b9c6ec}
.bank-count{font-size:12px;color:var(--faint);margin:14px 2px 10px}
.bank-list{display:grid;gap:10px}
.bank-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.bi-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bi-stem{font-size:14px;line-height:1.7;margin:8px 0 0;color:#303a4d}
.bi-toggle{margin-top:10px;border:0;background:transparent;color:var(--accent);font-size:12px;font-weight:600;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.bi-toggle:hover{text-decoration:underline}
.bi-body{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.bi-opt{font-size:13px;color:#49536a;line-height:1.85}
.bi-opt b{color:#6c7588}
.bi-ans{font-size:12.5px;margin:9px 0;color:var(--muted)}
.bi-ans b{color:var(--green)}
.bi-explain{font-size:12.8px;line-height:1.8;color:#576176;background:#f8fafd;border-radius:8px;padding:10px 12px}
.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:20px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:11.5px;cursor:pointer;color:var(--muted)}
.pager button:hover:not(:disabled){border-color:#c9d3ec;color:var(--ink)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pager .gap{padding:0 4px;color:var(--faint)}

/* ===== 提示 ===== */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#1d2534;color:#fff;font-size:12.5px;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 12px 30px -10px rgba(0,0,0,.55);max-width:calc(100vw - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

footer{text-align:center;font-size:11px;color:var(--faint);padding:26px 0 10px;letter-spacing:.4px}

@media(max-width:720px){
  .wrap{padding:0 14px}
  .head-row{padding:14px 0 10px;flex-wrap:wrap;gap:12px}
  .logo{width:38px;height:38px;font-size:13px;border-radius:11px}
  h1{font-size:18px}
  .sub{display:none}
  .head-stats{gap:12px}
  .stat b{font-size:16px}
  .stat+.stat{padding-left:12px}
  .stat span{font-size:9.5px;letter-spacing:.5px}
  .icon-btn{padding:6px 9px;font-size:11px}
  .tabs{overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 13px;font-size:13px;white-space:nowrap}
  .panel{padding:14px}
  .mode-tabs{gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .mode-tabs::-webkit-scrollbar{display:none}
  .mode-tabs button{padding:8px 11px;font-size:12.5px;white-space:nowrap}
  .qcard{padding:20px 17px 17px;border-radius:16px}
  .stem{font-size:16.5px}
  .opt{padding:12px 12px;font-size:14px;gap:11px}
  .opt-key{width:27px;height:27px;border-radius:8px;font-size:12.5px}
  .actions{gap:8px}
  .btn{padding:10px 16px;font-size:13px}
  .hint{order:3;width:100%;margin-left:0}
  .summary{padding:30px 18px}
  .ring{width:128px;height:128px}
  .bank-panel{padding:11px}
  .search{min-width:100%}
  .view-head{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>

<header class="site-head">
  <div class="wrap head-row">
    <div class="brand">
      <div class="logo">DL</div>
      <div>
        <h1>深度学习题库</h1>
        <p class="sub">568 题 · 逐题作答 · 错题自动收录</p>
      </div>
    </div>
    <div class="head-stats">
      <div class="stat"><b id="statDone">0</b><span>已练</span></div>
      <div class="stat"><b id="statRate">—</b><span>掌握率</span></div>
      <div class="stat"><b id="statWrong">0</b><span>错题</span></div>
      <button class="icon-btn" id="resetBtn" title="清空练习记录与错题集">重置</button>
    </div>

<script>
const QUESTIONS = [{"id":1,"chapter":"线性回归","type":"single","stem":"线性回归模型 y = w·x + b 中，参数是( )","options":[{"key":"A","text":"x"},{"key":"B","text":"y"},{"key":"C","text":"w 和 b"},{"key":"D","text":"样本数量"}],"answer":["C"],"answerText":"C","explain":"线性回归的模型参数是权重 w 和偏置 b。x 是输入特征，y 是标签，都不是模型参数。"},{"id":2,"chapter":"线性回归","type":"single","stem":"线性回归的损失函数通常采用( )","options":[{"key":"A","text":"交叉熵损失"},{"key":"B","text":"平方误差损失"},{"key":"C","text":"Hinge 损失"},{"key":"D","text":"绝对值损失"}],"answer":["B"],"answerText":"B","explain":"线性回归的输出是实数，常用平方误差损失。交叉熵用于分类，Hinge 用于 SVM。"},{"id":3,"chapter":"线性回归","type":"single","stem":"平方误差损失对异常值敏感，原因是( )","options":[{"key":"A","text":"误差被平方放大"},{"key":"B","text":"误差被开方缩小"},{"key":"C","text":"误差被归一化"},{"key":"D","text":"误差被取对数"}],"answer":["A"],"answerText":"A","explain":"平方误差对误差取平方，远离直线的异常点误差很大，平方后被进一步放大，把直线往异常点方向拉。绝对值损失对异常值更鲁棒。"},{"id":4,"chapter":"线性回归","type":"single","stem":"在线性回归中，最小化平方误差等价于( )","options":[{"key":"A","text":"最小化交叉熵"},{"key":"B","text":"最大化对数似然(在高斯噪声假设下)"},{"key":"C","text":"最大化后验概率"},{"key":"D","text":"最小化 KL 散度"}],"answer":["B"],"answerText":"B","explain":"假设 y = w·x + b + ε，ε 服从高斯分布 N(0, σ²)，则最大化似然等价于最小化平方误差。损失函数的选择本质上是对数据噪声分布做了假设。"},{"id":5,"chapter":"线性回归","type":"single","stem":"随机梯度下降(SGD)与全批量梯度下降的主要区别是( )","options":[{"key":"A","text":"SGD 使用全部样本计算梯度"},{"key":"B","text":"SGD 使用单个样本估计梯度"},{"key":"C","text":"SGD 不需要学习率"},{"key":"D","text":"SGD 只能用于分类问题"}],"answer":["B"],"answerText":"B","explain":"SGD 用单个样本的梯度作为期望梯度的无偏估计。全批量梯度下降每一步遍历所有样本，计算代价高。小批量 SGD 介于两者之间。"},{"id":6,"chapter":"线性回归","type":"single","stem":"小批量随机梯度下降中，批量大小设为 1 时，等价于( )","options":[{"key":"A","text":"全批量梯度下降"},{"key":"B","text":"随机梯度下降"},{"key":"C","text":"牛顿法"},{"key":"D","text":"共轭梯度法"}],"answer":["B"],"answerText":"B","explain":"批量大小为 1 就是每次用一个样本更新参数，即 SGD。批量大小为 N(样本总数)就是全批量梯度下降。中间的小批量是折中。"},{"id":7,"chapter":"线性回归","type":"single","stem":"线性回归的神经网络图中，输出层通常( )","options":[{"key":"A","text":"加 softmax"},{"key":"B","text":"加 ReLU"},{"key":"C","text":"不加激活函数"},{"key":"D","text":"加 sigmoid"}],"answer":["C"],"answerText":"C","explain":"线性回归输出的是实数，不需要把输出限制在某个范围。softmax 用于多分类，sigmoid 用于二分类，ReLU 用于隐藏层。"},{"id":8,"chapter":"线性回归","type":"single","stem":"如果训练损失持续下降，但测试损失先下降后上升，说明( )","options":[{"key":"A","text":"欠拟合"},{"key":"B","text":"过拟合"},{"key":"C","text":"梯度消失"},{"key":"D","text":"数据泄漏"}],"answer":["B"],"answerText":"B","explain":"训练损失下降、测试损失上升，是过拟合的典型表现。模型把训练集的噪声也学进去了。对应手段包括早停、正则化、增加数据。"},{"id":9,"chapter":"线性回归","type":"single","stem":"下列关于验证集的说法，正确的是( )","options":[{"key":"A","text":"验证集用于拟合模型参数"},{"key":"B","text":"验证集用于选择超参数"},{"key":"C","text":"验证集就是测试集"},{"key":"D","text":"验证集不能用来早停"}],"answer":["B"],"answerText":"B","explain":"训练集拟合参数，验证集选择超参数和早停，测试集做最终评估。如果测试集参与调参，它就泄漏成了验证集。"},{"id":10,"chapter":"线性回归","type":"single","stem":"关于小批量随机梯度下降的批量大小，下列说法正确的是( )","options":[{"key":"A","text":"批量越大，梯度方差越大"},{"key":"B","text":"批量越大，每一步计算量越小"},{"key":"C","text":"批量越大，梯度方差越小"},{"key":"D","text":"批量大小不影响训练"}],"answer":["C"],"answerText":"C","explain":"批量越大，用更多样本估计梯度，方差越小。但每一步计算量越大，还要考虑 GPU 显存限制。批量大小是偏差-方差-计算效率-硬件的权衡。"},{"id":11,"chapter":"线性回归","type":"single","stem":"线性回归中，学习率的作用是( )","options":[{"key":"A","text":"决定模型的参数量"},{"key":"B","text":"决定参数更新的步长"},{"key":"C","text":"决定损失函数的形状"},{"key":"D","text":"决定数据集的大小"}],"answer":["B"],"answerText":"B","explain":"学习率决定参数更新的步长。太小收敛慢，太大可能震荡或发散。它是需要调的超参数。"},{"id":12,"chapter":"线性回归","type":"multi","stem":"线性回归的基本元素包括( )","options":[{"key":"A","text":"训练集"},{"key":"B","text":"测试集"},{"key":"C","text":"验证集"},{"key":"D","text":"标签"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"线性回归的基本元素包括训练集、测试集、验证集、标签、特征。四个选项都属于基本元素。"},{"id":13,"chapter":"线性回归","type":"multi","stem":"关于平方误差损失，下列说法正确的是( )","options":[{"key":"A","text":"对异常值敏感"},{"key":"B","text":"在高斯噪声假设下等价于极大似然"},{"key":"C","text":"对异常值鲁棒"},{"key":"D","text":"是线性回归常用的损失函数"}],"answer":["A","B","D"],"answerText":"ABD","explain":"平方误差对异常值敏感，因为误差被平方放大。在高斯噪声假设下，最小化平方误差等价于最大化似然。它是线性回归常用损失。C 错误，绝对值损失才更鲁棒。"},{"id":14,"chapter":"线性回归","type":"multi","stem":"关于小批量随机梯度下降的批量大小，下列说法正确的是( )","options":[{"key":"A","text":"批量大小为 1 时等价于 SGD"},{"key":"B","text":"批量大小为 N 时等价于全批量梯度下降"},{"key":"C","text":"批量大小越大，梯度方差越小"},{"key":"D","text":"批量大小越大，计算效率越低"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"批量大小为 1 是 SGD，为 N 是全批量。批量越大，梯度方差越小，但每一步计算量越大，计算效率越低。还要考虑 GPU 显存限制。"},{"id":15,"chapter":"线性回归","type":"multi","stem":"关于线性回归的神经网络图，下列说法正确的是( )","options":[{"key":"A","text":"输入层接收特征"},{"key":"B","text":"输出层输出预测值"},{"key":"C","text":"输出层通常不加激活函数"},{"key":"D","text":"它等价于一个全连接层"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"线性回归的神经网络图就是输入层加一个全连接层。输入层接收特征，输出层输出预测值，输出层不加激活函数，整体等价于一个全连接层。"},{"id":16,"chapter":"线性回归","type":"multi","stem":"关于验证集和测试集，下列说法正确的是( )","options":[{"key":"A","text":"验证集用于选择超参数"},{"key":"B","text":"测试集用于最终泛化评估"},{"key":"C","text":"测试集可以用于调参"},{"key":"D","text":"验证集可以用于早停"}],"answer":["A","B","D"],"answerText":"ABD","explain":"验证集用于选超参数和早停，测试集用于最终评估。C 错误，测试集一旦用于调参，就泄漏成了验证集，泛化评估失效。"},{"id":17,"chapter":"线性回归","type":"multi","stem":"下列关于学习率的说法，正确的是( )","options":[{"key":"A","text":"学习率太小，收敛慢"},{"key":"B","text":"学习率太大，可能震荡或发散"},{"key":"C","text":"学习率是需要调的超参数"},{"key":"D","text":"学习率越大越好"}],"answer":["A","B","C"],"answerText":"ABC","explain":"学习率太小收敛慢，太大可能震荡甚至发散。它是需要调的超参数。D 错误，学习率不是越大越好。"},{"id":18,"chapter":"线性回归","type":"multi","stem":"线性回归中，如果训练误差很低但测试误差很高，可能的原因包括( )","options":[{"key":"A","text":"过拟合"},{"key":"B","text":"模型容量过大"},{"key":"C","text":"训练数据太少"},{"key":"D","text":"欠拟合"}],"answer":["A","B","C"],"answerText":"ABC","explain":"训练误差低、测试误差高是过拟合。原因可能是模型容量过大、训练数据太少。D 错误，欠拟合是训练误差和测试误差都高。"},{"id":19,"chapter":"线性回归","type":"multi","stem":"关于线性回归和 softmax 回归的区别，下列说法正确的是( )","options":[{"key":"A","text":"线性回归输出实数，softmax 回归输出概率分布"},{"key":"B","text":"线性回归用平方误差，softmax 回归用交叉熵"},{"key":"C","text":"线性回归用于回归，softmax 回归用于分类"},{"key":"D","text":"两者完全相同"}],"answer":["A","B","C"],"answerText":"ABC","explain":"线性回归输出实数，用平方误差，用于回归。softmax 回归输出概率分布，用交叉熵，用于分类。D 错误，两者是不同范式。"},{"id":20,"chapter":"线性回归","type":"multi","stem":"关于线性回归的训练流程，下列说法正确的是( )","options":[{"key":"A","text":"包括数据加载与分批"},{"key":"B","text":"包括前向传播"},{"key":"C","text":"包括损失计算"},{"key":"D","text":"包括反向传播和参数更新"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"线性回归的训练流程包括数据加载与分批、前向传播、损失计算、反向传播、参数更新、日志记录。四个选项都属于训练流程。"},{"id":21,"chapter":"线性回归","type":"judge","stem":"线性回归的模型参数是输入特征 x 和标签 y。","options":[],"answer":"错误","answerText":"错误","explain":"线性回归的模型参数是权重 w 和偏置 b。x 是输入特征，y 是标签，都不是模型参数。"},{"id":22,"chapter":"线性回归","type":"judge","stem":"平方误差损失对异常值鲁棒。","options":[],"answer":"错误","answerText":"错误","explain":"平方误差对异常值敏感，因为误差被平方放大。绝对值损失对异常值更鲁棒。"},{"id":23,"chapter":"线性回归","type":"judge","stem":"在高斯噪声假设下，最小化平方误差等价于最大化似然。","options":[],"answer":"正确","answerText":"正确","explain":"假设 y = w·x + b + ε，ε 服从高斯分布 N(0, σ²)，则最大化似然等价于最小化平方误差。"},{"id":24,"chapter":"线性回归","type":"judge","stem":"随机梯度下降用全部样本计算梯度。","options":[],"answer":"错误","answerText":"错误","explain":"随机梯度下降用单个样本估计梯度。全批量梯度下降才用全部样本。"},{"id":25,"chapter":"线性回归","type":"judge","stem":"小批量随机梯度下降中，批量大小为 1 时等价于 SGD。","options":[],"answer":"正确","answerText":"正确","explain":"批量大小为 1 就是每次用一个样本更新参数，即 SGD。批量大小为 N 是全批量梯度下降。"},{"id":26,"chapter":"线性回归","type":"judge","stem":"线性回归的神经网络图等价于一个全连接层。","options":[],"answer":"正确","answerText":"正确","explain":"线性回归的神经网络图就是输入层加一个全连接层，输出层不加激活函数，整体等价于一个全连接层。"},{"id":27,"chapter":"线性回归","type":"judge","stem":"验证集用于拟合模型参数。","options":[],"answer":"错误","answerText":"错误","explain":"训练集用于拟合参数，验证集用于选择超参数和早停，测试集用于最终泛化评估。"},{"id":28,"chapter":"线性回归","type":"judge","stem":"测试集可以用于调参。","options":[],"answer":"错误","answerText":"错误","explain":"测试集不能用于调参。一旦用于调参，它就泄漏成了验证集，泛化评估失效。"},{"id":29,"chapter":"线性回归","type":"judge","stem":"学习率越大，模型收敛越快，所以学习率越大越好。","options":[],"answer":"错误","answerText":"错误","explain":"学习率太大可能导致震荡甚至发散，不是越大越好。学习率需要调，太小收敛慢，太大不稳定。"},{"id":30,"chapter":"线性回归","type":"judge","stem":"如果训练损失持续下降，但测试损失先下降后上升，说明模型过拟合。","options":[],"answer":"正确","answerText":"正确","explain":"训练损失下降、测试损失上升，是过拟合的典型表现。对应手段包括早停、正则化、增加数据。"},{"id":31,"chapter":"线性回归","type":"judge","stem":"训练损失越低，模型一定越好。","options":[],"answer":"错误","answerText":"错误","explain":"训练损失低不代表模型好。如果测试损失高，说明过拟合。评估模型要同时看训练损失和测试损失。"},{"id":32,"chapter":"线性回归","type":"judge","stem":"线性回归的输出层通常加 softmax 激活函数。","options":[],"answer":"错误","answerText":"错误","explain":"线性回归输出的是实数，不需要加 softmax。softmax 用于多分类，sigmoid 用于二分类，ReLU 用于隐藏层。"},{"id":33,"chapter":"线性回归","type":"judge","stem":"小批量随机梯度下降的批量大小是一个超参数。","options":[],"answer":"正确","answerText":"正确","explain":"批量大小是需要调的超参数。批量越大，梯度方差越小，但每一步计算量越大，还要考虑 GPU 显存限制。"},{"id":34,"chapter":"线性回归","type":"judge","stem":"线性回归的训练流程中，反向传播的作用是计算梯度。","options":[],"answer":"正确","answerText":"正确","explain":"反向传播的作用是计算损失对参数的梯度，然后用优化算法更新参数。"},{"id":35,"chapter":"线性回归","type":"judge","stem":"验证集和测试集是同一个东西。","options":[],"answer":"错误","answerText":"错误","explain":"验证集用于选择超参数和早停，测试集用于最终泛化评估。两者作用不同，不能混用。"},{"id":36,"chapter":"softmax 回归","type":"single","stem":"softmax 回归主要用于解决( )","options":[{"key":"A","text":"回归问题"},{"key":"B","text":"二分类问题"},{"key":"C","text":"多分类问题"},{"key":"D","text":"聚类问题"}],"answer":["C"],"answerText":"C","explain":"softmax 回归用于多分类问题，输出每个类别的概率分布。线性回归用于回归，logistic 回归用于二分类。"},{"id":37,"chapter":"softmax 回归","type":"single","stem":"softmax 运算的输出满足( )","options":[{"key":"A","text":"每个元素在 0 到 1 之间，且总和为 1"},{"key":"B","text":"每个元素都是整数"},{"key":"C","text":"每个元素都大于 1"},{"key":"D","text":"每个元素之和为 0"}],"answer":["A"],"answerText":"A","explain":"softmax 把实数分数映射为概率分布，每个元素在 0 到 1 之间，所有元素之和为 1。"},{"id":38,"chapter":"softmax 回归","type":"single","stem":"softmax 回归中，真实标签通常用( )表示。","options":[{"key":"A","text":"实数"},{"key":"B","text":"独热编码"},{"key":"C","text":"负数"},{"key":"D","text":"零向量"}],"answer":["B"],"answerText":"B","explain":"softmax 回归的真实标签通常用独热编码表示。比如 3 分类，类别 2 对应 (0, 1, 0)。"},{"id":39,"chapter":"softmax 回归","type":"single","stem":"softmax 回归常用的损失函数是( )","options":[{"key":"A","text":"平方误差损失"},{"key":"B","text":"交叉熵损失"},{"key":"C","text":"Hinge 损失"},{"key":"D","text":"绝对值损失"}],"answer":["B"],"answerText":"B","explain":"softmax 回归用交叉熵损失。交叉熵衡量模型预测分布和真实分布之间的差异。平方误差用于回归，Hinge 用于 SVM。"},{"id":40,"chapter":"softmax 回归","type":"single","stem":"交叉熵损失在独热编码下可以简化为( )","options":[{"key":"A","text":"-log(预测概率[真实类别])"},{"key":"B","text":"log(预测概率[真实类别])"},{"key":"C","text":"预测概率[真实类别]"},{"key":"D","text":"1 - 预测概率[真实类别]"}],"answer":["A"],"answerText":"A","explain":"当真实分布是独热编码时，交叉熵简化为 -log(预测概率[真实类别])。模型给真实类别分配的概率越高，损失越小。"},{"id":41,"chapter":"softmax 回归","type":"single","stem":"softmax 回归的输出层通常( )","options":[{"key":"A","text":"加 ReLU"},{"key":"B","text":"加 sigmoid"},{"key":"C","text":"加 softmax"},{"key":"D","text":"不加激活函数"}],"answer":["C"],"answerText":"C","explain":"softmax 回归的输出层加 softmax，把实数分数变成概率分布。ReLU 用于隐藏层，sigmoid 用于二分类。"},{"id":42,"chapter":"softmax 回归","type":"single","stem":"softmax 运算具有平移不变性，意思是( )","options":[{"key":"A","text":"所有分数加同一个常数，输出不变"},{"key":"B","text":"所有分数乘以同一个常数，输出不变"},{"key":"C","text":"所有分数取平方，输出不变"},{"key":"D","text":"所有分数取对数，输出不变"}],"answer":["A"],"answerText":"A","explain":"softmax 具有平移不变性:所有分数加同一个常数，输出不变。这个性质用于数值稳定性，减去最大值避免 exp 溢出。"},{"id":43,"chapter":"softmax 回归","type":"single","stem":"精度(accuracy)的计算方式是( )","options":[{"key":"A","text":"预测正确的样本数 / 总样本数"},{"key":"B","text":"预测错误的样本数 / 总样本数"},{"key":"C","text":"损失函数的倒数"},{"key":"D","text":"预测概率的平均值"}],"answer":["A"],"answerText":"A","explain":"精度是预测正确的样本数除以总样本数。它在类别不平衡时可能骗人，需要结合混淆矩阵、召回率、F1 一起看。"},{"id":44,"chapter":"softmax 回归","type":"single","stem":"如果数据集中 99% 是负类，1% 是正类，模型全部预测负类，精度是( )","options":[{"key":"A","text":"1%"},{"key":"B","text":"50%"},{"key":"C","text":"99%"},{"key":"D","text":"100%"}],"answer":["C"],"answerText":"C","explain":"全部预测负类，99% 的负类都预测正确，精度是 99%。但这个模型毫无用处，因为它完全忽略了正类。这就是精度在类别不平衡时的陷阱。"},{"id":45,"chapter":"softmax 回归","type":"single","stem":"关于 softmax 和 sigmoid 的关系，下列说法正确的是( )","options":[{"key":"A","text":"两者完全相同"},{"key":"B","text":"二分类时 softmax 退化为 sigmoid"},{"key":"C","text":"softmax 用于二分类，sigmoid 用于多分类"},{"key":"D","text":"两者都没有归一化"}],"answer":["B"],"answerText":"B","explain":"当类别数为 2 时，softmax 退化为 sigmoid。所以 softmax 回归是 logistic 回归在多分类上的推广。"},{"id":46,"chapter":"softmax 回归","type":"single","stem":"softmax 回归中，输出层输出的是( )","options":[{"key":"A","text":"类别编号"},{"key":"B","text":"概率分布"},{"key":"C","text":"实数预测值"},{"key":"D","text":"二值标签"}],"answer":["B"],"answerText":"B","explain":"softmax 回归的输出层输出概率分布，每个元素表示属于该类别的概率。类别编号是预测结果，不是输出层的直接输出。"},{"id":47,"chapter":"softmax 回归","type":"multi","stem":"关于 softmax 运算，下列说法正确的是( )","options":[{"key":"A","text":"输出每个元素在 0 到 1 之间"},{"key":"B","text":"输出所有元素之和为 1"},{"key":"C","text":"具有平移不变性"},{"key":"D","text":"输出元素可能为负数"}],"answer":["A","B","C"],"answerText":"ABC","explain":"softmax 输出每个元素在 0 到 1 之间，总和为 1，具有平移不变性。D 错误，softmax 输出非负。"},{"id":48,"chapter":"softmax 回归","type":"multi","stem":"关于独热编码，下列说法正确的是( )","options":[{"key":"A","text":"把类别映射为概率分布上的一个顶点"},{"key":"B","text":"3 分类中类别 2 对应 (0, 1, 0)"},{"key":"C","text":"是分类问题中标签的常见表示方式"},{"key":"D","text":"必须手动转换为独热编码才能用 CrossEntropyLoss"}],"answer":["A","B","C"],"answerText":"ABC","explain":"独热编码把类别映射为概率单纯形上的顶点。3 分类中类别 2 对应 (0, 1, 0)。它是分类问题中标签的常见表示。D 错误，PyTorch 的 CrossEntropyLoss 直接接收类别索引，不需要手动转独热编码。"},{"id":49,"chapter":"softmax 回归","type":"multi","stem":"关于交叉熵损失，下列说法正确的是( )","options":[{"key":"A","text":"衡量两个概率分布之间的差异"},{"key":"B","text":"在独热编码下简化为 -log(预测概率[真实类别])"},{"key":"C","text":"最小化交叉熵等价于最大化对数似然"},{"key":"D","text":"交叉熵只能用于二分类"}],"answer":["A","B","C"],"answerText":"ABC","explain":"交叉熵衡量两个概率分布的差异。独热编码下简化为 -log(预测概率[真实类别])。最小化交叉熵等价于最大化对数似然。D 错误，交叉熵可以用于多分类。"},{"id":50,"chapter":"softmax 回归","type":"multi","stem":"关于 softmax 回归的网络架构，下列说法正确的是( )","options":[{"key":"A","text":"输入层接收图像像素"},{"key":"B","text":"全连接层把输入映射到类别分数"},{"key":"C","text":"softmax 层把分数变成概率"},{"key":"D","text":"没有隐藏层"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"softmax 回归的网络架构是输入层、全连接层、softmax 层。没有隐藏层，所以它是一个单层神经网络。"},{"id":51,"chapter":"softmax 回归","type":"multi","stem":"关于精度(accuracy)，下列说法正确的是( )","options":[{"key":"A","text":"是预测正确的样本数除以总样本数"},{"key":"B","text":"在类别不平衡时可能骗人"},{"key":"C","text":"应该结合混淆矩阵、召回率、F1 一起看"},{"key":"D","text":"精度高一定代表模型好"}],"answer":["A","B","C"],"answerText":"ABC","explain":"精度是预测正确的样本数除以总样本数。在类别不平衡时可能骗人，应该结合混淆矩阵、召回率、F1 一起看。D 错误，精度高不代表模型好。"},{"id":52,"chapter":"softmax 回归","type":"multi","stem":"关于 softmax 回归和线性回归的区别，下列说法正确的是( )","options":[{"key":"A","text":"线性回归输出实数，softmax 回归输出概率分布"},{"key":"B","text":"线性回归用平方误差，softmax 回归用交叉熵"},{"key":"C","text":"线性回归用于回归，softmax 回归用于分类"},{"key":"D","text":"两者完全相同"}],"answer":["A","B","C"],"answerText":"ABC","explain":"线性回归输出实数，用平方误差，用于回归。softmax 回归输出概率分布，用交叉熵，用于分类。D 错误，两者是不同范式。"},{"id":53,"chapter":"softmax 回归","type":"multi","stem":"关于 softmax 的数值稳定性，下列说法正确的是( )","options":[{"key":"A","text":"exp(1000) 会溢出"},{"key":"B","text":"减去最大值可以避免溢出"},{"key":"C","text":"softmax 具有平移不变性"},{"key":"D","text":"简洁实现的 CrossEntropyLoss 内部已经做了处理"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"exp(1000) 会溢出。减去最大值可以避免溢出，因为 softmax 具有平移不变性。简洁实现的 CrossEntropyLoss 内部已经做了处理。"},{"id":54,"chapter":"softmax 回归","type":"multi","stem":"关于 softmax 回归的训练流程，下列说法正确的是( )","options":[{"key":"A","text":"包括数据加载与分批"},{"key":"B","text":"包括前向传播"},{"key":"C","text":"包括损失计算"},{"key":"D","text":"包括反向传播和参数更新"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"softmax 回归的训练流程包括数据加载与分批、前向传播、损失计算、反向传播、参数更新、日志记录。四个选项都属于训练流程。"},{"id":55,"chapter":"softmax 回归","type":"multi","stem":"关于 softmax 回归的评估指标，下列说法正确的是( )","options":[{"key":"A","text":"训练损失反映模型在训练集上的拟合程度"},{"key":"B","text":"测试精度反映模型的泛化能力"},{"key":"C","text":"训练损失越低，模型一定越好"},{"key":"D","text":"训练损失和测试损失差距大，可能过拟合"}],"answer":["A","B","D"],"answerText":"ABD","explain":"训练损失反映拟合程度，测试精度反映泛化能力。训练损失和测试损失差距大，可能过拟合。C 错误，训练损失低不代表模型好，可能过拟合。"},{"id":56,"chapter":"softmax 回归","type":"multi","stem":"关于 softmax 回归的输出，下列说法正确的是( )","options":[{"key":"A","text":"每个元素表示属于该类别的概率"},{"key":"B","text":"所有元素之和为 1"},{"key":"C","text":"元素非负"},{"key":"D","text":"输出元素可以是任意实数"}],"answer":["A","B","C"],"answerText":"ABC","explain":"softmax 回归的输出是概率分布，每个元素表示属于该类别的概率，所有元素之和为 1，元素非负。D 错误，输出元素在 0 到 1 之间。"},{"id":57,"chapter":"softmax 回归","type":"multi","stem":"关于 softmax 回归中的交叉熵和负对数似然，下列说法正确的是( )","options":[{"key":"A","text":"当真实分布是独热编码时，两者等价"},{"key":"B","text":"交叉熵是衡量两个分布的度量"},{"key":"C","text":"负对数似然是参数估计的方法"},{"key":"D","text":"两者完全相同，没有任何区别"}],"answer":["A","B","C"],"answerText":"ABC","explain":"当真实分布是独热编码时，交叉熵等于负对数似然。交叉熵是衡量两个分布的度量，负对数似然是参数估计的方法。D 错误，如果真实分布不是独热编码(比如标签平滑)，两者不完全等价。"},{"id":58,"chapter":"softmax 回归","type":"judge","stem":"softmax 回归用于多分类问题。","options":[],"answer":"正确","answerText":"正确","explain":"softmax 回归用于多分类问题，输出每个类别的概率分布。线性回归用于回归，logistic 回归用于二分类。"},{"id":59,"chapter":"softmax 回归","type":"judge","stem":"softmax 运算的输出总和为 1。","options":[],"answer":"正确","answerText":"正确","explain":"softmax 把实数分数映射为概率分布，所有元素之和为 1。"},{"id":60,"chapter":"softmax 回归","type":"judge","stem":"softmax 运算的输出元素可以是负数。","options":[],"answer":"错误","answerText":"错误","explain":"softmax 输出元素在 0 到 1 之间，非负。因为 exp 总是正的，除以正的和，结果非负。"},{"id":61,"chapter":"softmax 回归","type":"judge","stem":"交叉熵损失在独热编码下简化为 -log(预测概率[真实类别])。","options":[],"answer":"正确","answerText":"正确","explain":"当真实分布是独热编码时，交叉熵简化为 -log(预测概率[真实类别])。模型给真实类别分配的概率越高，损失越小。"},{"id":62,"chapter":"softmax 回归","type":"judge","stem":"softmax 加交叉熵的导数是 - y。","options":[],"answer":"正确","answerText":"正确","explain":"softmax 加交叉熵的导数是预测概率减去真实标签，即 - y。这个简洁形式是指数族分布加最大似然估计的自然结果。"},{"id":63,"chapter":"softmax 回归","type":"judge","stem":"PyTorch 的 CrossEntropyLoss 内部不包含 softmax。","options":[],"answer":"错误","answerText":"错误","explain":"PyTorch 的 CrossEntropyLoss 内部已经包含了 softmax，并且做了数值稳定处理。所以代码里不需要手动加 softmax。"},{"id":64,"chapter":"softmax 回归","type":"judge","stem":"softmax 运算具有平移不变性。","options":[],"answer":"正确","answerText":"正确","explain":"softmax 具有平移不变性:所有分数加同一个常数，输出不变。这个性质用于数值稳定性，减去最大值避免 exp 溢出。"},{"id":65,"chapter":"softmax 回归","type":"judge","stem":"精度是预测正确的样本数除以总样本数。","options":[],"answer":"正确","answerText":"正确","explain":"精度是预测正确的样本数除以总样本数。它在类别不平衡时可能骗人，需要结合混淆矩阵、召回率、F1 一起看。"},{"id":66,"chapter":"softmax 回归","type":"judge","stem":"在类别不平衡时，精度高一定代表模型好。","options":[],"answer":"错误","answerText":"错误","explain":"如果数据集中 99% 是负类，模型全部预测负类，精度是 99%，但模型毫无用处。精度在类别不平衡时可能骗人。"},{"id":67,"chapter":"softmax 回归","type":"judge","stem":"二分类时，softmax 退化为 sigmoid。","options":[],"answer":"正确","answerText":"正确","explain":"当类别数为 2 时，softmax 退化为 sigmoid。所以 softmax 回归是 logistic 回归在多分类上的推广。"},{"id":68,"chapter":"softmax 回归","type":"judge","stem":"softmax 回归的网络架构有隐藏层。","options":[],"answer":"错误","answerText":"错误","explain":"softmax 回归的网络架构是输入层、全连接层、softmax 层，没有隐藏层。所以它是一个单层神经网络。"},{"id":69,"chapter":"softmax 回归","type":"judge","stem":"全连接层的参数量与输入尺寸无关。","options":[],"answer":"错误","answerText":"错误","explain":"全连接层的参数量与输入尺寸直接相关。输入 784，输出 10，参数量约 7850;输入 150528，输出 1000，参数量约 1.5 亿。"},{"id":70,"chapter":"softmax 回归","type":"judge","stem":"交叉熵只能用于二分类问题。","options":[],"answer":"错误","answerText":"错误","explain":"交叉熵可以用于二分类和多分类。二分类用二元交叉熵，多分类用多元交叉熵。"},{"id":71,"chapter":"softmax 回归","type":"judge","stem":"当真实分布是独热编码时，交叉熵等于负对数似然。","options":[],"answer":"正确","answerText":"正确","explain":"当真实分布是独热编码时，交叉熵简化为 -log(预测概率[真实类别])，这正是负对数似然。但如果真实分布不是独热编码(比如标签平滑)，两者不完全等价。"},{"id":72,"chapter":"softmax 回归","type":"judge","stem":"softmax 回归的训练流程和线性回归完全相同。","options":[],"answer":"错误","answerText":"错误","explain":"训练流程的六步相同:数据加载、前向传播、损失计算、反向传播、参数更新、日志记录。但前向传播多了 softmax，损失计算从平方误差变成了交叉熵。所以不是完全相同。"},{"id":73,"chapter":"softmax 回归","type":"judge","stem":"softmax 回归的输出可以解释为每个类别的概率。","options":[],"answer":"正确","answerText":"正确","explain":"softmax 回归的输出是概率分布，每个元素表示属于该类别的概率。所有元素之和为 1。"},{"id":74,"chapter":"线性回归","type":"fill","stem":"线性回归模型 y = w·x + b 中，w 称为____，b 称为____。","options":[],"answer":["权重","偏置"],"answerText":"权重；偏置","explain":"w 是权重，b 是偏置，它们是线性回归的模型参数。"},{"id":75,"chapter":"线性回归","type":"fill","stem":"在高斯噪声假设下，最小化平方误差等价于最大化____。","options":[],"answer":["似然"],"answerText":"似然","explain":"假设 y = w·x + b + ε，ε 服从高斯分布，最大化似然等价于最小化平方误差。"},{"id":76,"chapter":"线性回归","type":"fill","stem":"线性回归的神经网络图等价于一个____层。","options":[],"answer":["全连接"],"answerText":"全连接","explain":"线性回归的神经网络图就是输入层加一个全连接层，输出层不加激活函数。"},{"id":77,"chapter":"线性回归","type":"fill","stem":"如果训练损失持续下降，但测试损失先下降后上升，说明模型出现了____。","options":[],"answer":["过拟合"],"answerText":"过拟合","explain":"训练损失下降、测试损失上升，是过拟合的典型表现。对应手段包括早停、正则化、增加数据。"},{"id":78,"chapter":"线性回归","type":"fill","stem":"SGD 的梯度是全批量梯度的____估计。","options":[],"answer":["无偏"],"answerText":"无偏","explain":"SGD 用单个样本的梯度作为全批量梯度的无偏估计。虽然单个样本有噪声，但期望等于全批量梯度。"},{"id":79,"chapter":"线性回归","type":"fill","stem":"线性回归的简洁实现使用____定义优化器。","options":[],"answer":["torch.optim.SGD"],"answerText":"torch.optim.SGD","explain":"简洁实现用 torch.optim.SGD 定义优化器，也可以用 Adam。"},{"id":80,"chapter":"模型选择与泛化","type":"fill","stem":"如果训练损失很低但测试损失很高，说明模型____;如果训练损失和测试损失都高，说明模型____。","options":[],"answer":["过拟合","欠拟合"],"answerText":"过拟合；欠拟合","explain":"训练损失低、测试损失高是过拟合;训练损失和测试损失都高是欠拟合。"},{"id":81,"chapter":"softmax 回归","type":"fill","stem":"线性回归的输出是____，softmax 回归的输出是____。","options":[],"answer":["实数","概率分布"],"answerText":"实数；概率分布","explain":"线性回归输出实数，softmax 回归输出概率分布。这是从回归到分类的范式转换。"},{"id":82,"chapter":"softmax 回归","type":"fill","stem":"softmax 回归主要用于解决____问题。","options":[],"answer":["多分类"],"answerText":"多分类","explain":"softmax 回归用于多分类问题，输出每个类别的概率分布。线性回归用于回归，logistic 回归用于二分类。"},{"id":83,"chapter":"softmax 回归","type":"fill","stem":"softmax 运算具有____不变性，即所有分数加同一个常数，输出不变。","options":[],"answer":["平移"],"answerText":"平移","explain":"softmax 具有平移不变性。这个性质用于数值稳定性，减去最大值避免 exp 溢出。"},{"id":84,"chapter":"softmax 回归","type":"fill","stem":"softmax 回归中，真实标签通常用____表示。","options":[],"answer":["独热编码"],"answerText":"独热编码","explain":"softmax 回归的真实标签通常用独热编码表示。比如 3 分类，类别 2 对应 (0, 1, 0)。"},{"id":85,"chapter":"softmax 回归","type":"fill","stem":"softmax 回归常用的损失函数是____。","options":[],"answer":["交叉熵损失"],"answerText":"交叉熵损失","explain":"softmax 回归用交叉熵损失，衡量模型预测分布和真实分布之间的差异。"},{"id":86,"chapter":"softmax 回归","type":"fill","stem":"最小化交叉熵等价于最大化____。","options":[],"answer":["对数似然"],"answerText":"对数似然","explain":"最小化交叉熵等价于最大化对数似然。这是最大似然估计的另一种表述。"},{"id":87,"chapter":"softmax 回归","type":"fill","stem":"二分类时，softmax 退化为____。","options":[],"answer":["sigmoid"],"answerText":"sigmoid","explain":"当类别数为 2 时，softmax 退化为 sigmoid。所以 softmax 回归是 logistic 回归在多分类上的推广。"},{"id":88,"chapter":"softmax 回归","type":"fill","stem":"交叉熵衡量的是两个____之间的差异。","options":[],"answer":["概率分布"],"answerText":"概率分布","explain":"交叉熵衡量模型预测分布和真实分布之间的差异。它是分类问题常用的损失函数。"},{"id":89,"chapter":"softmax 回归","type":"fill","stem":"当真实分布是独热编码时，交叉熵等于____。","options":[],"answer":["负对数似然"],"answerText":"负对数似然","explain":"当真实分布是独热编码时，交叉熵简化为 -log(预测概率[真实类别])，这正是负对数似然。"},{"id":90,"chapter":"softmax 回归","type":"fill","stem":"softmax 回归和线性回归的区别是:线性回归输出____，softmax 回归输出____。","options":[],"answer":["实数","概率分布"],"answerText":"实数；概率分布","explain":"线性回归输出实数，用平方误差。softmax 回归输出概率分布，用交叉熵。这是从回归到分类的范式转换。"},{"id":91,"chapter":"多层感知机","type":"single","stem":"如果多层感知机去掉所有激活函数，它等价于( )","options":[{"key":"A","text":"一个更深的非线性网络"},{"key":"B","text":"一个单层线性模型"},{"key":"C","text":"一个卷积网络"},{"key":"D","text":"一个循环网络"}],"answer":["B"],"answerText":"B","explain":"线性变换的复合仍然是线性变换。W(Wx + b) + b = Wx + b，仍然是一个线性模型。所以没有激活函数，深度就是假的。"},{"id":92,"chapter":"多层感知机","type":"single","stem":"多层感知机中，激活函数的作用是( )","options":[{"key":"A","text":"限制输出范围"},{"key":"B","text":"引入非线性"},{"key":"C","text":"增加参数量"},{"key":"D","text":"减少计算量"}],"answer":["B"],"answerText":"B","explain":"激活函数的核心作用是引入非线性，让假设空间从线性函数族扩展到非线性函数族。限制输出范围只是某些激活函数的副作用。"},{"id":93,"chapter":"多层感知机","type":"single","stem":"ReLU 函数的表达式是( )","options":[{"key":"A","text":"max(x, 0)"},{"key":"B","text":"1 / (1 + exp(-x))"},{"key":"C","text":"(exp(x) - exp(-x)) / (exp(x) + exp(-x))"},{"key":"D","text":"x²"}],"answer":["A"],"answerText":"A","explain":"ReLU 的表达式是 max(x, 0)。x 大于 0 时输出 x，x 小于 0 时输出 0。"},{"id":94,"chapter":"多层感知机","type":"single","stem":"ReLU 函数在 x < 0 时的导数是( )","options":[{"key":"A","text":"1"},{"key":"B","text":"0"},{"key":"C","text":"-1"},{"key":"D","text":"x"}],"answer":["B"],"answerText":"B","explain":"ReLU 在 x < 0 时输出恒为 0，导数为 0。这可能导致神经元死亡。x > 0 时导数为 1。"},{"id":95,"chapter":"多层感知机","type":"single","stem":"sigmoid 函数在饱和区的导数是( )","options":[{"key":"A","text":"接近 1"},{"key":"B","text":"接近 0"},{"key":"C","text":"等于 0.5"},{"key":"D","text":"无穷大"}],"answer":["B"],"answerText":"B","explain":"sigmoid 在输入很大或很小时，导数接近 0。这导致梯度消失，深层网络训练不起来。"},{"id":96,"chapter":"多层感知机","type":"single","stem":"tanh 函数相比 sigmoid 函数的主要优势是( )","options":[{"key":"A","text":"计算更快"},{"key":"B","text":"输出是零中心的"},{"key":"C","text":"没有饱和区"},{"key":"D","text":"值域是 0 到 1"}],"answer":["B"],"answerText":"B","explain":"tanh 的值域是 -1 到 1，输出是零中心的，这通常能让训练更稳定。但它仍然有饱和区，梯度消失问题依然存在。"},{"id":97,"chapter":"多层感知机","type":"single","stem":"ReLU 相比 sigmoid 的主要优势是( )","options":[{"key":"A","text":"输出是零中心的"},{"key":"B","text":"正值区不饱和，梯度不会消失"},{"key":"C","text":"值域是 0 到 1"},{"key":"D","text":"计算更复杂"}],"answer":["B"],"answerText":"B","explain":"ReLU 在正值区导数恒为 1，不饱和，梯度不会消失。这让深层网络训练成为可能。sigmoid 在饱和区梯度接近 0。"},{"id":98,"chapter":"多层感知机","type":"single","stem":"ReLU 的潜在问题是( )","options":[{"key":"A","text":"梯度爆炸"},{"key":"B","text":"神经元死亡"},{"key":"C","text":"输出为负"},{"key":"D","text":"计算量太大"}],"answer":["B"],"answerText":"B","explain":"ReLU 在负值区导数为 0。如果某个神经元的输入一直是负数，它的梯度永远是 0，可能再也更新不了。这叫神经元死亡。"},{"id":99,"chapter":"多层感知机","type":"single","stem":"多层感知机的输出层做多分类时，通常使用( )","options":[{"key":"A","text":"ReLU"},{"key":"B","text":"sigmoid"},{"key":"C","text":"softmax"},{"key":"D","text":"tanh"}],"answer":["C"],"answerText":"C","explain":"多分类的输出层用 softmax，把实数分数变成概率分布。二分类用 sigmoid，回归不加激活函数，隐藏层用 ReLU。"},{"id":100,"chapter":"多层感知机","type":"single","stem":"多层感知机的输出层做二分类时，通常使用( )","options":[{"key":"A","text":"ReLU"},{"key":"B","text":"sigmoid"},{"key":"C","text":"softmax"},{"key":"D","text":"tanh"}],"answer":["B"],"answerText":"B","explain":"二分类的输出层用 sigmoid，把实数分数压到 0 到 1，解释为正类的概率。多分类用 softmax，回归不加激活函数。"},{"id":101,"chapter":"多层感知机","type":"multi","stem":"关于激活函数的作用，下列说法正确的是( )","options":[{"key":"A","text":"引入非线性"},{"key":"B","text":"让假设空间从线性扩展到非线性"},{"key":"C","text":"没有激活函数，多层线性网络等价于单层线性网络"},{"key":"D","text":"激活函数的作用是限制输出范围"}],"answer":["A","B","C"],"answerText":"ABC","explain":"激活函数的核心作用是引入非线性，让假设空间从线性扩展到非线性。没有激活函数，多层线性网络等价于单层线性网络。D 错误，限制输出范围只是某些激活函数的副作用，不是核心作用。"},{"id":102,"chapter":"多层感知机","type":"multi","stem":"关于 ReLU 函数，下列说法正确的是( )","options":[{"key":"A","text":"表达式是 max(x, 0)"},{"key":"B","text":"x > 0 时导数为 1"},{"key":"C","text":"x < 0 时导数为 0"},{"key":"D","text":"可能导致神经元死亡"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"ReLU 的表达式是 max(x, 0)。x > 0 时导数为 1，x < 0 时导数为 0。负值区导数为 0 可能导致神经元死亡。"},{"id":103,"chapter":"多层感知机","type":"multi","stem":"关于 sigmoid 函数，下列说法正确的是( )","options":[{"key":"A","text":"值域是 0 到 1"},{"key":"B","text":"导数可以用 σ(x)(1 - σ(x)) 表示"},{"key":"C","text":"饱和区梯度消失"},{"key":"D","text":"输出是零中心的"}],"answer":["A","B","C"],"answerText":"ABC","explain":"sigmoid 的值域是 0 到 1，导数是 σ(x)(1 - σ(x))，饱和区梯度消失。D 错误，sigmoid 输出不是零中心的，tanh 才是。"},{"id":104,"chapter":"多层感知机","type":"multi","stem":"关于 tanh 函数，下列说法正确的是( )","options":[{"key":"A","text":"值域是 -1 到 1"},{"key":"B","text":"导数是 1 - tanh²(x)"},{"key":"C","text":"输出是零中心的"},{"key":"D","text":"没有饱和区"}],"answer":["A","B","C"],"answerText":"ABC","explain":"tanh 的值域是 -1 到 1，导数是 1 - tanh²(x)，输出是零中心的。D 错误，tanh 仍然有饱和区，梯度消失问题依然存在。"},{"id":105,"chapter":"多层感知机","type":"multi","stem":"关于激活函数的对比，下列说法正确的是( )","options":[{"key":"A","text":"ReLU 计算最简单"},{"key":"B","text":"tanh 是零中心的"},{"key":"C","text":"sigmoid 输出在 0 到 1 之间"},{"key":"D","text":"ReLU 在负值区导数为 0"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"ReLU 计算最简单，tanh 是零中心的，sigmoid 输出在 0 到 1 之间，ReLU 在负值区导数为 0。这四个说法都正确。"},{"id":106,"chapter":"多层感知机","type":"multi","stem":"关于多层感知机的输出层，下列说法正确的是( )","options":[{"key":"A","text":"多分类用 softmax"},{"key":"B","text":"二分类用 sigmoid"},{"key":"C","text":"回归不加激活函数"},{"key":"D","text":"输出层必须用 ReLU"}],"answer":["A","B","C"],"answerText":"ABC","explain":"多分类用 softmax，二分类用 sigmoid，回归不加激活函数。D 错误，输出层用 ReLU 会导致输出没有概率意义，损失函数无法使用。"},{"id":107,"chapter":"多层感知机","type":"multi","stem":"关于参数初始化，下列说法正确的是( )","options":[{"key":"A","text":"不能全部初始化为 0"},{"key":"B","text":"全零初始化会导致对称性问题"},{"key":"C","text":"通常用随机数初始化"},{"key":"D","text":"初始化尺度不重要"}],"answer":["A","B","C"],"answerText":"ABC","explain":"不能全部初始化为 0，因为会导致对称性问题，所有神经元学到相同的东西。通常用随机数初始化。D 错误，初始化尺度很重要，尺度过大或过小会导致梯度爆炸或消失。"},{"id":108,"chapter":"多层感知机","type":"multi","stem":"关于多层感知机和线性模型的关系，下列说法正确的是( )","options":[{"key":"A","text":"MLP 是线性模型的扩展"},{"key":"B","text":"去掉激活函数，MLP 退化为线性模型"},{"key":"C","text":"MLP 的假设空间比线性模型大"},{"key":"D","text":"MLP 和线性模型完全相同"}],"answer":["A","B","C"],"answerText":"ABC","explain":"MLP 是线性模型的扩展。去掉激活函数，MLP 退化为线性模型。MLP 的假设空间比线性模型大。D 错误，两者不相同。"},{"id":109,"chapter":"多层感知机","type":"multi","stem":"关于多层感知机的评估指标，下列说法正确的是( )","options":[{"key":"A","text":"训练损失反映模型在训练集上的拟合程度"},{"key":"B","text":"测试精度反映模型的泛化能力"},{"key":"C","text":"训练损失越低，模型一定越好"},{"key":"D","text":"训练损失和测试损失差距大，可能过拟合"}],"answer":["A","B","D"],"answerText":"ABD","explain":"训练损失反映拟合程度，测试精度反映泛化能力。训练损失和测试损失差距大，可能过拟合。C 错误，训练损失低不代表模型好，可能过拟合。"},{"id":110,"chapter":"多层感知机","type":"judge","stem":"多层感知机相比线性模型，核心变化是引入了隐藏层和非线性激活函数。","options":[],"answer":"正确","answerText":"正确","explain":"MLP 相比线性模型的核心变化是引入了隐藏层和非线性激活函数。没有非线性，多层线性网络等价于单层线性网络。"},{"id":111,"chapter":"多层感知机","type":"judge","stem":"去掉所有激活函数，多层感知机等价于单层线性模型。","options":[],"answer":"正确","answerText":"正确","explain":"线性变换的复合仍然是线性变换。W(Wx + b) + b = Wx + b，仍然是一个线性模型。"},{"id":112,"chapter":"多层感知机","type":"judge","stem":"激活函数的作用是限制输出范围。","options":[],"answer":"错误","answerText":"错误","explain":"激活函数的核心作用是引入非线性，让假设空间从线性扩展到非线性。限制输出范围只是某些激活函数的副作用。"},{"id":113,"chapter":"多层感知机","type":"judge","stem":"ReLU 函数在 x < 0 时导数为 1。","options":[],"answer":"错误","answerText":"错误","explain":"ReLU 在 x < 0 时输出恒为 0，导数为 0。x > 0 时导数为 1。"},{"id":114,"chapter":"多层感知机","type":"judge","stem":"ReLU 在正值区不饱和，梯度不会消失。","options":[],"answer":"正确","answerText":"正确","explain":"ReLU 在正值区导数恒为 1，不饱和，梯度不会消失。这让深层网络训练成为可能。"},{"id":115,"chapter":"多层感知机","type":"judge","stem":"ReLU 可能导致神经元死亡。","options":[],"answer":"正确","answerText":"正确","explain":"ReLU 在负值区导数为 0。如果某个神经元的输入一直是负数，它的梯度永远是 0，可能再也更新不了。这叫神经元死亡。"},{"id":116,"chapter":"多层感知机","type":"judge","stem":"sigmoid 函数在饱和区梯度消失。","options":[],"answer":"正确","answerText":"正确","explain":"sigmoid 在输入很大或很小时，导数接近 0，导致梯度消失，深层网络训练不起来。"},{"id":117,"chapter":"多层感知机","type":"judge","stem":"tanh 函数输出是零中心的。","options":[],"answer":"正确","answerText":"正确","explain":"tanh 的值域是 -1 到 1，输出是零中心的。这通常能让训练更稳定。但它仍然有饱和区。"},{"id":118,"chapter":"多层感知机","type":"judge","stem":"tanh 函数没有饱和区。","options":[],"answer":"错误","answerText":"错误","explain":"tanh 仍然有饱和区。当输入很大或很小时，导数接近 0，梯度消失问题依然存在。"},{"id":119,"chapter":"多层感知机","type":"judge","stem":"多层感知机的输出层做多分类时，通常使用 softmax。","options":[],"answer":"正确","answerText":"正确","explain":"多分类的输出层用 softmax，把实数分数变成概率分布。二分类用 sigmoid，回归不加激活函数。"},{"id":120,"chapter":"多层感知机","type":"judge","stem":"多层感知机的输出层做二分类时，通常使用 softmax。","options":[],"answer":"错误","answerText":"错误","explain":"二分类的输出层用 sigmoid，不是 softmax。多分类用 softmax。"},{"id":121,"chapter":"多层感知机","type":"judge","stem":"多层感知机的输出层做回归时，通常不加激活函数。","options":[],"answer":"正确","answerText":"正确","explain":"回归问题的输出是实数，不需要把输出限制在某个范围。所以输出层不加激活函数。"},{"id":122,"chapter":"多层感知机","type":"judge","stem":"多层感知机的参数可以全部初始化为 0。","options":[],"answer":"错误","answerText":"错误","explain":"不能全部初始化为 0，因为会导致对称性问题，所有神经元学到相同的东西。必须随机初始化。"},{"id":123,"chapter":"多层感知机","type":"judge","stem":"全零初始化会导致对称性问题。","options":[],"answer":"正确","answerText":"正确","explain":"如果所有参数都是 0，所有神经元的输出都一样，梯度也一样，它们会学到完全相同的东西。这叫对称性问题。"},{"id":124,"chapter":"多层感知机","type":"judge","stem":"通用逼近定理意味着单隐藏层 MLP 一定比多层 MLP 好。","options":[],"answer":"错误","answerText":"错误","explain":"通用逼近定理说的是存在性，不是可学习性。单隐藏层可能需要指数级多的神经元，而深度网络可以用多项式级神经元达到同样效果。"},{"id":125,"chapter":"多层感知机","type":"judge","stem":"多层感知机的隐藏层默认使用 ReLU 作为激活函数。","options":[],"answer":"正确","answerText":"正确","explain":"隐藏层默认用 ReLU。它在正值区不饱和，梯度不会消失，计算简单。如果效果不好可以试 Leaky ReLU 或 GELU。"},{"id":126,"chapter":"多层感知机","type":"judge","stem":"多层感知机的隐藏层越多越好。","options":[],"answer":"错误","answerText":"错误","explain":"隐藏层不是越多越好。层数增加会带来过拟合、梯度消失、训练难度增加等问题。模型容量要与数据量匹配。"},{"id":127,"chapter":"模型选择与泛化","type":"single","stem":"泛化误差指的是( )","options":[{"key":"A","text":"模型在训练集上的误差"},{"key":"B","text":"模型在测试集上的期望误差"},{"key":"C","text":"模型在验证集上的误差"},{"key":"D","text":"模型参数量的大小"}],"answer":["B"],"answerText":"B","explain":"泛化误差是模型在测试分布上的期望误差，也叫期望风险。训练误差是经验风险，验证误差用于选择超参数。"},{"id":128,"chapter":"模型选择与泛化","type":"single","stem":"训练误差低但测试误差高，说明模型出现了( )","options":[{"key":"A","text":"欠拟合"},{"key":"B","text":"过拟合"},{"key":"C","text":"梯度消失"},{"key":"D","text":"数据泄漏"}],"answer":["B"],"answerText":"B","explain":"训练误差低、测试误差高是过拟合。训练误差和测试误差都高是欠拟合。"},{"id":129,"chapter":"模型选择与泛化","type":"single","stem":"训练误差和测试误差都高，说明模型出现了( )","options":[{"key":"A","text":"欠拟合"},{"key":"B","text":"过拟合"},{"key":"C","text":"梯度爆炸"},{"key":"D","text":"分布偏移"}],"answer":["A"],"answerText":"A","explain":"训练误差和测试误差都高是欠拟合。模型太简单，学不到数据的模式。训练误差低、测试误差高是过拟合。"},{"id":130,"chapter":"模型选择与泛化","type":"single","stem":"K 折交叉验证的主要作用是( )","options":[{"key":"A","text":"增加训练数据"},{"key":"B","text":"用有限数据估计泛化误差的方差"},{"key":"C","text":"减少模型参数量"},{"key":"D","text":"加速训练"}],"answer":["B"],"answerText":"B","explain":"K 折交叉验证用同一份数据构造多个训练/验证划分，每个划分给出一个泛化误差估计。这些估计的均值和方差比单次划分更可靠。"},{"id":131,"chapter":"模型选择与泛化","type":"single","stem":"权重衰减是在哪个空间上做约束?( )","options":[{"key":"A","text":"参数空间"},{"key":"B","text":"表示空间"},{"key":"C","text":"输入空间"},{"key":"D","text":"输出空间"}],"answer":["A"],"answerText":"A","explain":"权重衰减在损失里加 L2 惩罚，把参数往 0 拉，约束的是参数空间。暂退法是在表示空间上做约束。"},{"id":132,"chapter":"模型选择与泛化","type":"single","stem":"权重衰减中的 λ 控制的是( )","options":[{"key":"A","text":"学习率"},{"key":"B","text":"参数空间的约束强度"},{"key":"C","text":"批量大小"},{"key":"D","text":"隐藏层大小"}],"answer":["B"],"answerText":"B","explain":"λ 控制参数空间的约束强度。λ 越大，参数被拉得越靠近 0，模型容量越小;λ 越小，约束越松。"},{"id":133,"chapter":"模型选择与泛化","type":"single","stem":"暂退法(Dropout)在训练时( )","options":[{"key":"A","text":"随机丢弃神经元"},{"key":"B","text":"随机丢弃输入"},{"key":"C","text":"随机丢弃输出"},{"key":"D","text":"不丢弃任何东西"}],"answer":["A"],"answerText":"A","explain":"暂退法在训练时以概率 p 随机丢弃神经元。测试时不丢弃，但输出要乘以 (1-p)，保持期望一致。"},{"id":134,"chapter":"模型选择与泛化","type":"single","stem":"暂退法的本质是( )","options":[{"key":"A","text":"参数约束"},{"key":"B","text":"模型集成的近似"},{"key":"C","text":"数据增强"},{"key":"D","text":"梯度裁剪"}],"answer":["B"],"answerText":"B","explain":"暂退法训练时随机丢弃神经元，相当于训练了指数级多个共享参数的子网络;测试时用完整网络，相当于对这些子网络的预测做近似平均。"},{"id":135,"chapter":"模型选择与泛化","type":"single","stem":"梯度消失的本质原因是( )","options":[{"key":"A","text":"学习率太大"},{"key":"B","text":"反向传播时梯度连乘，指数级衰减"},{"key":"C","text":"批量大小太小"},{"key":"D","text":"损失函数太大"}],"answer":["B"],"answerText":"B","explain":"深度网络反向传播时，梯度是连乘的。如果每一层的梯度都小于 1，连乘之后梯度指数级衰减，这就是梯度消失。"},{"id":136,"chapter":"模型选择与泛化","type":"single","stem":"梯度爆炸的本质原因是( )","options":[{"key":"A","text":"反向传播时梯度连乘，指数级增长"},{"key":"B","text":"学习率太小"},{"key":"C","text":"批量大小太大"},{"key":"D","text":"损失函数太小"}],"answer":["A"],"answerText":"A","explain":"反向传播时，如果每一层的梯度都大于 1，连乘之后梯度指数级增长，这就是梯度爆炸。训练会发散。"},{"id":137,"chapter":"模型选择与泛化","type":"single","stem":"参数不能全部初始化为 0，原因是( )","options":[{"key":"A","text":"计算量太大"},{"key":"B","text":"对称性问题"},{"key":"C","text":"梯度爆炸"},{"key":"D","text":"损失函数无定义"}],"answer":["B"],"answerText":"B","explain":"如果所有参数都是 0，所有神经元的输出都一样，梯度也一样，它们会学到完全相同的东西。这叫对称性问题。"},{"id":138,"chapter":"模型选择与泛化","type":"multi","stem":"关于欠拟合和过拟合，下列说法正确的是( )","options":[{"key":"A","text":"欠拟合:训练误差高，测试误差高"},{"key":"B","text":"过拟合:训练误差低，测试误差高"},{"key":"C","text":"过拟合的本质是模型容量大于数据量"},{"key":"D","text":"欠拟合可以通过增加模型容量解决"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"欠拟合是训练误差和测试误差都高，过拟合是训练误差低、测试误差高。过拟合的本质是模型容量大于数据量。欠拟合可以通过增加模型容量解决。"},{"id":139,"chapter":"模型选择与泛化","type":"multi","stem":"关于 K 折交叉验证，下列说法正确的是( )","options":[{"key":"A","text":"把数据分成 K 份"},{"key":"B","text":"每次用 K-1 份训练，1 份验证"},{"key":"C","text":"重复 K 次，取平均"},{"key":"D","text":"计算量是单次训练的 K 倍"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"K 折交叉验证把数据分成 K 份，每次用 K-1 份训练，1 份验证，重复 K 次取平均。计算量是单次训练的 K 倍。"},{"id":140,"chapter":"模型选择与泛化","type":"multi","stem":"关于权重衰减，下列说法正确的是( )","options":[{"key":"A","text":"在损失里加 L2 惩罚"},{"key":"B","text":"把参数往 0 拉"},{"key":"C","text":"在参数空间上做约束"},{"key":"D","text":"λ 越大，模型容量越小"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"权重衰减在损失里加 L2 惩罚，把参数往 0 拉，在参数空间上做约束。λ 越大，参数被约束得越紧，模型容量越小。"},{"id":141,"chapter":"模型选择与泛化","type":"multi","stem":"关于暂退法(Dropout)，下列说法正确的是( )","options":[{"key":"A","text":"训练时随机丢弃神经元"},{"key":"B","text":"测试时不丢弃，输出乘以 (1-p)"},{"key":"C","text":"本质是模型集成的近似"},{"key":"D","text":"在表示空间上做约束"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"暂退法训练时随机丢弃神经元，测试时不丢弃但输出乘以 (1-p)。本质是模型集成的近似，在表示空间上做约束。"},{"id":142,"chapter":"模型选择与泛化","type":"multi","stem":"关于权重衰减和暂退法的区别，下列说法正确的是( )","options":[{"key":"A","text":"权重衰减在参数空间上做约束"},{"key":"B","text":"暂退法在表示空间上做约束"},{"key":"C","text":"两者可以一起用"},{"key":"D","text":"两者机制相同"}],"answer":["A","B","C"],"answerText":"ABC","explain":"权重衰减在参数空间上做约束，暂退法在表示空间上做约束。两者机制不同，可以一起用。D 错误，两者机制不同。"},{"id":143,"chapter":"模型选择与泛化","type":"multi","stem":"关于梯度消失和梯度爆炸，下列说法正确的是( )","options":[{"key":"A","text":"梯度消失:连乘小于 1 的数，指数级衰减"},{"key":"B","text":"梯度爆炸:连乘大于 1 的数，指数级增长"},{"key":"C","text":"梯度消失导致浅层学不到东西"},{"key":"D","text":"梯度爆炸导致训练发散"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"梯度消失是连乘小于 1 的数，指数级衰减，浅层学不到东西。梯度爆炸是连乘大于 1 的数，指数级增长，训练发散。"},{"id":144,"chapter":"模型选择与泛化","type":"multi","stem":"关于参数初始化，下列说法正确的是( )","options":[{"key":"A","text":"不能全部初始化为 0"},{"key":"B","text":"全零初始化会导致对称性问题"},{"key":"C","text":"Xavier 初始化假设激活函数线性、零中心"},{"key":"D","text":"ReLU 更适合 He 初始化"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"不能全部初始化为 0，因为会导致对称性问题。Xavier 初始化假设激活函数线性、零中心。ReLU 更适合 He 初始化。"},{"id":145,"chapter":"模型选择与泛化","type":"multi","stem":"关于 Xavier 初始化和 He 初始化，下列说法正确的是( )","options":[{"key":"A","text":"Xavier 初始化适用于 sigmoid、tanh"},{"key":"B","text":"He 初始化适用于 ReLU"},{"key":"C","text":"He 初始化在 Xavier 基础上乘以 2"},{"key":"D","text":"两者完全相同"}],"answer":["A","B","C"],"answerText":"ABC","explain":"Xavier 初始化适用于 sigmoid、tanh，He 初始化适用于 ReLU。He 初始化在 Xavier 基础上乘以 2，补偿 ReLU 的方差衰减。D 错误，两者不同。"},{"id":146,"chapter":"模型选择与泛化","type":"multi","stem":"关于分布偏移，下列说法正确的是( )","options":[{"key":"A","text":"协变量偏移:P(x) 变了，P(y|x) 没变"},{"key":"B","text":"标签偏移:P(y) 变了，P(x|y) 没变"},{"key":"C","text":"概念偏移:P(y|x) 本身变了"},{"key":"D","text":"分布偏移是泛化假设失效的三种方式"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"协变量偏移是 P(x) 变了，标签偏移是 P(y) 变了，概念偏移是 P(y|x) 变了。分布偏移是泛化假设失效的三种方式。"},{"id":147,"chapter":"模型选择与泛化","type":"multi","stem":"关于分布偏移的纠正方法，下列说法正确的是( )","options":[{"key":"A","text":"协变量偏移:重要性加权"},{"key":"B","text":"标签偏移:调整输出先验"},{"key":"C","text":"概念偏移:重新收集数据"},{"key":"D","text":"三种偏移都可以用同一种方法纠正"}],"answer":["A","B","C"],"answerText":"ABC","explain":"协变量偏移用重要性加权，标签偏移用调整输出先验，概念偏移通常需要重新收集数据。D 错误，三种偏移的纠正方法不同。"},{"id":148,"chapter":"模型选择与泛化","type":"multi","stem":"关于公平、责任、透明，下列说法正确的是( )","options":[{"key":"A","text":"公平:模型在不同群体上的泛化误差是否一致"},{"key":"B","text":"责任:模型泛化失败造成伤害时，谁负责"},{"key":"C","text":"透明:能不能解释模型为什么做出某个预测"},{"key":"D","text":"它们是泛化问题在人类社会中的延伸"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"公平是模型在不同群体上的泛化误差是否一致，责任是模型泛化失败造成伤害时谁负责，透明是能不能解释模型为什么做出某个预测。它们是泛化问题在人类社会中的延伸。"},{"id":149,"chapter":"模型选择与泛化","type":"multi","stem":"关于训练误差、验证误差、测试误差，下列说法正确的是( )","options":[{"key":"A","text":"训练误差严重低估泛化误差"},{"key":"B","text":"验证误差略低估泛化误差"},{"key":"C","text":"测试误差近似无偏"},{"key":"D","text":"训练误差可以用来估计泛化误差"}],"answer":["A","B","C"],"answerText":"ABC","explain":"训练误差严重低估，验证误差略低估，测试误差近似无偏。D 错误，训练误差不能用来估计泛化误差。"},{"id":150,"chapter":"模型选择与泛化","type":"multi","stem":"关于估计泛化误差的可靠性，下列说法正确的是( )","options":[{"key":"A","text":"数据量越多，估计越可靠"},{"key":"B","text":"K 折比单次划分更可靠"},{"key":"C","text":"分层 K 折在类别不平衡时更可靠"},{"key":"D","text":"分布偏移会让估计失效"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"泛化误差估计的可靠性取决于数据量、划分方式、训练分布和测试分布是否一致。数据量越多越可靠，K 折比单次划分更可靠，分层 K 折在类别不平衡时更可靠，分布偏移会让估计失效。"},{"id":151,"chapter":"模型选择与泛化","type":"judge","stem":"泛化误差是模型在训练集上的误差。","options":[],"answer":"错误","answerText":"错误","explain":"泛化误差是模型在测试分布上的期望误差，不是训练集上的误差。训练误差是经验风险。"},{"id":152,"chapter":"模型选择与泛化","type":"judge","stem":"训练误差低但测试误差高，说明模型过拟合。","options":[],"answer":"正确","answerText":"正确","explain":"训练误差低、测试误差高是过拟合。训练误差和测试误差都高是欠拟合。"},{"id":153,"chapter":"模型选择与泛化","type":"judge","stem":"训练误差和测试误差都高，说明模型欠拟合。","options":[],"answer":"正确","answerText":"正确","explain":"训练误差和测试误差都高是欠拟合。模型太简单，学不到数据的模式。"},{"id":154,"chapter":"模型选择与泛化","type":"judge","stem":"K 折交叉验证的主要作用是用有限数据估计泛化误差的方差。","options":[],"answer":"正确","answerText":"正确","explain":"K 折交叉验证用同一份数据构造多个训练/验证划分，每个划分给出一个泛化误差估计。这些估计的均值和方差比单次划分更可靠。"},{"id":155,"chapter":"模型选择与泛化","type":"judge","stem":"权重衰减在表示空间上做约束。","options":[],"answer":"错误","answerText":"错误","explain":"权重衰减在参数空间上做约束，把参数往 0 拉。暂退法在表示空间上做约束。"},{"id":156,"chapter":"模型选择与泛化","type":"judge","stem":"权重衰减中的 λ 越大，模型容量越小。","options":[],"answer":"正确","answerText":"正确","explain":"λ 越大，参数被拉得越靠近 0，模型容量越小。λ 太大会导致欠拟合，λ 等于 0 则没有正则化。"},{"id":157,"chapter":"模型选择与泛化","type":"judge","stem":"暂退法在训练时随机丢弃神经元，测试时也随机丢弃。","options":[],"answer":"错误","answerText":"错误","explain":"暂退法训练时随机丢弃神经元，测试时不丢弃，但输出乘以 (1-p)，保持期望一致。如果测试时也丢弃，输出会带随机性，不稳定。"},{"id":158,"chapter":"模型选择与泛化","type":"judge","stem":"暂退法的本质是模型集成的近似。","options":[],"answer":"正确","answerText":"正确","explain":"暂退法训练时随机丢弃神经元，相当于训练了指数级多个共享参数的子网络;测试时用完整网络，相当于对这些子网络的预测做近似平均。"},{"id":159,"chapter":"模型选择与泛化","type":"judge","stem":"梯度消失的本质原因是反向传播时梯度连乘，指数级衰减。","options":[],"answer":"正确","answerText":"正确","explain":"深度网络反向传播时，梯度是连乘的。如果每一层的梯度都小于 1，连乘之后梯度指数级衰减，这就是梯度消失。"},{"id":160,"chapter":"模型选择与泛化","type":"judge","stem":"梯度爆炸会导致训练发散。","options":[],"answer":"正确","answerText":"正确","explain":"反向传播时，如果每一层的梯度都大于 1，连乘之后梯度指数级增长，训练会发散。"},{"id":161,"chapter":"模型选择与泛化","type":"judge","stem":"参数可以全部初始化为 0。","options":[],"answer":"错误","answerText":"错误","explain":"不能全部初始化为 0，因为会导致对称性问题，所有神经元学到相同的东西。必须随机初始化。"},{"id":162,"chapter":"模型选择与泛化","type":"judge","stem":"公平、责任、透明是泛化问题在人类社会中的延伸。","options":[],"answer":"正确","answerText":"正确","explain":"公平是模型在不同群体上的泛化误差是否一致，责任是模型泛化失败造成伤害时谁负责，透明是能不能解释模型为什么做出某个预测。它们是泛化问题在人类社会中的延伸。"},{"id":163,"chapter":"模型选择与泛化","type":"judge","stem":"训练误差可以用来估计泛化误差。","options":[],"answer":"错误","answerText":"错误","explain":"训练误差严重低估泛化误差，不能用来估计泛化误差。验证误差略低估，测试误差近似无偏。"},{"id":164,"chapter":"模型选择与泛化","type":"judge","stem":"K 折交叉验证的 K 越大，估计越可靠，但计算量越大。","options":[],"answer":"正确","answerText":"正确","explain":"K 越大，每个训练集越大，估计越可靠，但计算量是单次训练的 K 倍。实践中 K 通常取 5 或 10。"},{"id":165,"chapter":"模型选择与泛化","type":"judge","stem":"正则化一定能让模型变好。","options":[],"answer":"错误","answerText":"错误","explain":"正则化不一定能让模型变好。如果 λ 太大，参数被拉得太靠近 0，模型会欠拟合。正则化需要调超参数。"},{"id":166,"chapter":"模型选择与泛化","type":"judge","stem":"权重衰减和暂退法可以一起用。","options":[],"answer":"正确","answerText":"正确","explain":"权重衰减在参数空间上做约束，暂退法在表示空间上做约束。两者机制不同，可以互补，实践中经常一起用。"},{"id":167,"chapter":"模型选择与泛化","type":"judge","stem":"分布偏移是泛化假设失效的三种方式。","options":[],"answer":"正确","answerText":"正确","explain":"协变量偏移、标签偏移、概念偏移是泛化假设失效的三种方式。它们提醒我们:泛化不是理所当然的，它依赖于一个假设。"},{"id":168,"chapter":"模型选择与泛化","type":"judge","stem":"精度是分类评估的唯一指标。","options":[],"answer":"错误","answerText":"错误","explain":"精度不是唯一指标。在类别不平衡时，精度可能骗人。应该结合混淆矩阵、召回率、F1 一起看。"},{"id":169,"chapter":"模型选择与泛化","type":"judge","stem":"泛化问题的完整地图包括估计泛化误差、失败模式、控制泛化误差、泛化假设失效、泛化的社会延伸。","options":[],"answer":"正确","answerText":"正确","explain":"泛化问题的完整地图包括估计泛化误差(模型选择、K 折)、失败模式(欠拟合、过拟合)、控制泛化误差(权重衰减、暂退法)、让优化不出问题(数值稳定性、初始化)、泛化假设失效(分布偏移)、泛化的社会延伸(公平、责任、透明)。"},{"id":170,"chapter":"模型选择与泛化","type":"judge","stem":"权重衰减通常只约束权重 W，不约束偏置 b。","options":[],"answer":"正确","answerText":"正确","explain":"权重衰减通常只约束权重 W，不约束偏置 b。因为偏置不影响输入特征的权重，它只是平移。把偏置往 0 拉，不会起到防止过拟合的作用。"},{"id":171,"chapter":"模型选择与泛化","type":"judge","stem":"暂退法测试时输出乘以 (1-p) 是为了保持和训练时的期望一致。","options":[],"answer":"正确","answerText":"正确","explain":"训练时每个神经元被保留的概率是 1-p，所以训练时的期望输出是实际输出乘以 (1-p)。测试时所有神经元都保留，输出会比训练时的期望大。为了保持期望一致，测试时要把输出乘以 (1-p)。"},{"id":172,"chapter":"多层感知机","type":"fill","stem":"如果多层感知机去掉所有激活函数，它等价于____。","options":[],"answer":["单层线性模型"],"answerText":"单层线性模型","explain":"线性变换的复合仍然是线性变换。W(Wx + b) + b = Wx + b，仍然是一个线性模型。"},{"id":173,"chapter":"多层感知机","type":"fill","stem":"ReLU 在负值区导数为 0，可能导致____。","options":[],"answer":["神经元死亡"],"answerText":"神经元死亡","explain":"ReLU 在负值区导数为 0。如果某个神经元的输入一直是负数，它的梯度永远是 0，可能再也更新不了。这叫神经元死亡。"},{"id":174,"chapter":"多层感知机","type":"fill","stem":"sigmoid 函数在饱和区的导数接近____，导致____。","options":[],"answer":["0","梯度消失"],"answerText":"0；梯度消失","explain":"sigmoid 在输入很大或很小时，导数接近 0。这导致梯度消失，深层网络训练不起来。"},{"id":175,"chapter":"多层感知机","type":"fill","stem":"多层感知机中，参数不能全部初始化为 0，原因是____。","options":[],"answer":["对称性问题"],"answerText":"对称性问题","explain":"如果所有参数都是 0，所有神经元的输出都一样，梯度也一样，它们会学到完全相同的东西。这叫对称性问题。"},{"id":176,"chapter":"多层感知机","type":"fill","stem":"多层感知机的隐藏层通常使用____作为激活函数。","options":[],"answer":["ReLU"],"answerText":"ReLU","explain":"隐藏层默认用 ReLU。它在正值区不饱和，梯度不会消失，计算简单。如果效果不好可以试 Leaky ReLU 或 GELU。"},{"id":177,"chapter":"多层感知机","type":"fill","stem":"多层感知机简洁实现使用____定义损失函数。","options":[],"answer":["nn.CrossEntropyLoss"],"answerText":"nn.CrossEntropyLoss","explain":"多分类任务用 nn.CrossEntropyLoss。它内部包含 softmax 和数值稳定性处理。"},{"id":178,"chapter":"多层感知机","type":"fill","stem":"多层感知机相比线性模型，假设空间从____函数族扩展到____函数族。","options":[],"answer":["线性","非线性"],"answerText":"线性；非线性","explain":"MLP 的假设空间比线性模型大。激活函数让假设空间从线性函数族扩展到非线性函数族。"},{"id":179,"chapter":"层和块与参数管理","type":"single","stem":"在深度学习框架中，层和块的关系是( )","options":[{"key":"A","text":"层是块的容器"},{"key":"B","text":"块是层的容器，块可以包含层或其他块"},{"key":"C","text":"层和块完全相同"},{"key":"D","text":"块只能包含一层"}],"answer":["B"],"answerText":"B","explain":"层是最小计算单元，块是可以包含层或其他块的容器。块可以嵌套块，这是递归组合关系。"},{"id":180,"chapter":"层和块与参数管理","type":"single","stem":"nn.Sequential 属于( )","options":[{"key":"A","text":"层"},{"key":"B","text":"块"},{"key":"C","text":"损失函数"},{"key":"D","text":"优化器"}],"answer":["B"],"answerText":"B","explain":"nn.Sequential 是一个块，它可以包含层或其他块。nn.Linear、nn.ReLU 是层。"},{"id":181,"chapter":"层和块与参数管理","type":"single","stem":"块负责的内部处理不包括( )","options":[{"key":"A","text":"参数初始化"},{"key":"B","text":"前向传播"},{"key":"C","text":"反向传播"},{"key":"D","text":"数据标注"}],"answer":["D"],"answerText":"D","explain":"块负责参数初始化、前向传播、反向传播。数据标注不是块负责的，是数据准备阶段的工作。"},{"id":182,"chapter":"层和块与参数管理","type":"single","stem":"参数管理的三个阶段是( )","options":[{"key":"A","text":"访问、初始化、绑定"},{"key":"B","text":"访问、删除、绑定"},{"key":"C","text":"初始化、删除、保存"},{"key":"D","text":"访问、初始化、删除"}],"answer":["A"],"answerText":"A","explain":"参数管理的三个阶段是访问、初始化、绑定。访问是训练时读取和更新参数，初始化是训练前赋初值，绑定是绑定到优化器、设备、模型。"},{"id":183,"chapter":"层和块与参数管理","type":"single","stem":"访问模型中所有参数的函数是( )","options":[{"key":"A","text":"net.parameters( )"},{"key":"B","text":"net.layers( )"},{"key":"C","text":"net.modules( )"},{"key":"D","text":"net.weights( )"}],"answer":["A"],"answerText":"A","explain":"net.parameters( ) 返回模型中所有参数的迭代器。net.named_parameters( ) 同时返回参数名和参数。"},{"id":184,"chapter":"层和块与参数管理","type":"single","stem":"延后初始化的好处不包括( )","options":[{"key":"A","text":"修改模型架构变得容易"},{"key":"B","text":"避免维度错误"},{"key":"C","text":"支持动态输入形状"},{"key":"D","text":"减少模型参数量"}],"answer":["D"],"answerText":"D","explain":"延后初始化的好处是修改模型架构容易、避免维度错误、支持动态输入形状。它不减少模型参数量。"},{"id":185,"chapter":"层和块与参数管理","type":"single","stem":"自定义层需要继承( )","options":[{"key":"A","text":"nn.Module"},{"key":"B","text":"nn.Linear"},{"key":"C","text":"nn.Sequential"},{"key":"D","text":"nn.Parameter"}],"answer":["A"],"answerText":"A","explain":"自定义层需要继承 nn.Module，定义 init 和 forward。nn.Linear、nn.Sequential 都是 nn.Module 的子类。"},{"id":186,"chapter":"层和块与参数管理","type":"single","stem":"自定义层不需要自己写( )","options":[{"key":"A","text":"前向传播"},{"key":"B","text":"反向传播"},{"key":"C","text":"init"},{"key":"D","text":"forward"}],"answer":["B"],"answerText":"B","explain":"自定义层不需要自己写反向传播，框架的自动微分机制会自动计算梯度。你只需要定义 init 和 forward。"},{"id":187,"chapter":"层和块与参数管理","type":"single","stem":"保存模型参数通常使用( )","options":[{"key":"A","text":"torch.save(model.state_dict( ), 'model.pth')"},{"key":"B","text":"torch.save(model, 'model.pth')"},{"key":"C","text":"torch.save(model.parameters( ), 'model.pth')"},{"key":"D","text":"torch.save(model.layers( ), 'model.pth')"}],"answer":["A"],"answerText":"A","explain":"通常用 torch.save(model.state_dict( ), 'model.pth') 保存参数字典。state_dict 是参数名到参数的映射。"},{"id":188,"chapter":"层和块与参数管理","type":"single","stem":"模型 = 架构 + 参数，其中架构保存在( )","options":[{"key":"A","text":"参数字典中"},{"key":"B","text":"代码中"},{"key":"C","text":"优化器中"},{"key":"D","text":"数据集中"}],"answer":["B"],"answerText":"B","explain":"模型等于架构加参数。架构在代码里，参数在文件里。保存架构必须在代码中完成，而不是在参数中完成。"},{"id":189,"chapter":"层和块与参数管理","type":"single","stem":"如果模型在 GPU 上，数据在 CPU 上，会发生什么?( )","options":[{"key":"A","text":"正常计算"},{"key":"B","text":"报错，因为计算要求所有输入数据在同一设备上"},{"key":"C","text":"自动把数据移到 GPU"},{"key":"D","text":"自动把模型移到 CPU"}],"answer":["B"],"answerText":"B","explain":"深度学习框架要求计算的所有输入数据都在同一设备上。如果模型在 GPU、数据在 CPU，计算会报错。"},{"id":190,"chapter":"层和块与参数管理","type":"single","stem":"参数初始化的目的是( )","options":[{"key":"A","text":"让参数全为 0"},{"key":"B","text":"给参数赋初值，影响梯度流动"},{"key":"C","text":"减少参数量"},{"key":"D","text":"增加计算量"}],"answer":["B"],"answerText":"B","explain":"参数初始化给参数赋初值，初始化尺度影响梯度流动。全零初始化会导致对称性问题，尺度过大或过小会导致梯度爆炸或消失。"},{"id":191,"chapter":"层和块与参数管理","type":"single","stem":"自定义层中，如果参数没有用 nn.Parameter 包装，会发生什么?( )","options":[{"key":"A","text":"参数仍然会被优化器更新"},{"key":"B","text":"参数不会被注册，优化器不会更新它"},{"key":"C","text":"参数会自动变成 nn.Parameter"},{"key":"D","text":"参数会报错"}],"answer":["B"],"answerText":"B","explain":"如果参数没有用 nn.Parameter 包装，框架不会把它当作模型参数，优化器不会更新它，保存 state_dict 时也不会保存它。"},{"id":192,"chapter":"层和块与参数管理","type":"single","stem":"关于 GPU 的日志记录，正确的做法是( )","options":[{"key":"A","text":"每一步都 loss.item( ) 打印"},{"key":"B","text":"在 GPU 上累积日志，每隔一段时间搬一次"},{"key":"C","text":"把每个小批量的损失都记录到 NumPy ndarray"},{"key":"D","text":"每一步都把损失搬到 CPU"}],"answer":["B"],"answerText":"B","explain":"在 GPU 上累积日志，每隔一段时间搬一次，可以减少设备同步次数，提高性能。每一步都 loss.item( ) 会触发全局解释器锁，阻塞 GPU。"},{"id":193,"chapter":"层和块与参数管理","type":"multi","stem":"关于层和块，下列说法正确的是( )","options":[{"key":"A","text":"层是最小计算单元"},{"key":"B","text":"块可以包含层"},{"key":"C","text":"块可以包含其他块"},{"key":"D","text":"块负责参数初始化和反向传播"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"层是最小计算单元，块可以包含层或其他块。块负责参数初始化和反向传播。块和块之间是递归组合关系。"},{"id":194,"chapter":"层和块与参数管理","type":"multi","stem":"关于参数管理，下列说法正确的是( )","options":[{"key":"A","text":"访问:读取参数、更新参数"},{"key":"B","text":"初始化:给参数赋初值"},{"key":"C","text":"绑定:绑定到优化器、设备、模型"},{"key":"D","text":"参数管理只包括访问"}],"answer":["A","B","C"],"answerText":"ABC","explain":"参数管理包括访问、初始化、绑定三个阶段。D 错误，参数管理不只是访问。"},{"id":195,"chapter":"层和块与参数管理","type":"multi","stem":"关于延后初始化，下列说法正确的是( )","options":[{"key":"A","text":"定义模型时不需要指定输入维度"},{"key":"B","text":"第一次前向传播时推断参数形状"},{"key":"C","text":"让修改模型架构变得容易"},{"key":"D","text":"避免维度错误"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"延后初始化让框架在第一次前向传播时根据输入数据推断参数形状。定义模型时不需要指定输入维度，让修改模型架构变得容易，避免维度错误。"},{"id":196,"chapter":"层和块与参数管理","type":"multi","stem":"关于自定义层，下列说法正确的是( )","options":[{"key":"A","text":"继承 nn.Module"},{"key":"B","text":"定义 init 和 forward"},{"key":"C","text":"不需要自己写反向传播"},{"key":"D","text":"可以定义局部参数"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"自定义层继承 nn.Module，定义 init 和 forward。不需要自己写反向传播，框架的自动微分机制会自动计算梯度。可以定义局部参数。"},{"id":197,"chapter":"层和块与参数管理","type":"multi","stem":"关于读写文件，下列说法正确的是( )","options":[{"key":"A","text":"save 和 load 可用于张量对象的文件读写"},{"key":"B","text":"可以通过参数字典保存和加载网络的全部参数"},{"key":"C","text":"保存架构必须在代码中完成"},{"key":"D","text":"模型 = 架构(代码) + 参数(文件)"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"save 和 load 可用于张量对象的文件读写。可以通过参数字典保存和加载网络的全部参数。保存架构必须在代码中完成。模型等于架构加参数。"},{"id":198,"chapter":"层和块与参数管理","type":"multi","stem":"关于 GPU，下列说法正确的是( )","options":[{"key":"A","text":"可以指定用于存储和计算的设备"},{"key":"B","text":"默认数据在主内存中创建，CPU 计算"},{"key":"C","text":"计算要求所有输入数据在同一设备上"},{"key":"D","text":"移动数据有性能开销"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"可以指定 CPU 或 GPU。默认数据在主内存中创建，CPU 计算。计算要求所有输入数据在同一设备上。移动数据有性能开销。"},{"id":199,"chapter":"层和块与参数管理","type":"multi","stem":"关于 GPU 的日志记录，下列说法正确的是( )","options":[{"key":"A","text":"计算 GPU 上每个小批量的损失，并在命令行中报告，会触发全局解释器锁"},{"key":"B","text":"全局解释器锁会使所有 GPU 阻塞"},{"key":"C","text":"最好为 GPU 内部的日志分配内存"},{"key":"D","text":"只移动较大的日志"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"计算 GPU 上每个小批量的损失并在命令行中报告，会触发全局解释器锁，使所有 GPU 阻塞。最好为 GPU 内部的日志分配内存，只移动较大的日志。"},{"id":200,"chapter":"层和块与参数管理","type":"multi","stem":"关于参数初始化，下列说法正确的是( )","options":[{"key":"A","text":"全零初始化会导致对称性问题"},{"key":"B","text":"初始化尺度会影响梯度流动"},{"key":"C","text":"可以用自定义初始化方法"},{"key":"D","text":"初始化不重要"}],"answer":["A","B","C"],"answerText":"ABC","explain":"全零初始化会导致对称性问题，初始化尺度会影响梯度流动，可以用自定义初始化方法。D 错误，初始化很重要。"},{"id":201,"chapter":"层和块与参数管理","type":"multi","stem":"关于自定义层的参数，下列说法正确的是( )","options":[{"key":"A","text":"需要用 nn.Parameter 包装"},{"key":"B","text":"不包装就不会被注册"},{"key":"C","text":"不包装优化器不会更新它"},{"key":"D","text":"不包装保存 state_dict 时也不会保存它"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"自定义层的参数需要用 nn.Parameter 包装。不包装就不会被注册，优化器不会更新它，保存 state_dict 时也不会保存它。"},{"id":202,"chapter":"层和块与参数管理","type":"multi","stem":"关于模型保存，下列说法正确的是( )","options":[{"key":"A","text":"state_dict 保存参数名到参数的映射"},{"key":"B","text":"保存整个模型有风险，依赖具体类定义和代码路径"},{"key":"C","text":"教材建议只保存 state_dict"},{"key":"D","text":"加载时需要先定义架构，再加载参数"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"state_dict 保存参数名到参数的映射。保存整个模型有风险，依赖具体类定义和代码路径。教材建议只保存 state_dict。加载时需要先定义架构，再加载参数。"},{"id":203,"chapter":"层和块与参数管理","type":"multi","stem":"关于设备管理，下列说法正确的是( )","options":[{"key":"A","text":"模型移到 GPU 用 net.to(device)"},{"key":"B","text":"数据移到 GPU 用 X.to(device)"},{"key":"C","text":"如果模型在 GPU、数据在 CPU，计算会报错"},{"key":"D","text":"每一批数据都要显式移到 GPU"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"模型移到 GPU 用 net.to(device)，数据移到 GPU 用 X.to(device)。如果模型在 GPU、数据在 CPU，计算会报错。每一批数据都要显式移到 GPU。"},{"id":204,"chapter":"层和块与参数管理","type":"multi","stem":"关于 GPU 性能优化，下列说法正确的是( )","options":[{"key":"A","text":"数据在设备间移动有开销"},{"key":"B","text":"频繁的小数据移动会显著降低性能"},{"key":"C","text":"建议一次性移动较大的数据块"},{"key":"D","text":"避免在训练循环里频繁 .cpu( ) 或 .item( )"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"数据在设备间移动有开销，频繁的小数据移动会显著降低性能。建议一次性移动较大的数据块，避免在训练循环里频繁 .cpu( ) 或 .item( )。"},{"id":205,"chapter":"层和块与参数管理","type":"multi","stem":"关于块和层的递归组合，下列说法正确的是( )","options":[{"key":"A","text":"块可以包含层"},{"key":"B","text":"块可以包含块"},{"key":"C","text":"这种递归组合让框架可以表达任意复杂的网络"},{"key":"D","text":"ResNet 残差块、Transformer 编码器块都是递归组合的实例"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"块可以包含层，也可以包含块。这种递归组合让框架可以表达任意复杂的网络。ResNet 残差块、Transformer 编码器块都是递归组合的实例。"},{"id":206,"chapter":"层和块与参数管理","type":"multi","stem":"关于参数绑定，下列说法正确的是( )","options":[{"key":"A","text":"绑定到优化器:把 net.parameters( ) 传给优化器"},{"key":"B","text":"绑定到设备:用 net.to(device)"},{"key":"C","text":"绑定到模型:用 nn.Parameter 自动注册"},{"key":"D","text":"优化器、设备、模型共享同一份参数"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"绑定到优化器是把 net.parameters( ) 传给优化器，绑定到设备是用 net.to(device)，绑定到模型是用 nn.Parameter 自动注册。优化器、设备、模型共享同一份参数。"},{"id":207,"chapter":"层和块与参数管理","type":"multi","stem":"关于延后初始化和参数绑定的关系，下列说法正确的是( )","options":[{"key":"A","text":"延后初始化影响参数初始化的时机"},{"key":"B","text":"参数绑定发生在参数初始化之后"},{"key":"C","text":"延后初始化让参数形状在第一次前向传播时确定"},{"key":"D","text":"延后初始化不影响参数绑定"}],"answer":["A","B","C"],"answerText":"ABC","explain":"延后初始化影响参数初始化的时机，参数绑定发生在参数初始化之后。延后初始化让参数形状在第一次前向传播时确定。D 错误，延后初始化会影响参数绑定的时机。"},{"id":208,"chapter":"层和块与参数管理","type":"multi","stem":"关于读写文件，下列说法正确的是( )","options":[{"key":"A","text":"torch.save 使用 Python 的 pickle 格式"},{"key":"B","text":"可以保存任意 Python 对象"},{"key":"C","text":"加载时不要加载不可信来源的文件"},{"key":"D","text":"state_dict 只保存参数，不保存架构"}],"answer":["A","B","C","D"],"answerText":"ABCD","explain":"torch.save 使用 Python 的 pickle 格式，可以保存任意 Python 对象。加载时不要加载不可信来源的文件。state_dict 只保存参数，不保存架构。"},{"id":209,"chapter":"层和块与参数管理","type":"judge","stem":"层是最小计算单元，块是可以包含层或其他块的容器。","options":[],"answer":"正确","answerText":"正确","explain":"层是最小计算单元，块是可以包含层或其他块的容器。块可以嵌套块，这是递归组合关系。"},{"id":210,"chapter":"层和块与参数管理","type":"judge","stem":"nn.Sequential 是一个层。","options":[],"answer":"错误","answerText":"错误","explain":"nn.Sequential 是一个块，它可以包含层或其他块。nn.Linear、nn.ReLU 是层。"},{"id":211,"chapter":"层和块与参数管理","type":"judge","stem":"块负责参数初始化、前向传播和反向传播。","options":[],"answer":"正确","answerText":"正确","explain":"块负责大量的内部处理，包括参数初始化和反向传播。前向传播也由块定义。"},{"id":212,"chapter":"层和块与参数管理","type":"judge","stem":"参数管理的三个阶段是访问、初始化、绑定。","options":[],"answer":"正确","answerText":"正确","explain":"参数管理的三个阶段是访问、初始化、绑定。访问是训练时读取和更新参数，初始化是训练前赋初值，绑定是绑定到优化器、设备、模型。"},{"id":213,"chapter":"层和块与参数管理","type":"judge","stem":"延后初始化让框架在第一次前向传播时根据输入数据推断参数形状。","options":[],"answer":"正确","answerText":"正确","explain":"延后初始化让框架在第一次前向传播时，根据输入数据自动推断参数形状。定义模型时不需要指定输入维度。"},{"id":214,"chapter":"层和块与参数管理","type":"judge","stem":"延后初始化会减少模型参数量。","options":[],"answer":"错误","answerText":"错误","explain":"延后初始化不减少模型参数量。它的好处是修改模型架构容易、避免维度错误、支持动态输入形状。"},{"id":215,"chapter":"层和块与参数管理","type":"judge","stem":"自定义层需要继承 nn.Module。","options":[],"answer":"正确","answerText":"正确","explain":"自定义层需要继承 nn.Module，定义 init 和 forward。nn.Linear、nn.Sequential 都是 nn.Module 的子类。"},{"id":216,"chapter":"层和块与参数管理","type":"judge","stem":"自定义层中的参数需要用 nn.Parameter 包装，才能被框架注册。","options":[],"answer":"正确","answerText":"正确","explain":"自定义层中的参数需要用 nn.Parameter 包装，才能被框架注册。优化器会更新它，保存 state_dict 时也会保存它。"},{"id":217,"chapter":"层和块与参数管理","type":"judge","stem":"如果自定义层的参数没有用 nn.Parameter 包装，优化器仍然会更新它。","options":[],"answer":"错误","answerText":"错误","explain":"如果参数没有用 nn.Parameter 包装，框架不会把它当作模型参数，优化器不会更新它，保存 state_dict 时也不会保存它。"},{"id":218,"chapter":"层和块与参数管理","type":"judge","stem":"torch.save(model.state_dict( ), 'model.pth') 保存了整个模型。","options":[],"answer":"错误","answerText":"错误","explain":"state_dict 只保存参数，不保存架构。模型等于架构加参数。架构在代码里，参数在文件里。"},{"id":219,"chapter":"层和块与参数管理","type":"judge","stem":"模型 = 架构(代码) + 参数(文件)。","options":[],"answer":"正确","answerText":"正确","explain":"模型等于架构加参数。架构在代码里，参数在文件里。保存架构必须在代码中完成，而不是在参数中完成。"},{"id":220,"chapter":"层和块与参数管理","type":"judge","stem":"如果只保存了 state_dict，没有保存代码，不能恢复模型。","options":[],"answer":"正确","answerText":"正确","explain":"state_dict 只保存参数的数值，不保存模型的架构。加载时，需要先在代码里定义架构，然后加载参数。"},{"id":221,"chapter":"层和块与参数管理","type":"judge","stem":"CPU 和 GPU 是两个独立的设备，各有自己的内存。","options":[],"answer":"正确","answerText":"正确","explain":"CPU 和 GPU 是两个独立的设备，各有自己的内存。计算要求所有输入数据在同一设备上。数据在设备间移动有开销。"},{"id":222,"chapter":"层和块与参数管理","type":"judge","stem":"如果模型在 GPU、数据在 CPU，框架会自动把数据移到 GPU。","options":[],"answer":"错误","answerText":"错误","explain":"框架不会自动把数据移到 GPU。计算要求所有输入数据在同一设备上。如果模型在 GPU、数据在 CPU，计算会报错。"},{"id":223,"chapter":"层和块与参数管理","type":"judge","stem":"初始化尺度不影响梯度流动。","options":[],"answer":"错误","answerText":"错误","explain":"初始化尺度会影响梯度流动。尺度过大可能导致梯度爆炸，过小可能导致梯度消失。"},{"id":224,"chapter":"层和块与参数管理","type":"judge","stem":"在 GPU 上累积日志，每隔一段时间搬一次，可以减少设备同步次数。","options":[],"answer":"正确","answerText":"正确","explain":"在 GPU 上累积日志，每隔一段时间搬一次，可以减少设备同步次数，提高性能。每一步都 loss.item( ) 会触发全局解释器锁，阻塞 GPU。"},{"id":225,"chapter":"层和块与参数管理","type":"judge","stem":"参数绑定到优化器时，优化器、设备、模型共享同一份参数。","options":[],"answer":"正确","answerText":"正确","explain":"优化器、设备、模型共享同一份参数。如果你把参数复制了一份，优化器更新的是副本，模型用的还是原来的，训练就不会生效。"},{"id":226,"chapter":"层和块与参数管理","type":"judge","stem":"延后初始化让修改模型架构变得容易。","options":[],"answer":"正确","answerText":"正确","explain":"延后初始化让框架自动推断参数形状，修改模型架构时不需要手动修改每一层的输入维度，避免维度错误。"},{"id":227,"chapter":"层和块与参数管理","type":"judge","stem":"数据在设备间移动有性能开销。","options":[],"answer":"正确","answerText":"正确","explain":"数据在设备间移动有性能开销，频繁的小数据移动会显著降低性能。建议一次性移动较大的数据块。"},{"id":228,"chapter":"卷积神经网络","type":"single","stem":"卷积神经网络相比全连接层，最核心的优势是( )","options":[{"key":"A","text":"参数更多"},{"key":"B","text":"利用了图像的平移不变性和局部性"},{"key":"C","text":"不需要激活函数"},{"key":"D","text":"不需要训练"}],"answer":["B"],"answerText":"B","explain":"卷积层通过权重共享和局部连接，把图像的平移不变性和局部性编码进了网络结构。这是 CNN 相比全连接层最核心的优势。"},{"id":229,"chapter":"卷积神经网络","type":"single","stem":"卷积层的权重共享对应图像的( )","options":[{"key":"A","text":"局部性"},{"key":"B","text":"平移不变性"},{"key":"C","text":"颜色不变性"},{"key":"D","text":"旋转不变性"}],"answer":["B"],"answerText":"B","
